# ===== TIP OF THE DAY =====

tip.dialog.heading = Nasvet dneva
tip.dialog.dontShowAgain = Ne prikaži več
tip.dialog.next = Naslednji nasvet
tip.dialog.close = Zapri
tip.dialog.closeCountdown = Zapri ({0} s)
tip.count = 40
tip.1.title = Koherentno povprečenje seže globoko pod prag šuma.
tip.1.body = Pustite koherentno (kompleksno) povprečenje vklopljeno in naj FFT teče - ton se sešteva, šum pa se delno izniči, zato prag pada, dlje ko čakate.
tip.2.title = Pripnite generator na FFT bin za čist spekter.
tip.2.body = Z vklopljeno možnostjo »Pripni frekvenco na najbližjo« ton pristane točno na binu, zato uhajanje ne razmaže osnovne frekvence in ocene harmonikov ostanejo zanesljive.
tip.3.title = Pripnite osnovno frekvenco ročno na zarezi twin-T.
tip.3.body = Pasivna ničla twin-T je tako strma, da že nekaj desetink herca toplotnega lezenja zaziblje de-vgrajeno osnovno frekvenco. Vnesite raven, ki jo dejansko poznate, z možnostjo »Ročna osnovna«; harmoniki na blagi strani se de-vgradijo brez težav.
tip.4.title = Bitno natančen je v brskalniku le QA40x.
tip.4.body = Stran nima ekskluzivnega načina: zajem prek Web Audio pride do nje kot float32 šele za deljenim mešalnikom Windows, zato je vse, kar je ta mešalnik naredil, že v vzorcih. QA40x je izjema - mešalnik obide tako, da sploh ni zvočna kartica, in se bere neposredno prek WebUSB.
tip.5.title = Miškino kolesce povečuje okrog kazalca.
tip.5.body = V katerem koli pogledu sledi: kolesce premika navpično, Shift+kolesce vodoravno, Ctrl+kolesce povečuje navpično os in Ctrl+Shift+kolesce vodoravno - obe povečavi ohranjata vrednost pod kazalcem nespremenjeno.
tip.6.title = Vsako numerično polje sprejme enote, kolesce in tipkovnico.
tip.6.body = Vnesite vrednost z njeno enoto (µV, 1.5 V, -3 dBV, 2 kHz), zavrtite kolesce, kliknite puščici gor/dol ali pritisnite tipki gor/dol za korak.
tip.7.title = Interpolacija sinc je pomembna le pri povečavi.
tip.7.body = Stikalo Sin/Lin spremeni sled le, ko so vzorčne točke na zaslonu nekaj slikovnih pik narazen; sicer so ravne črte videti enako in stanejo manj procesorja. Vklopite ga, ko postanejo posamezni vzorci vidni.
tip.8.title = Histereza stabilizira proženje na šibkem, šumnem signalu.
tip.8.body = Brez nje šum okrog ravni proženja sproži plaz lažnih prožitev in sled trepeta. Omogočite histerezo proženja in sled se zaklene.
tip.9.title = Shranjen signal generatorja je popolna referenca.
tip.9.body = »Shrani v...« zapiše idealno, matematično natančno valovno obliko - brez popačenja DAC, ojačevalnika ali kabliranja. Podajte jo drugemu instrumentu in vsaka nepopolnost, ki jo izmerite, pripada tej napravi, ne viru.
tip.10.title = De-vgradite napravo z umeritveno datoteko.
tip.10.body = Enkrat izmerite odziv zareze, slabilnika ali zvočne kartice v modulu Frekvenčni odziv, nato naložite to datoteko .frc v analizator FFT: njen odziv se ob prikazu odšteje, zato tabela prikaže napravo v preizkusu.
tip.11.title = Prekrivka rekonstruiranega utripa ukroti tesni dvotonski par.
tip.11.body = V dvotonskem načinu osciloskopova prekrivka »Rekonstruiran utrip« izriše počasno ovojnico |f1 - f2|, zato lahko prožite na utripu namesto loviti hitra prečkanja nosilca.
tip.12.title = Frekvenčni sweep je sam svoja referenca.
tip.12.body = Prepleteno merjenje je dekonvolvirano glede na natančni sweep, ki je bil predvajan - ne na ponovno izmerjeno kopijo - zato sta povrnjeni magnituda in faza prava prenosna funkcija naprave.
tip.13.title = Ctrl+F1 skoči naravnost na pravo pomoč.
tip.13.body = Pritisnite F1 kjer koli za priročnik ali Ctrl+F1, da odprete pomoč točno pri razdelku za kontrolnik, ki ima trenutno fokus.
tip.14.title = Rezidualni pogled pokaže, kaj se skriva pod osnovno frekvenco.
tip.14.body = Preklopite kanal na »Rezidual« in osciloskop izriše zajeti signal minus njegov najbolje prilegajoči se ton - popačenje, šum in motnje, zakopane pod osnovno frekvenco, postanejo vidni. Deluje tudi dvotonski način: obe frekvenci sta izmerjeni iz samega zajema, zato prosto tekoči uri DAC in ADC ne moreta razmazati odštevanja.
tip.15.title = Čez izmerjeni odziv položite idealni filter.
tip.15.body = Zavihek Filtri modula Frekvenčni odziv zasidra idealni nizkoprepustni, visokoprepustni, pasovnoprepustni ali zarezni filter (Butterworth, Čebišev, inverzni Čebišev, eliptični, Bessel) na izmerjeno krivuljo, Primerjava pa izriše odstopanje od njega - prav tako kot proti RIAA.
tip.16.title = Naj odčitek Neenakomernosti presodi ravnost namesto vas.
tip.16.body = Na zavihku Neenakomernost poiščite robova pasu, kjer odziv prvič zapusti koridor ±X dB od svojega vrha (ali od minimuma pri zarezi), ali odčitajte odstopanje ± na izbranem območju - označeno neposredno na grafu, s številkami, izrisanimi kot prekrivna tabela na krivulji.
tip.17.title = Umeritev polne skale pripada zvočni kartici.
tip.17.body = Vsaka kartica hrani svoj profil: po ena vrstica za vsak slabilnik ali območje DIP, ločeni vrednosti za levo in desno, ujemanje po imenu naprave na vsakem zaledju - zato menjava naprav ali zaledij nikoli ne pomeša umeritev. Znane kartice so na voljo prednastavljene; vaša umeritev s križcem jih izpopolni.
tip.18.title = Krmilite le kanal, ki ga merite.
tip.18.body = Generator, sweep frekvenčnega odziva in uglaševalnik zareze imajo vsak svoj izbirnik Izhodni kanal - Oba, samo Levi ali samo Desni - ki v živo preklaplja krmiljeno pot. Priročno za preverjanje presluha in za naprave z enim samim vhodom.
tip.19.title = Pri močnem oddaljenju osciloskop izrisuje kot pravi DSO.
tip.19.body = Nad enim vzorcem na slikovno piko postane sled slika digitalnega fosforja: histogram zadrževanja vsakega stolpca, potegnjen s peresom nastavljene širine sledi - ozki impulzi in ovojnice utripov ohranijo pravo vrednost vrh-vrh pri vsaki povečavi, svetlost pa pokaže, kje se signal zadržuje.
tip.20.title = Zajemi z motnjami nikoli ne zastrupijo dolgega povprečenja.
tip.20.body = FFT zavrne bloke, ki vsebujejo spoje, izpade ali motnje, ki kršijo pasovno omejitev, preden vstopijo v povprečje, nato se znova sinhronizira in povprečenje nadaljuje. Pri majhnem ali nesinusnem signalu, ki sproži ta vrata ob vsakem bloku, odstranite kljukico pri »Zaznaj časovno nezveznost« na zavihku nastavitev FFT.
tip.21.title = SNR in ENOB ostaneta poštena tudi pri širokem ali šumnem tonu.
tip.21.body = Ocene šuma izključijo ne le osnovne frekvence in njenih harmonikov, temveč tudi celotno pobočje uhajanja in faznega šuma - izključeni pas se razširi in sledi širokemu ali trepetajočemu tonu vse do praga, zato široko pobočje nikoli ne napihne SNR ali ENOB.
tip.22.title = Izpustite enoto - gole številke pomenijo osnovno enoto.
tip.22.body = Vnesite samo številko in polje jo sprejme v svoji osnovni enoti - 1000 v frekvenčnem polju je 1000 Hz, v amplitudnem polju 1000 V, v časovnem polju 1000 s. Tudi kiloherc ima kratke oblike: 1.5k, 1.5kh in 1.5khz vsi pomenijo 1.5 kHz.
tip.23.title = Povlecite pravokotnik in povečajte točno na to območje.
tip.23.body = V pogledih osciloskopa, FFT in frekvenčnega odziva povlecite z levim gumbom in z elastičnim pravokotnikom zajemite območje, ki vas zanima - ob spustu zapolni pogled. Ctrl+Z se pomika nazaj skozi zadnjih 32 povečav pogleda pod kazalcem.
tip.24.title = Nastavite dither v dBV in ga odčitajte naravnost s praga šuma FFT.
tip.24.body = Polje ditherja generatorja sprejme število bitov ali raven v dBV, dBV pa že vključuje šumno pasovno širino okna FFT - zato pri nekoherentnem (močnostnem) povprečenju prag šuma FFT pristane točno tam, kamor ga nastavite: vnesite −100 dBV in prag leži pri −100 dBV. Koherentno povprečenje šum izniči in odčita precej nižje.
tip.25.title = Strojni opremi ni treba stati na vaši mizi.
tip.25.body = Poženite Phonalyser kot strežnik na računalniku, na katerega so priklopljeni vaši pretvorniki, nato pritisnite Strežniki... v oknu Nastavitve → Zvok. Tabela se odpre prazna: enkrat vnesite gostitelja in vrata tiste delovne mize (privzeto 8377) pod »Dodaj strežnik ročno«, njen lastni seznam strežnikov pa doda vse ostale. Njena zaledja se nato pridružijo seznamu zaledij, naprave, kartice, umerjanje, generator in sweepi pa delujejo, kot bi bila kartica priklopljena tukaj.
tip.26.title = Naprava na mizi, na kateri meri nekdo drug, to sama pove.
tip.26.body = Vsaka strežnikova naprava je hkrati zaklenjena na enega samega odjemalca, naprava, ki jo drži drug operater, pa je kar v seznamu naprav označena z »uporablja« in imenom tega odjemalca - tako to izveste, preden zaženete zajem, ne šele potem.
tip.27.title = Harmonike odčitajte naravnost z osi z dBr.
tip.27.body = Preklopite enoto magnitude FFT na dBr in osnovna frekvenca bo natanko na 0, tako da se vsak harmonik in vsaka motnja odčita neposredno kot »toliko in toliko dB pod tonom«. Referenca je prikazana osnovna frekvenca in se znova prebere ob vsakem izrisu, zato sledi tudi lezoči ravni.
tip.28.title = Izhodno raven vnesite v dBFS, kadar mislite polno skalo.
tip.28.body = Generator, sweep frekvenčnega odziva in čarovnik za uglaševanje zareze sprejmejo amplitudo v dBFS - s pripono dbfs ali na kratko dbf - in jo v tej enoti tudi naprej prikazujejo. 0 dBFS je sinus polne skale, zato številka ne spremeni pomena, ko zamenjate valovno obliko.
tip.29.title = Amplitudni histogram na prvi pogled loči rezanje od šuma.
tip.29.body = Odprite ga iz orodne vrstice osciloskopa: sinus nariše kad med svojima obratnima točkama, širokopasovni šum Gaussov zvon, odrezan signal pa oster vrh točno tam, kjer je meja. Valovna oblika, odrezana le na eni strani, se pokaže kot neenako visoka stolpca ob sredinski črti.
tip.30.title = Vhodni obseg QA40x »0 dBV« ni 0 dBV RMS.
tip.30.body = Tabela Obsegi to pove naravnost - 0 "dBV" real 0 dBFS or -9 dBV - ker je vhodni obseg QA referenca dBFS od vrha do vrha preko diferencialnega para, katerega prava polna skala v RMS leži približno 9 dB nižje. Izhodni obsegi so pristni dBV.
tip.31.title = Vaša umeritev vam lahko sledi na mizo.
tip.31.body = Izberite strežniško napravo brez umeritve, medtem ko ima ta računalnik ustrezno umerjeno kartico, in Phonalyser ponudi prepis vrednosti - enkrat na sejo in nikoli tiho. Če zavrnete, se ne zapiše nič.
tip.32.title = QA403 teče pri 384 kHz, QA402 ne.
tip.32.body = Seznam frekvenc sledi dejansko priklopljenemu analizatorju - register vzorčne frekvence ima četrto kodo, ki jo ima le QA403. Zajem in generator tečeta pri frekvenci, ki jo izberete, ker si smeri delita eno samo strojno uro.
tip.33.title = QA40x lahko krmili pretvornik naravnost iz vrat I2S na sprednji plošči.
tip.33.body = Vklopite vrata v oknu Nastavitve QA40x in seznam bitne globine izhoda ponudi 16 in 32 bitov teh vrat namesto 24 bitov analizatorja, vhod pa ves čas ostane na 24. Je poskusno: QuantAsylum dokumentira priključek, ne pa tudi registrov, ki ga vklopijo.
tip.34.title = Dolgega sweepa ni več treba počakati do konca.
tip.34.body = Okno poteka frekvenčnega odziva ima gumb Prekliči. Je sodelovalno - sweep se konča po običajni poti ustavitve, zato se okno zapre in podokno odklene natanko kot po dokončanem teku, z vrnjenima zajemom in generatorjem.
tip.35.title = Tudi gladko videti frekvenčni odziv je lahko odrezan.
tip.35.body = Če je zajem dosegel polno skalo, vas opozori takoj, ko se sled pokaže. Dekonvolucija spremeni odrezan posnetek v drobno pravilno valovitost, ki je bolj podobna šumu kot okvari, zato raje znižajte pogonsko raven, kot da bi krivulji zaupali.
tip.36.title = Shraniti je mogoče vsak frekvenčni odziv na zaslonu.
tip.36.body = Zavihek Shrani v... zapiše prikazano krivuljo v datoteko brez sleherne zahteve po kakovosti - sweep, ki ste ga pravkar posneli, tak, ki je bil gnan nežno, ali tak, naložen nazaj z diska. Zahteva le, da meritev sploh obstaja.
tip.37.title = Kartico priklopite brez ponovnega zagona programa.
tip.37.body = Poišči naprave v oknu Nastavitve → Zvok znova prebere seznam naprav brskalnika, znova sestavi seznam zaledij - zato se QA40x, priklopljen šele po zagonu, sploh pojavi kot zaledje - in povezano delovno mizo znova vpraša po njenih zaledjih.
tip.38.title = Nastavitve vam povedo, kdaj so vaši volti le ugibanje.
tip.38.body = Ob zapiranju zavihka Zvok po zamenjavi zaledja ali naprave se preveri, ali potrjena izbira res vodi do izmerjene polne skale, in če ne, poimenuje vhod, izhod ali oboje. Kartica, vezana na napravo, a polna ničel, šteje za neumerjeno - prazna vrstica ni meritev.
tip.39.title = Mrtev vhod to pove, namesto da bi risal ravno črto.
tip.39.body = Izklopite kartico ali pustite, da jo izključno prevzame drug program, in osciloskop ter FFT se ustavita z enim samim pogovornim oknom, ki poimenuje zaledje in pove, ali je bila naprava izgubljena ali je le nehala dostavljati vzorce. Predvajalna stran je nadzorovana enako.
tip.40.title = Shranjena nastavitev, ki je ni mogoče razčleniti, se nikoli ne prepiše.
tip.40.body = Vaše nastavitve in kartice živijo v krajevni shrambi brskalnika, ne v datotekah. Vrednost, ki je ni mogoče razčleniti, se odloži ob stran pod isti ključ s pripono .corrupt, zagon pa se začne s privzetimi vrednostmi, tako da vsaka umeritev v njej preživi za reševanje, namesto da bi jo zabetoniralo naslednje shranjevanje.

