# ===== TIP OF THE DAY =====

tip.dialog.heading = Vísbending dagsins
tip.dialog.dontShowAgain = Ekki sýna aftur
tip.dialog.next = Næsta vísbending
tip.dialog.close = Loka
tip.dialog.closeCountdown = Loka ({0}s)
tip.count = 40
tip.1.title = Samfösuð meðaltöltun grefur langt niður fyrir hávaðagólfið.
tip.1.body = Hafðu samfösaða (tvinntölu) meðaltöltun á og láttu FFT keyra - tónninn leggst saman á meðan hávaðinn eyðist að hluta, svo gólfið heldur áfram að lækka því lengur sem þú bíður.
tip.2.title = Smelltu rafalanum á FFT-bil til að fá hreint róf.
tip.2.body = Með „Smella tíðni á næsta“ á lendir tónninn nákvæmlega á bili, svo leki smyr ekki út grunntóninn og yfirtóna­matið helst heiðarlegt.
tip.3.title = Festu grunntóninn handvirkt á tvíburaT-deyfi.
tip.3.body = Hlutlaus tvíbura-T núllun er svo brött að fáein tíundu úr hertsi af varmareki sveiflar afmótaða grunntóninum. Sláðu inn stigið sem þú raunverulega þekkir með „Handvirkur grunntónn“; yfirtónarnir, á aflíðandi hliðinni, afmótast vel.
tip.4.title = Aðeins QA40x er bitanákvæmur í vafra.
tip.4.body = Vefsíða hefur engan einkaham: Web Audio-gripið berst til hennar sem float32 eftir sameiginlega blandara Windows, svo hvað sem sá blandari gerði er þegar komið í sýnin. QA40x er undantekningin - hann fer fram hjá blandaranum með því að vera alls ekki hljóðkort, og er lesinn beint um WebUSB.
tip.5.title = Músarhjólið þysjar í kringum bendilinn.
tip.5.body = Í hvaða feril-sýn sem er: hjólið færir lóðrétt, Shift+hjól lárétt, Ctrl+hjól þysjar lóðrétta ásinn og Ctrl+Shift+hjól þann lárétta - báðar þysjanir halda gildinu undir bendlinum föstu.
tip.6.title = Hvert talnareit tekur við einingum, hjólinu og lyklaborðinu.
tip.6.body = Sláðu inn gildi með einingu sinni (µV, 1.5 V, -3 dBV, 2 kHz), skrunaðu hjólinu, smelltu á upp/niður örvarnar, eða ýttu á upp/niður lykla lyklaborðsins til að þrepa.
tip.7.title = Sinc-brúun skiptir aðeins máli þegar þú ert aðþysjuð inn.
tip.7.body = Sin/Lin rofinn breytir ferlinum aðeins þegar sýnapunktar eru fáeinir mynddílar í sundur á skjánum; annars líta beinar línur eins út og kosta minni örgjörva. Kveiktu á því þegar einstök sýni eru sýnileg.
tip.8.title = Stökkdeyfing kyrrir kveikjuna á veiku, hávaðasömu merki.
tip.8.body = Án hennar kveikir hávaði í kringum kveikjustigið hrinu af fölskum kveikjum og ferillinn titrar. Virkjaðu kveikju­stökkdeyfingu og ferillinn læsist.
tip.9.title = Vistað rafalsmerki er fullkomið viðmið.
tip.9.body = „Vista í...“ ritar hina kjörnu, stærðfræðilega nákvæmu bylgjuform - engin DAC-, magnara- eða lögn-bjögun. Mataðu því í annað mælitæki og hver ófullkomleiki sem þú mælir tilheyrir því tæki, ekki upptökunni.
tip.10.title = Afmótaðu festingu með kvörðunarskrá.
tip.10.body = Mældu deyfi, deyfara eða svörun hljóðkorts einu sinni í Tíðnisvörunar-einingunni, hlaðaðu síðan þeirri .frc inn í FFT-greininn: svörun hennar er deilt út við birtingu, svo taflan sýnir tækið sem prófað er.
tip.11.title = Endurgerða sláttar-yfirlagið temur náið tvítóna par.
tip.11.body = Í tvítóna-ham teiknar „Endurgerður sláttur“-yfirlag sveiflusjárinnar hæga |f1 - f2| umslagið, svo þú getur kveikt á slættinum í stað þess að elta hröðu burðartíðni-þverunina.
tip.12.title = Tíðnisvörunar-sópunin er sitt eigið viðmið.
tip.12.body = Sópaða mælingin er affölduð gegn nákvæmlega þeirri sópun sem var spiluð - ekki endurmældu eintaki - svo endurheimt mögnun og fasi eru sönn yfirfærslufall tækisins.
tip.13.title = Ctrl+F1 stekkur beint í réttu hjálpina.
tip.13.body = Ýttu á F1 hvar sem er fyrir handbókina, eða Ctrl+F1 til að opna hjálpina á nákvæma kaflanum fyrir stýringuna sem er með fókus núna.
tip.14.title = Leifar-sýnin sýnir hvað leynist undir grunntóninum.
tip.14.body = Skiptu rás yfir á „Leif“ og sveiflusjáin teiknar gripna merkið að frádregnum best aðlagaða tóninum - bjögun, hávaði og truflanir grafnar undir grunntóninum verða sýnilegar. Tvítónn virkar líka: báðar tíðnirnar eru mældar úr gripna merkinu sjálfu, svo frjálsgangandi DAC- og ADC-klukkur geta ekki smurt út frádráttinn.
tip.15.title = Leggðu kjörsíu yfir mælda svörun.
tip.15.body = Síur-flipinn í Tíðnisvörunar-einingunni festir kjörna lágtíðni-, hátíðni-, bandpassa- eða deyfisíu (Butterworth, Chebyshev, andhverf Chebyshev, elliptísk, Bessel) við mælda ferilinn, og Bera saman teiknar frávikið frá henni - á sama hátt og gagnvart RIAA.
tip.16.title = Láttu Ójöfnuðar-aflesturinn dæma flatleikann fyrir þig.
tip.16.body = Á Ójöfnuður-flipanum finnurðu bandbrúnirnar þar sem svörunin fer fyrst út fyrir ±X dB gang frá hátindi sínum (eða frá lágmarki sínu fyrir deyfi), eða lest ± frávikið yfir valið svið - merkt beint inn á ferilinn, með tölunum teiknuðum sem yfirlagðri töflu ofan á ferlinum.
tip.17.title = Fullskala-kvörðun tilheyrir hljóðkortinu.
tip.17.body = Hvert kort geymir sitt eigið snið: ein röð fyrir hvern deyfara eða DIP-svið, aðskilin vinstri / hægri gildi, pöruð eftir tækjaheiti á hverjum bakenda - svo að skipti um tæki eða bakenda rugla aldrei kvörðunum saman. Þekkt kort bjóðast forstillt; krosshárs-kvörðunin þín fínpússar þau.
tip.18.title = Keyrðu aðeins rásina sem þú ert að mæla.
tip.18.body = Rafallinn, tíðnisvörunar-sópunin og deyfistillirinn hafa hver um sig Úttaksrás-veljara - Báðar, aðeins Vinstri eða aðeins Hægri - sem stýrir keyrðu akreininni í rauntíma. Hentugt til að kanna smit milli rása og fyrir tæki með eitt inntak.
tip.19.title = Langt útþysjuð teiknar sveiflusjáin eins og alvöru DSO.
tip.19.body = Yfir einu sýni á mynddíl verður ferillinn að stafrænni fosfórmynd: dvalarsúlurit hvers dálks, sópað með penna af stilltri ferilbreidd - mjóir púlsar og sláttarumslög halda sínu sanna topp-í-topp gildi við hvaða þys sem er, og birtan sýnir hvar merkið dvelur.
tip.20.title = Gallaðar upptökur eitra aldrei langt meðaltal.
tip.20.body = FFT hafnar blokkum sem innihalda samskeyti, brottföll eða truflanir sem brjóta bandmörkin áður en þær komast inn í meðaltalið, endursamstillir sig síðan og heldur meðaltöltuninni áfram. Fyrir lítið eða ósínuslaga merki sem hleypir hliðinu af í hverri blokk skaltu taka hakið af „Greina tímaósamfellu“ á FFT-stillingaflipanum.
tip.21.title = SNR og ENOB haldast heiðarleg undir breiðum eða hávaðasömum tóni.
tip.21.body = Hávaðatölurnar útiloka ekki aðeins grunntóninn og yfirtóna hans heldur allt leka- og fasahávaðapilsið hans - útilokaða bandið breikkar til að fylgja breiðum eða flöktandi tóni alla leið niður á gólfið, svo breitt pils ýkir aldrei SNR eða ENOB.
tip.22.title = Slepptu einingunni - berar tölur merkja grunneininguna.
tip.22.body = Sláðu bara inn tölu og reiturinn tekur hana í grunneiningu sinni - 1000 í tíðnireit er 1000 Hz, í sveifluvíddarreit 1000 V, í tímareit 1000 s. Kílóhertsið hefur líka styttri form: 1.5k, 1.5kh og 1.5khz merkja öll 1.5 kHz.
tip.23.title = Dragðu rétthyrning til að þysja nákvæmlega inn á það svæði.
tip.23.body = Í sveiflusjár-, FFT- og tíðnisvörunar-sýnunum skaltu draga með vinstri hnappi til að afmarka svæðið sem þú hefur áhuga á - við sleppingu fyllir það sýnina. Ctrl+Z stígur til baka gegnum síðustu 32 þysjanir sýnarinnar undir bendlinum.
tip.24.title = Stilltu dither í dBV og lestu það beint af FFT-gólfinu.
tip.24.body = Dither-reitur rafalsins tekur við bitum eða dBV-stigi, og dBV-gildið felur þegar í sér hávaðabandbreidd FFT-gluggans - svo með ósamfösaðri (afl-)meðaltöltun lendir FFT-hávaðagólfið nákvæmlega þar sem þú stillir það: sláðu inn −100 dBV og gólfið situr á −100 dBV. Samfösuð meðaltöltun eyðir hávaðanum og sýnir mun lægra gólf.
tip.25.title = Vélbúnaðurinn þarf ekki að vera á þínu borði.
tip.25.body = Keyrðu Phonalyser sem netþjón á vélinni sem breytarnir þínir eru tengdir við, ýttu svo á Netþjónar... í Stillingar → Hljóð. Taflan opnast tóm: sláðu einu sinni inn hýsil og gátt þess mælibekks (8377 sjálfgefið) undir „Bæta netþjóni við handvirkt“, og hans eigin jafningjatafla fyllir út afganginn. Bakendar hans bætast þá við bakenda-listann, og tæki, kort, kvörðun, rafallinn og sópanirnar virka öll eins og kortið væri tengt hér.
tip.26.title = Mælibekkjartæki sem einhver annar er að mæla á segir frá því.
tip.26.body = Hvert tæki netþjóns er læst einum biðlara í einu, og tæki sem annar notandi heldur sýnir „í notkun hjá“ ásamt nafni þess biðlara beint í tækjalistanum - svo þú kemst að því áður en þú byrjar upptöku, ekki eftir á.
tip.27.title = Lestu yfirtónana beint af ásnum með dBr.
tip.27.body = Skiptu mögnunareiningu FFT yfir í dBr og grunntónninn situr nákvæmlega á 0, svo hver yfirtónn og hver gaddur lesist beint sem „svona mörg dB undir tóninum“. Viðmiðið er sýndi grunntónninn og það er lesið aftur við hverja endurteiknun, svo það fylgir stigi sem rekur.
tip.28.title = Sláðu inn úttaksstig í dBFS þegar þú átt við fullan skala.
tip.28.body = Rafallinn, tíðnisvörunar-sópunin og deyfistillingar-hjálpin taka allar við sveifluvídd í dBFS - viðskeytið dbfs, eða stutta dbf - og halda áfram að sýna hana í þeirri einingu. 0 dBFS er sínus í fullum skala, svo talan skiptir ekki um merkingu þegar þú skiptir um bylgjuform.
tip.29.title = Stuðlarit útslags greinir klippingu frá hávaða í einni sjónhendingu.
tip.29.body = Opnaðu það af tækjastiku sveiflusjárinnar: sínus teiknar baðkar tveggja vendipunkta sinna, breiðbandshávaði Gauss-bjöllu, og klippt merki harðan gadd þar sem þakið er. Bylgjuform sem er klippt aðeins öðrum megin birtist sem ójafnar súlur sitt hvorum megin við miðlínuna.
tip.30.title = „0 dBV“ inntakssvið á QA40x er ekki 0 dBV RMS.
tip.30.body = Sviðataflan segir það berum orðum - 0 "dBV" real 0 dBFS or -9 dBV - því QA-inntakssvið er topp-í-topp dBFS-viðmið yfir mismunaparið, og sannur RMS-fullskali þess situr um 9 dB neðar. Úttakssviðin eru hins vegar ekta dBV.
tip.31.title = Kvörðunin þín getur fylgt þér á mælibekkinn.
tip.31.body = Veldu netþjónstæki sem hefur enga kvörðun á meðan þessi vél geymir kvarðað kort sem passar við það, og Phonalyser býðst til að afrita gildin yfir - einu sinni á hverri setu, og aldrei hljóðlega. Segðu nei og ekkert er ritað.
tip.32.title = QA403 keyrir á 384 kHz; QA402 ekki.
tip.32.body = Tíðnilistinn fylgir greininum sem raunverulega er tengdur - sýnatökutíðni-gistið hefur fjórða kóða sem aðeins QA403 hefur. Bæði gripið og rafallinn keyra á þeirri tíðni sem þú velur, því báðar áttir deila einni vélbúnaðarklukku.
tip.33.title = QA40x getur keyrt breyti beint frá I2S-tenginu á framhliðinni.
tip.33.body = Kveiktu á tenginu undir Stillingar QA40x og bitadýptarlisti úttaksins býður 16 og 32 bita tengisins í stað 24 bita greinisins, á meðan inntakið helst á 24 allan tímann. Þetta er á tilraunastigi: QuantAsylum skjalfestir tengið, en ekki gistin sem virkja það.
tip.34.title = Ekki þarf lengur að bíða langa sópun af sér.
tip.34.body = Framvindugluggi tíðnisvörunarinnar ber hnappinn Hætta við. Hann er samvinnufús - sópunin endar um venjulegu stöðvunarleiðina, svo glugginn lokast og spjaldið opnast aftur nákvæmlega eins og eftir fullkláraða keyrslu, með gripið og rafalinn afhent til baka.
tip.35.title = Tíðnisvörun sem lítur slétt út getur samt verið klippt.
tip.35.body = Ef gripið náði fullum skala færðu viðvörun um leið og ferillinn birtist. Affelding breytir upptöku sem rakst í þakið í fína reglulega gárun sem lesist frekar sem hávaði en sem skemmd, svo lækkaðu drifstigið í stað þess að treysta ferlinum.
tip.36.title = Sérhverja tíðnisvörun á skjánum má vista.
tip.36.body = Flipinn Vista í... skrifar sýnda ferilinn í skrá án nokkurs konar gæðaskilyrðis - sópun sem þú keyrðir rétt í þessu, sópun sem var keyrð mjög vægt eða feril sem hlaðinn var aftur inn af diski. Það eina sem hann fer fram á er að einhver mæling sé til.
tip.37.title = Stingdu korti í samband án þess að endurræsa forritið.
tip.37.body = Leita að tækjum í Stillingar → Hljóð telur upp tækjalista vafrans á nýtt, setur bakenda-listann saman aftur - þannig birtist QA40x sem stungið er í samband eftir ræsingu yfirhöfuð sem bakendi - og spyr tengdan mælibekk aftur um bakenda hans.
tip.38.title = Stillingarnar segja þér þegar voltin þín eru ágiskun.
tip.38.body = Þegar Hljóð-flipanum er lokað eftir breytingu á bakenda eða tæki er athugað hvort staðfesta valið leysist raunverulega upp í mældan fullskala, og inntakið, úttakið eða hvort tveggja er nefnt ef svo er ekki. Kort sem er bundið tækinu en geymir aðeins núll telst ókvarðað - auð röð er ekki mæling.
tip.39.title = Dautt inntak segir frá því í stað þess að teikna flata línu.
tip.39.body = Taktu kortið úr sambandi, eða leyfðu öðru forriti að taka það einkarétti, og sveiflusjáin og FFT stöðvast með einum glugga sem nefnir bakendann og segir hvort tækið tapaðist eða hætti aðeins að skila sýnum. Afspilunarhliðin er vöktuð á sama hátt.
tip.40.title = Vistaðri stillingu sem ekki er hægt að þátta er aldrei skrifað yfir.
tip.40.body = Stillingarnar þínar og kortin búa í staðargeymslu vafrans, ekki í skrám. Gildi sem ekki er hægt að þátta er afritað til hliðar undir sama lykil með viðskeytinu .corrupt og keyrslan hefst á sjálfgefnum gildum, svo hver kvörðun í því lifir af til endurheimtar í stað þess að næsta vistun steypi yfir hana.

