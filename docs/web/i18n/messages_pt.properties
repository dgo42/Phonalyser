# ===== TIP OF THE DAY =====

tip.dialog.heading = Dica do dia
tip.dialog.dontShowAgain = Não mostrar novamente
tip.dialog.next = Dica seguinte
tip.dialog.close = Fechar
tip.dialog.closeCountdown = Fechar ({0}s)
tip.count = 41
tip.1.title = A média coerente revela sinais muito abaixo do ruído de fundo.
tip.1.body = Deixe a média coerente (complexa) ligada e deixe a FFT correr - o tom soma-se enquanto o ruído se cancela parcialmente, por isso o piso continua a descer quanto mais esperar.
tip.2.title = Encaixe o gerador num bin da FFT para um espetro limpo.
tip.2.body = Com "Encaixar frequência no mais próximo" ligado, o tom assenta exatamente num bin, de modo que a fuga não esborrata a fundamental e as estimativas de harmónicos mantêm-se fiáveis.
tip.3.title = Fixe a fundamental manualmente num notch twin-T.
tip.3.body = Um null twin-T passivo é tão abrupto que umas décimas de hertz de deriva térmica fazem oscilar a fundamental desincorporada. Introduza o nível que realmente conhece com "Fundamental manual"; os harmónicos, no flanco suave, desincorporam-se bem.
tip.4.title = Num navegador, só o QA40x é bit-exato.
tip.4.body = Uma página não tem modo exclusivo: a captura Web Audio chega-lhe como float32 depois do mixer partilhado do Windows, por isso o que quer que esse mixer tenha feito já está nas amostras. O QA40x é a exceção - contorna o mixer por não ser sequer uma placa de som, e é lido diretamente por WebUSB.
tip.5.title = Não há backend nenhum a escolher para um osciloscópio mais rápido.
tip.5.body = A taxa de atualização do osciloscópio é fixada pelo callback do Web Audio e pelo caminho de desenho, não por um controlador que possa escolher. O que pode aumentar é a própria taxa de captura, e essa define-se no Windows no dispositivo e não nesta aplicação - veja "Dispositivo de entrada do Windows" no manual.
tip.6.title = A roda do rato faz zoom à volta do cursor.
tip.6.body = Em qualquer vista de traçado: a roda move na vertical, Shift+roda na horizontal, Ctrl+roda amplia o eixo vertical e Ctrl+Shift+roda o horizontal - ambos os zooms mantêm fixo o valor sob o ponteiro.
tip.7.title = Cada campo numérico aceita unidades, a roda e o teclado.
tip.7.body = Escreva um valor com a sua unidade (µV, 1.5 V, -3 dBV, 2 kHz), gire a roda, clique nas setas para cima/baixo ou prima as teclas para cima/baixo do teclado para incrementar.
tip.8.title = A interpolação sinc só importa quando está com zoom.
tip.8.body = O comutador Sin/Lin altera o traçado apenas quando os pontos de amostra estão a alguns pixels de distância no ecrã; caso contrário, as linhas retas parecem idênticas e custam menos CPU. Ligue-o assim que as amostras individuais forem visíveis.
tip.9.title = A histerese estabiliza o trigger num sinal fraco e ruidoso.
tip.9.body = Sem ela, o ruído em torno do nível de trigger dispara uma rajada de triggers falsos e o traçado treme. Ative a histerese de trigger e o traçado fixa-se.
tip.10.title = Um sinal de gerador guardado é uma referência perfeita.
tip.10.body = "Guardar em..." escreve a forma de onda ideal, matematicamente exata - sem distorção de DAC, amplificador ou cablagem. Alimente-a a outro instrumento e qualquer imperfeição que medir pertence a esse dispositivo, não à fonte.
tip.11.title = Desincorpore um dispositivo com um ficheiro de calibração.
tip.11.body = Meça uma vez a resposta de um notch, atenuador ou placa de som no módulo de Resposta em frequência, depois carregue esse .frc no analisador de FFT: a sua resposta é dividida na altura da exibição, de modo que a tabela mostra o dispositivo sob teste.
tip.12.title = A sobreposição de batimento reconstruído domina um par de dois tons próximos.
tip.12.body = No modo de tom duplo, a sobreposição "Batimento reconstruído" do osciloscópio desenha a envolvente lenta |f1 - f2|, para que possa disparar no batimento em vez de perseguir os cruzamentos rápidos da portadora.
tip.13.title = A varredura de resposta em frequência é a sua própria referência.
tip.13.body = A medição varrida é deconvolucionada contra a varredura exata que foi reproduzida - não uma cópia remedida - pelo que a magnitude e fase recuperadas são a verdadeira função de transferência do dispositivo.
tip.14.title = Ctrl+F1 salta diretamente para a ajuda certa.
tip.14.body = Prima F1 em qualquer lado para o manual, ou Ctrl+F1 para abrir a ajuda na secção exata do controlo que tem o foco no momento.
tip.15.title = A vista de resíduo mostra o que se esconde sob a fundamental.
tip.15.body = Comute um canal para "Resíduo" e o osciloscópio desenha o sinal capturado menos o seu tom de melhor ajuste - distorção, ruído e glitches enterrados sob a fundamental tornam-se visíveis. O tom duplo também funciona: ambas as frequências são medidas a partir da própria captura, pelo que relógios de DAC e ADC em oscilação livre não conseguem esborratar a subtração.
tip.16.title = Sobreponha um filtro ideal a uma resposta medida.
tip.16.body = O separador Filtros do módulo de Resposta em frequência ancora um passa-baixo, passa-alto, passa-banda ou notch ideal (Butterworth, Chebyshev, Chebyshev inverso, elíptico, Bessel) à curva medida, e Comparar traça o desvio em relação a ele - da mesma forma que contra a RIAA.
tip.17.title = Deixe a leitura de Irregularidade julgar a planura por si.
tip.17.body = No separador Irregularidade, encontre os limites de banda onde a resposta sai pela primeira vez de um corredor de ±X dB a partir do seu pico (ou do seu mínimo, para um notch), ou leia o desvio ± num intervalo escolhido - anotado diretamente no gráfico, com os valores desenhados como uma tabela sobreposta à curva.
tip.18.title = A calibração de fundo de escala pertence à placa de som.
tip.18.body = Cada placa guarda o seu próprio perfil: uma linha por atenuador ou gama DIP, valores separados para esquerda/direita, correspondidos pelo nome do dispositivo em todos os backends - por isso trocar de dispositivo ou de backend nunca baralha as calibrações. As placas conhecidas são oferecidas pré-configuradas; a sua calibração com a mira refina-as.
tip.19.title = Excite apenas o canal que está a medir.
tip.19.body = O gerador, a varredura de resposta em frequência e o sintonizador de notch têm, cada um, um seletor de Canal de saída - Ambos, apenas Esquerdo ou apenas Direito - que comuta ao vivo a via excitada. Útil para verificações de diafonia e para dispositivos com uma única entrada.
tip.20.title = Com o zoom muito afastado, o osciloscópio desenha como um verdadeiro DSO.
tip.20.body = Acima de uma amostra por pixel, o traçado torna-se uma imagem de fósforo digital: o histograma de permanência de cada coluna, varrido com uma pena da largura de traçado configurada - impulsos estreitos e envolventes de batimento mantêm o seu verdadeiro pico-a-pico em qualquer zoom, e o brilho mostra onde o sinal permanece.
tip.21.title = Capturas com glitches nunca envenenam uma média longa.
tip.21.body = A FFT rejeita blocos que contenham emendas, quebras ou glitches que violem o limite de banda antes de entrarem na média, depois ressincroniza e continua a fazer a média. Para um sinal pequeno ou não sinusoidal que dispara a rejeição em todos os blocos, desmarque "Detetar descontinuidade no tempo" no separador de definições da FFT.
tip.22.title = O SNR e o ENOB mantêm-se honestos com um tom largo ou ruidoso.
tip.22.body = As métricas de ruído excluem não só a fundamental e os seus harmónicos, mas toda a sua saia de fuga e de ruído de fase - a banda excluída alarga-se para acompanhar um tom largo ou com jitter até ao piso, por isso uma saia larga nunca inflaciona o SNR nem o ENOB.
tip.23.title = Dispense a unidade - dígitos simples significam a unidade base.
tip.23.body = Escreva apenas um número e o campo assume-o na sua unidade base - 1000 num campo de frequência são 1000 Hz, num campo de amplitude 1000 V, num campo de tempo 1000 s. Os quilohertz também têm formas abreviadas: 1.5k, 1.5kh e 1.5khz significam todos 1.5 kHz.
tip.24.title = Arraste um retângulo para ampliar exatamente essa região.
tip.24.body = Nas vistas do osciloscópio, da FFT e da resposta em frequência, arraste com o botão esquerdo para delimitar a área que lhe interessa - ao soltar, esta preenche a vista. Ctrl+Z recua pelos últimos 32 zooms da vista sob o ponteiro.
tip.25.title = Defina o dither em dBV e leia-o diretamente do piso da FFT.
tip.25.body = O campo de dither do gerador aceita bits ou um nível em dBV, e o dBV já inclui a largura de banda de ruído da janela da FFT - por isso, com média incoerente (de potência), o piso de ruído da FFT fica exatamente onde o definiu: introduza −100 dBV e o piso assenta em −100 dBV. A média coerente cancela o ruído e lê muito mais abaixo.
tip.26.title = O hardware não tem de estar na sua secretária.
tip.26.body = Execute o Phonalyser como servidor na máquina a que estão ligados os seus conversores e depois prima "Servidores..." em Preferências → Áudio. A tabela abre vazia: escreva uma vez o endereço e a porta dessa bancada (8377 por predefinição) em "Adicionar um servidor pelo endereço", e a tabela de servidores dela própria preenche o resto. Os backends dela juntam-se então à lista de backends e os dispositivos, as placas, a calibração, o gerador e as varreduras funcionam todos como se a placa estivesse ligada aqui.
tip.27.title = Um dispositivo de bancada em que outra pessoa está a medir di-lo.
tip.27.body = Cada dispositivo de um servidor está bloqueado a um cliente de cada vez, e um dispositivo que outro operador esteja a segurar mostra "em uso por" mais o nome desse cliente logo na lista de dispositivos - assim fica a saber antes de iniciar a captura, não depois.
tip.28.title = Leia os harmónicos diretamente do eixo com dBr.
tip.28.body = Mude a unidade de magnitude da FFT para dBr e a fundamental fica exatamente em 0, pelo que cada harmónico e cada espúrio se lê diretamente como "tantos dB abaixo do tom". A referência é a fundamental apresentada e é relida a cada redesenho, por isso continua a seguir um nível que deriva.
tip.29.title = Escreva o nível de saída em dBFS quando o que quer dizer é fundo de escala.
tip.29.body = O gerador, a varredura de resposta em frequência e o assistente de sintonia do notch aceitam todos uma amplitude em dBFS - sufixo dbfs, ou o curto dbf - e continuam a mostrá-la nessa unidade. 0 dBFS é uma sinusoide de fundo de escala, pelo que o número não muda de significado quando troca de forma de onda.
tip.30.title = O histograma de amplitude distingue ceifagem de ruído num relance.
tip.30.body = Abra-o a partir da barra de ferramentas do osciloscópio: uma sinusoide desenha a banheira dos seus dois pontos de inversão, o ruído de banda larga um sino gaussiano e um sinal ceifado um pico duro onde está o limite de alimentação. Uma forma de onda ceifada só de um lado aparece como barras desiguais em torno da linha central.
tip.31.title = Um intervalo de entrada QA40x de "0 dBV" não é 0 dBV RMS.
tip.31.body = A tabela de intervalos di-lo por extenso - 0 "dBV" real 0 dBFS or -9 dBV - porque um intervalo de entrada QA é uma referência dBFS pico-a-pico no par diferencial, cujo verdadeiro fundo de escala RMS fica cerca de 9 dB abaixo. Os intervalos de saída são dBV genuínos.
tip.32.title = A sua calibração pode acompanhá-lo até à bancada.
tip.32.body = Selecione um dispositivo de servidor sem calibração enquanto esta máquina tem uma placa calibrada que lhe corresponde, e o Phonalyser oferece-se para copiar os valores - uma vez por sessão e nunca em silêncio. Diga que não e nada é escrito.
tip.33.title = Um QA403 funciona a 384 kHz; um QA402 não.
tip.33.body = A lista de frequências segue o analisador que está realmente ligado - o registo da frequência de amostragem tem um quarto código que só o QA403 possui. A captura e o gerador funcionam ambos à frequência que escolher, porque as duas direções partilham um único relógio de hardware.
tip.34.title = O QA40x pode excitar um conversor diretamente pela porta I2S do painel frontal.
tip.34.body = Ligue a porta em "Preferências de QA40x" e a lista de profundidade de bits de saída passa a oferecer os 16 e 32 bits da porta em vez dos 24 do analisador, mantendo-se a entrada nos 24 durante todo o tempo. É experimental: a QuantAsylum documenta o conector, mas não os registos que o ativam.
tip.35.title = Já não é preciso esperar por uma varredura longa até ao fim.
tip.35.body = A janela de progresso da resposta em frequência tem um botão "Cancelar". O cancelamento é cooperativo - a varredura termina pelo caminho normal de paragem, por isso a janela fecha-se e o painel desbloqueia exatamente como após uma execução completa, com a captura e o gerador devolvidos.
tip.36.title = Uma resposta em frequência de aspeto suave pode mesmo assim estar ceifada.
tip.36.body = Se a captura atingiu o fundo de escala, é avisado assim que o traçado aparece. A deconvolução transforma uma gravação encostada ao limite numa ondulação fina e regular que se lê como ruído e não como estrago, por isso baixe o nível de excitação em vez de confiar na curva.
tip.37.title = Qualquer resposta em frequência no ecrã pode ser guardada.
tip.37.body = O separador "Guardar em..." escreve a curva apresentada num ficheiro sem qualquer critério de qualidade - uma varredura acabada de fazer, uma excitada suavemente ou uma carregada de novo do disco. A única coisa que exige é que exista uma medição.
tip.38.title = Ligue uma placa sem reiniciar a aplicação.
tip.38.body = "Procurar dispositivos" em Preferências → Áudio volta a enumerar a lista de dispositivos do navegador, volta a compor a lista de backends - é assim que um QA40x ligado depois do arranque chega sequer a aparecer como backend - e pergunta de novo a uma bancada ligada quais são os seus backends.
tip.39.title = As Preferências dizem-lhe quando os seus volts são palpites.
tip.39.body = Fechar o separador Áudio depois de mudar de backend ou de dispositivo verifica se a seleção confirmada resulta mesmo num fundo de escala medido e nomeia a entrada, a saída ou ambas quando não resulta. Uma placa associada ao dispositivo mas que guarda zeros conta como não calibrada - uma linha vazia não é uma medição.
tip.40.title = Uma entrada morta di-lo em vez de desenhar uma linha reta.
tip.40.body = Desligue a placa, ou deixe outra aplicação tomá-la em exclusivo, e o osciloscópio e a FFT param com um único diálogo que nomeia o backend e diz se o dispositivo se perdeu ou apenas deixou de entregar amostras. O lado da reprodução é vigiado da mesma forma.
tip.41.title = Uma definição guardada que não consegue ser interpretada nunca é sobrescrita.
tip.41.body = As suas definições e placas vivem no armazenamento local do navegador, não em ficheiros. Um valor que não consegue ser interpretado é copiado para o lado, na mesma chave com o sufixo .corrupt, e a execução começa pelas predefinições, para que todas as calibrações nele contidas sobrevivam para recuperação em vez de serem cimentadas pela gravação seguinte.

