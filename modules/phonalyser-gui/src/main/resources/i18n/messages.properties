# ===== DAC PREDISTORTION WIZARD =====

predistortion.button.wizard.tooltip = Measure and apply DAC predistortion.\nA DAC adds its own harmonics to the tone it plays.  The run\r\n\
  averages the uncompensated signal, reads each harmonic's level\r\n\
  and phase from the average once its phase has settled to the\r\n\
  accuracy the target THD needs, and builds the correction the\r\n\
  generator adds so that the harmonics cancel at the DAC output.\nSave the .dpd and Apply it to keep the compensated tone.



predistortion.wizard.title = DAC predistortion
predistortion.targetThd = Target THD, %
predistortion.targetThd.tooltip = The THD the compensation is to reach.  Each line's phase limit\r\n\
  follows from it: the accuracy the line's correction needs to keep\r\n\
  its residual within its share of the target, shared over the eight lines.
predistortion.targetImd = Target IMD, %
predistortion.targetImd.tooltip = The IMD the compensation is to reach.  Each product's phase limit\r\n\
  follows from it: the accuracy the product's correction needs to keep\r\n\
  its residual within its share of the target, shared over the eight products.
predistortion.minAverages = Min. averages, n
predistortion.minAverages.tooltip = The least averages a result needs before the run may settle on it:\r\n\
  below it the band tops of the weaker lines have not fallen far enough\r\n\
  for their readings to stand clear, whatever the phase wobbles say.
predistortion.intro = MANDATORY: DAC output, passive notch tuned to the fundamental, ADC input.\nA DAC adds its own harmonics to the tone it plays. The run averages the uncompensated signal and reads each harmonic's level and phase from the average; it ends when every harmonic or intermodulation product 5 dB above its local noise has an averaged phase settled to the accuracy the target THD needs, and builds the correction the generator adds so that the harmonics cancel at the DAC output.\nSave the .dpd and Apply it. Recommended: BH7 window.
