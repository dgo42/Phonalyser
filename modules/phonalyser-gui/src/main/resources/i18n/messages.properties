# ===== MEASURE DELAY DIALOG =====
measureDelay.title = Measure delay
measureDelay.intro = Measures the delay of the audio path from the output line to the capture - the output device's buffers, the DAC, the cable, the ADC and the input driver's buffers together; the output line's own queue is not part of it.\nConnect the chosen output channel DIRECTLY to the chosen input channel: no notch, no filter, no attenuator in between.  Stop the generator, the scope and the FFT first - the tool opens both audio devices itself.\nMeasure plays a short silence, then five rectangle pulses at the amplitude below, each edge written once the capture has seen the level before it.  Each edge's delay is the time the capture saw it through 0 V minus the time it left the output line for the device; the readout is the smallest of the ten.
