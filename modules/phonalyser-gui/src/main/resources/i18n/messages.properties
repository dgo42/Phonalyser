# ===== TIP OF THE DAY =====

tip.dialog.heading = Tip of the day
tip.dialog.dontShowAgain = Don't show again
tip.dialog.next = Next tip
tip.dialog.close = Close
tip.dialog.closeCountdown = Close ({0}s)
tip.count = 41
tip.1.title = Coherent averaging digs far below the noise floor.
tip.1.body = Leave coherent (complex) averaging on and let the FFT run - the tone adds up while the noise partly cancels, so the floor keeps dropping the longer you wait.
tip.2.title = Snap the generator to an FFT bin for a clean spectrum.
tip.2.body = With "Snap frequency to nearest" on, the tone lands exactly on a bin, so leakage doesn't smear the fundamental and the harmonic estimates stay honest.
tip.3.title = If you use a twin-T notch, enter the fundamental amplitude by hand.
tip.3.body = A passive twin-T notch filter is so steep that even a few tenths of a hertz of thermal drift in the fundamental frequency significantly alters the de-embedded amplitude. Enter the level you actually know with "Manual fundamental"; the harmonics, on the gentle flank, de-embed fine.
tip.4.title = WASAPI exclusive mode keeps the measurement bit-exact.
tip.4.body = Exclusive mode hands the device straight to Phonalyser, bypassing the Windows mixer and system sounds - nothing can poison the result.
tip.5.title = WDM-KS gives the oscilloscope the most frames per second.
tip.5.body = For the fastest live scope refresh, pick the WDM-KS backend in Preferences - it sits lower than WASAPI and pushes more capture blocks per second.
tip.6.title = The mouse wheel zooms around the cursor.
tip.6.body = In any trace view: wheel moves vertically, Shift+wheel horizontally, Ctrl+wheel zooms the vertical axis and Ctrl+Shift+wheel the horizontal - both zooms keep the value under the pointer fixed.
tip.7.title = Every numeric field takes units, the wheel, and the keyboard.
tip.7.body = Type a value with its unit (100uV [µV], 1.5 V, -3 dBV, 2 kHz), scroll the wheel, click the up/down arrows, or press the keyboard up/down keys to step.
tip.8.title = Sinc interpolation only matters when you're zoomed in.
tip.8.body = The Sin/Lin switch changes the trace only when sample points are a couple of pixels apart on screen; otherwise straight lines look identical and cost less CPU. It turns automatic on/off.
tip.9.title = Hysteresis stabilises the trigger on a weak, noisy signal.
tip.9.body = Without it, noise around the trigger level fires a flurry of false triggers and the trace jitters. Enable trigger hysteresis and the trace locks.
tip.10.title = A saved generator signal is a perfect reference.
tip.10.body = "Save to..." writes the ideal, mathematically exact waveform - no DAC, amplifier or cabling distortion. Feed it to another instrument and any imperfection you measure belongs to that device, not the source.
tip.11.title = De-embed a fixture with a calibration file.
tip.11.body = Measure a notch, attenuator or soundcard's response once in the Frequency-response module, then load that .frc into the FFT analyser: its shape is subtracted from the FFT during display, so the measurements show the device under test rather than everything mixed together.
tip.12.title = The reconstructed-beat overlay tames a close two-tone pair.
tip.12.body = In dual-tone mode the scope's "Reconstructed beat" overlay draws the slow |f1 - f2| envelope, so you can trigger on the beat instead of chasing the fast carrier crossings.
tip.13.title = The frequency-response sweep is its own reference.
tip.13.body = The swept measurement is deconvolved against the exact sweep that was played - not a measured signal - so the recovered magnitude and phase are the device's true transfer function.
tip.14.title = Ctrl+F1 jumps straight to the right help.
tip.14.body = Press F1 anywhere for the manual, or Ctrl+F1 to open the help at the exact section for the control that currently has focus.
tip.15.title = The residual view shows what hides under the fundamental.
tip.15.body = Flip a channel to "Residual" and the scope draws the captured signal minus its best-fit tone - distortion, noise and glitches buried under the fundamental become visible. Dual tone works too: both frequencies are measured from the capture itself, so free-running DAC and ADC clocks cannot smear the subtraction.
tip.16.title = Overlay an ideal filter on a measured response.
tip.16.body = The Frequency-response module's Filters tab anchors an ideal low-pass, high-pass, band-pass or notch (Butterworth, Chebyshev, inverse Chebyshev, elliptic, Bessel) to the measured curve, and Compare plots the deviation from it - the same way as against RIAA.
tip.17.title = Let the Unevenness readout judge flatness for you.
tip.17.body = On the Unevenness tab, find the band edges where the response first leaves a ±X dB corridor from its peak (or from its minimum for a notch), or read the ± deviation over a chosen range - annotated directly on the plot, with the figures drawn as an overlay table on the curve.
tip.18.title = Full-scale calibration belongs to the sound card.
tip.18.body = Each card keeps its own profile: one row per attenuator or DIP range, separate left / right values, matched by device name on every backend - so switching devices or backends never mixes calibrations up. Known cards are offered pre-configured; your crosshair calibration refines them.
tip.19.title = Drive only the channel you are measuring.
tip.19.body = The generator, the frequency-response sweep and the notch tuner each have an Output channel selector - Both, Left only, or Right only - that gates the driven lane live. Handy for crosstalk checks and single-input devices.
tip.20.title = Zoomed far out, the scope renders like a real DSO.
tip.20.body = Above one sample per pixel the trace becomes a digital-phosphor image: every column's dwell histogram, swept with a pen of the configured trace width - narrow pulses and beat envelopes keep their true peak-to-peak at any zoom, and brightness shows where the signal dwells.
tip.21.title = Glitched captures never poison a long average.
tip.21.body = The FFT rejects blocks containing splices, dropouts or band-limit-violating glitches before they enter the average, then re-syncs and keeps averaging. For a small or non-sinusoidal signal that trips the gate on every block, uncheck "Detect time discontinuity" on the FFT settings tab.
tip.22.title = SNR and ENOB stay honest under a wide or noisy tone.
tip.22.body = The noise figures exclude not just the fundamental and its harmonics but its whole leakage and phase-noise skirt - the excluded band widens to follow a broad or jittery tone down to the floor, so a wide skirt never inflates SNR or ENOB.
tip.23.title = Skip the unit - plain digits mean the base unit.
tip.23.body = Type just a number and the field takes it in its base unit - 1000 in a frequency field is 1000 Hz, in an amplitude field 1000 V, in a time field 1000 s. Kilohertz has short forms too: 1.5k, 1.5kh and 1.5khz all mean 1.5 kHz.
tip.24.title = Drag a rectangle to zoom into exactly that region.
tip.24.body = In the oscilloscope, FFT and frequency-response views, drag with the left button to rubber-band the area you care about - on release it fills the view. Ctrl+Z steps back through the last 32 zooms of the view under the pointer.
tip.25.title = Set dither in dBV and read it straight off the FFT floor.
tip.25.body = The generator's dither field takes bits or a dBV level, and the dBV already includes the FFT window's noise bandwidth - so with incoherent (power) averaging the FFT noise floor lands exactly where you set it: enter −100 dBV and the floor sits at −100 dBV. Coherent averaging cancels noise and reads far lower.
tip.26.title = The hardware does not have to be on your desk.
tip.26.body = Run Phonalyser as a server on the machine your converters are wired to, then press Servers... in Preferences -> Audio: that server's backends join the backend list beside the local ones, and from there devices, cards, calibration, the generator and the sweeps all work as though the card were plugged in here.
tip.27.title = A server device someone else is measuring on says so.
tip.27.body = Each of a server's devices is locked to one client at a time, and a device another operator holds reads "in use by" plus that client's name right in the device list - so you find out before you press Record, not after.
tip.28.title = Read harmonics straight off the axis with dBr.
tip.28.body = Switch the FFT's magnitude unit to dBr and the fundamental sits at exactly 0, so every harmonic and spur reads directly as "so many dB below the tone". The reference is the displayed fundamental and is re-read on every repaint, so it keeps following a drifting level.
tip.29.title = Type an output level in dBFS when full scale is what you mean.
tip.29.body = The generator, the frequency-response sweep and the tune-notch wizard all accept an amplitude in dBFS - suffix dbfs, or the short dbf - and keep displaying it in that unit. 0 dBFS is a full-scale sine, so the figure does not change meaning when you switch waveform.
tip.30.title = The amplitude histogram tells clipping from noise at a glance.
tip.30.body = Open it from the oscilloscope toolbar: a sine draws the bathtub of its two turning points, broadband noise a Gaussian bell, and a clipped signal a hard spike where the rail is. A waveform clipped on one side only shows as unequal bars about the centre line.
tip.31.title = A QA40x "0 dBV" input range is not 0 dBV RMS.
tip.31.body = The ranges table spells it out - 0 "dBV" real 0 dBFS or -9 dBV - because a QA input range is a peak-to-peak dBFS reference across the differential pair, whose true RMS full scale sits about 9 dB lower. The output ranges are genuine dBV.
tip.32.title = Your calibration can follow you onto the server.
tip.32.body = Select a server device that has no calibration while this machine holds a calibrated card matching it, and Phonalyser offers to copy the values across - once per session, and never silently. Say no and nothing is written.
tip.33.title = A QA403 runs at 384 kHz; a QA402 does not.
tip.33.body = The rate list follows the analyzer actually attached - the sample-rate register has a fourth code only the QA403 has. Capture and generator both run at whichever rate you pick, because the two directions share one hardware clock.
tip.34.title = The QA40x can drive a converter straight from its front-panel I2S port.
tip.34.body = Switch the port on under QA40x preferences and the output bit-depth list offers the port's 16 and 32 bits in place of the analyzer's 24, the input staying at 24 throughout. It is experimental: QuantAsylum documents the connector, but not the registers that enable it.
tip.35.title = A long sweep no longer has to be waited out.
tip.35.body = The frequency-response progress window carries a Cancel button. It is cooperative - the sweep ends through the ordinary stopped path, so the window closes and the pane unlocks exactly as after a completed run, with the capture and the generator handed back.
tip.36.title = A smooth-looking frequency response can still be clipped.
tip.36.body = If the capture reached full scale you are warned as soon as the trace appears. Deconvolution turns a railed recording into a fine regular ripple that reads like noise rather than like damage, so lower the drive level instead of trusting the curve.
tip.37.title = Any frequency response on screen can be saved.
tip.37.body = The Save to... tab writes the displayed curve to a file with no quality gate of any kind - a sweep you have just run, one driven gently, or one loaded back from disk. The only thing it asks is that a measurement exists.
tip.38.title = Plug a card in without restarting the application.
tip.38.body = Scan devices in Preferences -> Audio reads the selected backend's device list again, and a device that fails with the driver's "invalid device" triggers one automatic rescan and retry on its own.
tip.39.title = Preferences tells you when your volts are guesses.
tip.39.body = Closing the Audio tab after a backend or device change checks that the committed selection really resolves to a measured full scale, and names the input, the output or both when it does not. A card bound to the device but holding zeros counts as uncalibrated - an empty row is not a measurement.
tip.40.title = A dead input says so instead of drawing a flat line.
tip.40.body = Unplug the card, or let another application take it exclusively, and the oscilloscope and the FFT stop with one dialog naming the backend and saying whether the device was lost or merely stopped delivering samples. The playback side is watched the same way.
tip.41.title = A settings file that will not parse is never overwritten.
tip.41.body = A preferences.yaml or devices.yaml damaged by a crash is renamed to .corrupt beside itself and the failure logged, so every calibration in it can still be recovered by hand instead of being cemented over by the next save.

