# ===== TIP OF THE DAY =====

tip.dialog.heading = A nap tippje
tip.dialog.dontShowAgain = Ne jelenjen meg többé
tip.dialog.next = Következő tipp
tip.dialog.close = Bezárás
tip.dialog.closeCountdown = Bezárás ({0} mp)
tip.count = 41
tip.1.title = A koherens átlagolás mélyen a zajküszöb alá ás.
tip.1.body = Hagyd bekapcsolva a koherens (komplex) átlagolást, és hagyd futni az FFT-t - a hang összeadódik, miközben a zaj részben kioltja egymást, így a küszöb egyre lejjebb csúszik, minél tovább vársz.
tip.2.title = Igazítsd a generátort egy FFT-binhez a tiszta spektrumért.
tip.2.body = A "Frekvencia igazítása a legközelebbihez" bekapcsolásával a hang pontosan egy binre esik, így a szivárgás nem keni el az alapharmonikust, és a felharmonikus-becslések becsületesek maradnak.
tip.3.title = Rögzítsd kézzel az alapharmonikust egy twin-T notch-on.
tip.3.body = A passzív twin-T null annyira meredek, hogy néhány tized hertznyi termikus sodródás megrángatja a kibontott alapharmonikust. Add meg a ténylegesen ismert szintet a "Kézi alapharmonikus" mezőben; a felharmonikusok a szelíd letörésen rendben kibonthatók.
tip.4.title = A WASAPI kizárólagos mód bittiszta marad a méréshez.
tip.4.body = A kizárólagos mód közvetlenül a Phonalysernek adja át az eszközt, megkerülve a Windows keverőt és annak mintavételezésiráta-konverterét - nincs rejtett újramintavételezés, ami elszínezné az eredményt.
tip.5.title = A WDM-KS adja az oszcilloszkópnak a legtöbb képkockát másodpercenként.
tip.5.body = A leggyorsabb élő szkóp-frissítéshez válaszd a WDM-KS háttérprogramot a Beállításokban - alacsonyabban ül, mint a WASAPI, és több rögzítési blokkot tol ki másodpercenként.
tip.6.title = Az egérgörgő a kurzor körül nagyít.
tip.6.body = Bármely nyomvonalnézetben: a görgő függőlegesen mozgat, a Shift+görgő vízszintesen, a Ctrl+görgő a függőleges tengelyt nagyítja, a Ctrl+Shift+görgő pedig a vízszinteset - mindkét nagyítás fixen tartja a mutató alatti értéket.
tip.7.title = Minden számmező elfogadja a mértékegységeket, a görgőt és a billentyűzetet.
tip.7.body = Írj be egy értéket a mértékegységével (µV, 1.5 V, -3 dBV, 2 kHz), görgesd a görgőt, kattints a fel/le nyilakra, vagy nyomd meg a billentyűzet fel/le gombjait a léptetéshez.
tip.8.title = A sinc-interpoláció csak ránagyítva számít.
tip.8.body = A Sin/Lin kapcsoló csak akkor változtatja meg a nyomvonalat, ha a mintapontok pár pixelnyire vannak egymástól a képernyőn; egyébként az egyenes vonalak azonosnak látszanak, és kevesebb CPU-t igényelnek. Kapcsold be, ha az egyes minták már láthatók.
tip.9.title = A hiszterézis stabilizálja a triggert gyenge, zajos jelnél.
tip.9.body = Nélküle a triggerszint körüli zaj egy sereg hamis triggert indít, és a nyomvonal remeg. Kapcsold be a trigger-hiszterézist, és a nyomvonal beáll.
tip.10.title = Egy elmentett generátorjel tökéletes referencia.
tip.10.body = A "Mentés..." a tökéletes, matematikailag pontos jelalakot írja ki - nincs DAC-, erősítő- vagy kábelezési torzítás. Add egy másik műszernek, és bármilyen tökéletlenséget mérsz, az az eszközhöz tartozik, nem a forráshoz.
tip.11.title = Bonts ki egy kapcsolóeszközt kalibrációs fájllal.
tip.11.body = Mérd meg egy notch, attenuátor vagy hangkártya válaszát egyszer a Frekvenciaválasz modulban, majd töltsd be azt a .frc-t az FFT-analizátorba: a válasza megjelenítéskor leosztásra kerül, így a táblázat a vizsgált eszközt mutatja.
tip.12.title = A rekonstruált lebegés-fedvény megszelídít egy közeli kéthangú párt.
tip.12.body = Kéthangú módban a szkóp "Rekonstruált lebegés" fedvénye a lassú |f1 - f2| burkológörbét rajzolja, így a lebegésre triggerelhetsz a gyors vivő-keresztezések hajszolása helyett.
tip.13.title = A frekvenciaválasz-pásztázás önmaga referenciája.
tip.13.body = A pásztázott mérést a ténylegesen lejátszott pontos pásztázáshoz dekonvolválja - nem egy újramért másolathoz -, így a visszanyert amplitúdó és fázis az eszköz valódi átviteli függvénye.
tip.14.title = A Ctrl+F1 egyenesen a megfelelő súgóhoz ugrik.
tip.14.body = Nyomd meg az F1-et bárhol a kézikönyvért, vagy a Ctrl+F1-et, hogy a súgó pontosan annál a szakasznál nyíljon meg, amely az éppen fókuszban lévő vezérlőhöz tartozik.
tip.15.title = A reziduál nézet megmutatja, mi rejtőzik az alapharmonikus alatt.
tip.15.body = Kapcsolj egy csatornát "Reziduál" állásba, és a szkóp a rögzített jelet rajzolja ki a hozzá legjobban illesztett hang levonásával - az alapharmonikus alá temetett torzítás, zaj és tüskék láthatóvá válnak. A kéthangú mód is működik: mindkét frekvenciát magából a rögzítésből méri, így a szabadon futó DAC- és ADC-órák nem kenhetik el a kivonást.
tip.16.title = Vetíts ideális szűrőt egy mért válaszra.
tip.16.body = A Frekvenciaválasz modul Szűrők füle egy ideális aluláteresztő, felüláteresztő, sáváteresztő vagy notch szűrőt (Butterworth, Csebisev, inverz Csebisev, elliptikus, Bessel) horgonyoz a mért görbéhez, az Összehasonlítás pedig az attól való eltérést rajzolja ki - ugyanúgy, ahogy a RIAA-val szemben.
tip.17.title = Bízd a simaság megítélését az Egyenetlenség kijelzésre.
tip.17.body = Az Egyenetlenség fülön keresd meg a sávszéleket, ahol a válasz először hagyja el a csúcsától mért ±X dB-es folyosót (notch esetén a minimumától mértet), vagy olvasd le a ± eltérést egy választott tartományon - mindez közvetlenül a grafikonra jegyezve, a számokat pedig a görbére rajzolt táblázat mutatja.
tip.18.title = A teljes skálájú kalibráció a hangkártyáé.
tip.18.body = Minden kártya saját profilt őriz: egy sor attenuátoronként vagy DIP-tartományonként, külön bal / jobb értékek, eszköznév szerint párosítva minden háttérprogramon - így az eszköz- vagy háttérprogram-váltás sosem keveri össze a kalibrációkat. Az ismert kártyák előre konfigurálva kínálkoznak; a szálkeresztes kalibrációd tovább finomítja őket.
tip.19.title = Csak azt a csatornát hajtsd meg, amelyet mérsz.
tip.19.body = A generátornak, a frekvenciaválasz-pásztázásnak és a notch-hangolónak egyaránt van Kimeneti csatorna választója - Mindkettő, csak Bal vagy csak Jobb -, amely élőben kapuzza a meghajtott sávot. Praktikus áthallás-ellenőrzésekhez és egybemenetes eszközökhöz.
tip.20.title = Messzire kicsinyítve a szkóp úgy rajzol, mint egy igazi DSO.
tip.20.body = Pixelenként egynél több minta felett a nyomvonal digitálisfoszfor-képpé válik: minden oszlop tartózkodási hisztogramja, a beállított nyomvonalvastagságú tollal végigsöpörve - a keskeny impulzusok és lebegés-burkológörbék minden nagyításnál megőrzik valódi csúcstól csúcsig értéküket, a fényerő pedig megmutatja, hol időzik a jel.
tip.21.title = A hibás rögzítések sosem mérgeznek meg egy hosszú átlagot.
tip.21.body = Az FFT még az átlagba kerülés előtt eldobja azokat a blokkokat, amelyekben illesztés, kiesés vagy sávhatárt sértő tüske van, majd újraszinkronizál, és folytatja az átlagolást. Ha egy kicsi vagy nem szinuszos jel minden blokknál kioldja a kaput, vedd ki a pipát az "Időbeli diszkontinuitás észlelése" elől az FFT beállítások fülén.
tip.22.title = Az SNR és az ENOB becsületes marad széles vagy zajos hangnál.
tip.22.body = A zajmutatók nemcsak az alapharmonikust és annak felharmonikusait zárják ki, hanem a teljes szivárgási és fáziszaj-szoknyáját is - a kizárt sáv kiszélesedik, hogy a széles vagy remegő hangot egészen a zajküszöbig kövesse, így egy széles szoknya sosem duzzasztja fel az SNR-t vagy az ENOB-t.
tip.23.title = Hagyd el a mértékegységet - a puszta számok az alapmértékegységet jelentik.
tip.23.body = Írj be csak egy számot, és a mező az alapmértékegységében veszi - 1000 egy frekvenciamezőben 1000 Hz, egy amplitúdómezőben 1000 V, egy időmezőben 1000 s. A kilohertznek rövid alakjai is vannak: az 1.5k, az 1.5kh és az 1.5khz egyaránt 1.5 kHz-et jelent.
tip.24.title = Húzz egy téglalapot, hogy pontosan arra a területre nagyíts.
tip.24.body = Az oszcilloszkóp-, FFT- és frekvenciaválasz-nézetekben húzd a bal gombbal, hogy gumikerettel bekeretezd a téged érdeklő területet - elengedéskor kitölti a nézetet. A Ctrl+Z a mutató alatti nézet utolsó 32 nagyításán lép vissza.
tip.25.title = Állítsd be a dithert dBV-ben, és olvasd le közvetlenül az FFT zajküszöbéről.
tip.25.body = A generátor dither-mezője bitet vagy dBV-szintet fogad el, és a dBV már magában foglalja az FFT-ablak zajsávszélességét - így inkoherens (teljesítmény-) átlagolással az FFT zajküszöbe pontosan oda kerül, ahová beállítod: írj be −100 dBV-t, és a küszöb −100 dBV-nél áll. A koherens átlagolás kioltja a zajt, és jóval mélyebb zajküszöböt mutat.
tip.26.title = A hardvernek nem kell az asztalodon lennie.
tip.26.body = Futtasd a Phonalysert kiszolgálóként azon a gépen, amelyre az átalakítóid be vannak kötve, majd nyomd meg a Kiszolgálók... gombot a Beállítások -> Audio lapon: annak a mérőasztalnak a háttérprogramjai a helyiek mellé kerülnek a háttérprogram-listába, és onnantól az eszközök, a kártyák, a kalibráció, a generátor és a pásztázások mind úgy működnek, mintha a kártya itt lenne bedugva.
tip.27.title = Egy mérőasztali eszköz megmondja, ha valaki más mér rajta.
tip.27.body = A kiszolgáló minden eszköze egyszerre egyetlen klienshez van zárolva, és a más kezelő által fogott eszköz az eszközlistában a "használja:" szöveget és az adott kliens nevét mutatja - így még azelőtt megtudod, hogy elindítanád a felvételt, nem utána.
tip.28.title = Olvasd le a felharmonikusokat közvetlenül a tengelyről dBr-ben.
tip.28.body = Váltsd az FFT magnitúdó-mértékegységét dBr-re, és az alapharmonikus pontosan 0-n ül, így minden felharmonikus és tüske közvetlenül úgy olvasható le, hogy "ennyi és ennyi dB-lel a hang alatt". A referencia a kijelzett alapharmonikus, és minden újrarajzoláskor újraolvasásra kerül, így követi az elsodródó szintet.
tip.29.title = Írj be dBFS-ben kimeneti szintet, ha a teljes skálára gondolsz.
tip.29.body = A generátor, a frekvenciaválasz-pásztázás és a notch-hangoló varázsló egyaránt elfogad dBFS-ben megadott amplitúdót - a dbfs utótaggal vagy a rövid dbf-fel -, és továbbra is ebben az egységben jeleníti meg. A 0 dBFS teljes skálájú szinusz, így a szám nem változtat jelentést, ha hullámformát váltasz.
tip.30.title = Az amplitúdó-hisztogram egy pillantásra megkülönbözteti a vágást a zajtól.
tip.30.body = Nyisd meg az oszcilloszkóp eszköztárából: a szinusz a két fordulópontjának kádgörbéjét rajzolja ki, a szélessávú zaj Gauss-harangot, a vágott jel pedig kemény tüskét ott, ahol a korlát van. A csak az egyik oldalán vágott hullámforma a középvonal két oldalán egyenlőtlen oszlopokként jelenik meg.
tip.31.title = A QA40x "0 dBV" bemeneti tartománya nem 0 dBV RMS.
tip.31.body = A tartománytáblázat ki is mondja - 0 "dBV" real 0 dBFS or -9 dBV -, mert a QA bemeneti tartománya csúcstól csúcsig mért dBFS-referencia a differenciális páron, amelynek valódi RMS teljes skálája mintegy 9 dB-lel lejjebb van. A kimeneti tartományok viszont valódi dBV-értékek.
tip.32.title = A kalibrációd elkísérhet a mérőasztalhoz.
tip.32.body = Válassz egy kalibráció nélküli kiszolgálóeszközt, miközben ezen a gépen van hozzá illő kalibrált kártya, és a Phonalyser felajánlja az értékek átmásolását - munkamenetenként egyszer, és sosem némán. Mondj nemet, és semmi sem íródik ki.
tip.33.title = A QA403 384 kHz-en fut; a QA402 nem.
tip.33.body = A frekvencialista a ténylegesen csatlakoztatott analizátort követi - a mintavételi frekvencia regiszterének van egy negyedik kódja, amely csak a QA403-ban létezik. A rögzítés és a generátor is azon a frekvencián fut, amelyet kiválasztasz, mert a két irány egyetlen hardveres órajelen osztozik.
tip.34.title = A QA40x közvetlenül az előlapi I2S portjáról is meghajthat egy átalakítót.
tip.34.body = Kapcsold be a portot a QA40x beállításai alatt, és a kimeneti bitmélység-lista az analizátor 24 bitje helyett a port 16 és 32 bitjét kínálja, miközben a bemenet végig 24 marad. Kísérleti: a QuantAsylum dokumentálja a csatlakozót, de az azt engedélyező regisztereket nem.
tip.35.title = Egy hosszú pásztázást már nem kell végigvárni.
tip.35.body = A frekvenciaválasz folyamatjelző ablakán van egy Mégse gomb. Együttműködő - a pásztázás a szokásos leállítási úton ér véget, így az ablak bezárul és a panel feloldódik pontosan úgy, mint egy befejezett futás után, a rögzítés és a generátor visszaadásával.
tip.36.title = Egy simának látszó frekvenciaválasz is lehet vágott.
tip.36.body = Ha a rögzítés elérte a teljes kitérést, figyelmeztetést kapsz, amint a nyomvonal megjelenik. A dekonvolúció a korlátnak ütközött felvételt finom, szabályos hullámzássá alakítja, amely inkább zajnak, mint sérülésnek látszik, ezért csökkentsd a meghajtási szintet, ahelyett hogy megbíznál a görbében.
tip.37.title = A képernyőn látható bármelyik frekvenciaválasz menthető.
tip.37.body = A Mentés... lap mindenféle minőségi feltétel nélkül fájlba írja a megjelenített görbét - az imént lefuttatott pásztázást, a nagyon halkan meghajtottat és a lemezről visszatöltöttet egyaránt. Egyedül azt kéri, hogy legyen egyáltalán mérés.
tip.38.title = Dugj be egy kártyát az alkalmazás újraindítása nélkül.
tip.38.body = Az Eszközök keresése a Beállítások -> Audio lapon újraolvassa a kiválasztott háttérprogram eszközlistáját, és az az eszköz, amely az illesztőprogram "invalid device" hibájával elszáll, magától kivált egy automatikus újrakeresést és újrapróbálkozást.
tip.39.title = A Beállítások megmondja, mikor tippen alapulnak a voltjaid.
tip.39.body = Az Audio lap bezárása háttérprogram- vagy eszközváltás után ellenőrzi, hogy a véglegesített választás valóban mért teljes skálára oldódik-e fel, és megnevezi a bemenetet, a kimenetet vagy mindkettőt, ha nem. Az eszközhöz kötött, de csupa nullát tartalmazó kártya kalibrálatlannak számít - az üres sor nem mérés.
tip.40.title = A halott bemenet szól, ahelyett hogy egyenes vonalat rajzolna.
tip.40.body = Húzd ki a kártyát, vagy engedd, hogy egy másik alkalmazás kizárólagosan elvegye, és az oszcilloszkóp és az FFT egyetlen párbeszédablakkal áll le, amely megnevezi a háttérprogramot, és megmondja, hogy az eszköz elveszett-e, vagy csak abbahagyta a minták szállítását. A lejátszási oldalt ugyanígy figyeli.
tip.41.title = Az értelmezhetetlen beállításfájlt sosem írja felül.
tip.41.body = Az összeomlás által megrongált preferences.yaml vagy devices.yaml fájl .corrupt kiterjesztéssel maga mellé kerül átnevezve, a hiba pedig naplóba, így a benne lévő minden kalibráció még kézzel visszanyerhető, ahelyett hogy a következő mentés betonozná be.

