capture.error.noInputDevice = Nincs kiválasztva bemeneti eszköz. Nyissa meg a Beállításokat és válasszon rögzítőeszközt.
capture.error.inputDeviceGone = Az elmentett bemeneti eszköz "{0}" már nem érhető el. Csatlakoztassa újra az eszközt, vagy válasszon másikat a Beállításokban.
