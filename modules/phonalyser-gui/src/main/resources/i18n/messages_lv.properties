# ===== DAC PREDISTORTION WIZARD =====

predistortion.button.wizard.tooltip = Izmērīt un lietot DAC priekškropļojumu.\nTas piesaista toni FFT joslai, pēc tam katrā kārtā vidējo iestatīto FFT kadru skaitu, nolasa sinusa harmonikas (vai divtoņu intermodulācijas produktus) un padod vienādu un pretēju korekciju atpakaļ ģeneratoram - atkārtojot, līdz kropļojumi sasniedz jūsu mērķi vai pārstāj uzlaboties.\nMērķis: nodzīt kropļojumus līdz trokšņu līmenim; saglabājiet .dpd un lietojiet to, lai saglabātu kompensēto toni.
predistortion.wizard.title = DAC priekškropļojums
predistortion.averages = Vidējošanas, n
predistortion.averages.tooltip = FFT vidējošanas vienā kārtā (minimums 10).  Katra kārta vidējo šo kadru skaitu, kas pieaug proporcionāli kropļojumu kritumam, konverģējot.  Cilpa darbojas, līdz nospiežat Apturēt.
predistortion.targetThd = Mērķa THD, %
predistortion.targetThd.tooltip = Apturēt, tiklīdz THD sasniedz šo vērtību (0 = darboties, līdz progress apstājas)
predistortion.intro = OBLIGĀTI: starp testējamo ierīci un ADC ievietojiet pasīvu divkāršā T iegriezuma filtru, noskaņotu uz pamatfrekvenci.  Bez tā ADC paša harmonikas nosaka līmeni un cilpa beigās kompensē ADC, nevis DAC.\nTas nodzen DAC atlikušos kropļojumus, priekškropļojot ģeneratoru ar to, kas pretējs izmērītajam.\nKā tas darbojas - 1) tas piesaista toni FFT joslai un gaida izlīdzināšanu;  2) katrā kārtā tas vidējo zemāk iestatīto FFT kadru skaitu, nolasa sinusa harmonikas (vai divtoņu intermodulācijas produktus) un padod vienādu un pretēju korekciju atpakaļ ģeneratoram;  3) tas atkārtojas - vidējojot vairāk kadru, kropļojumiem krītot - diagrammai slīdot pretī trokšņu līmenim, līdz tiek sasniegti mērķa kropļojumi vai progress apstājas.\nVednis darbina FFT bezgalīgā koherentā vidējošanā ar pamatfrekvenci, kas ņemta no ģeneratora, un ieslēgtu FLL; dziļākajam līmenim izmantojiet HFT248D logu un atstājiet tīkla slāpēšanu izslēgtu.  Izmantojiet tīru signālu dažus dB zem pilnas skalas un pamatfrekvenci, kas piesaistīta joslai - pēc tam saglabājiet .dpd un lietojiet to.
