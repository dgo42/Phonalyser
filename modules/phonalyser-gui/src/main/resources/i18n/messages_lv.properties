# ===== TIP OF THE DAY =====

tip.dialog.heading = Dienas padoms
tip.dialog.dontShowAgain = Vairs nerādīt
tip.dialog.next = Nākamais padoms
tip.dialog.close = Aizvērt
tip.dialog.closeCountdown = Aizvērt ({0} s)
tip.count = 41
tip.1.title = Koherentā vidējošana sniedzas dziļi zem trokšņu līmeņa.
tip.1.body = Atstājiet koherento (kompleksu) vidējošanu ieslēgtu un ļaujiet FFT darboties - tonis summējas, kamēr troksnis daļēji izdziest, tāpēc līmenis turpina krist, jo ilgāk gaidāt.
tip.2.title = Piesaistiet ģeneratoru FFT joslai, lai iegūtu tīru spektru.
tip.2.body = Ja ieslēgts "Piesaistīt frekvenci tuvākajai", tonis precīzi nokļūst joslā, tāpēc noplūde neizsmērē pamatfrekvenci un harmoniku novērtējumi paliek godīgi.
tip.3.title = Fiksējiet pamatfrekvenci ar roku uz divkāršā T iegriezuma filtra.
tip.3.body = Pasīvs divkāršā T nulles punkts ir tik stāvs, ka dažu hercu desmitdaļu termiskā nobīde izmaina deembedēto pamatfrekvenci. Ievadiet līmeni, ko patiešām zināt, ar "Manuāla pamatfrekvence"; harmonikas uz maigā slīpuma deembedējas labi.
tip.4.title = WASAPI ekskluzīvais režīms saglabā mērījumu bitu precīzu.
tip.4.body = Ekskluzīvais režīms nodod ierīci tieši Phonalyser, apejot Windows mikseri un tā nolases biežuma pārveidotāju - nav slēptas pārdiskretizācijas, kas iekrāsotu rezultātu.
tip.5.title = WDM-KS oscilogrāfam dod visvairāk kadru sekundē.
tip.5.body = Ātrākajai dzīvajai oscilogrāfa atsvaidzināšanai izvēlieties WDM-KS aizmugursistēmu iestatījumos - tā atrodas zemāk par WASAPI un nodod vairāk uztveršanas bloku sekundē.
tip.6.title = Peles ritenītis tuvina ap kursoru.
tip.6.body = Jebkurā līknes skatā: ritenītis pārvieto vertikāli, Shift+ritenītis horizontāli, Ctrl+ritenītis tuvina vertikālo asi un Ctrl+Shift+ritenītis horizontālo - abas tuvināšanas saglabā vērtību zem rādītāja nemainīgu.
tip.7.title = Katrs skaitliskais lauks pieņem mērvienības, ritenīti un tastatūru.
tip.7.body = Ierakstiet vērtību ar tās mērvienību (µV, 1.5 V, -3 dBV, 2 kHz), griežiet ritenīti, klikšķiniet augšup/lejup bultiņas vai spiediet tastatūras augšup/lejup taustiņus, lai mainītu soli.
tip.8.title = Sinc interpolācijai ir nozīme tikai tad, kad esat tuvinājis.
tip.8.body = Sin/Lin slēdzis maina līkni tikai tad, kad nolases punkti uz ekrāna atrodas pāris pikseļu attālumā; pretējā gadījumā taisnas līnijas izskatās identiskas un maksā mazāk CPU. Ieslēdziet to, tiklīdz ir redzami atsevišķi nolases punkti.
tip.9.title = Histerēze stabilizē trigeru uz vāja, trokšņaina signāla.
tip.9.body = Bez tās troksnis ap trigera līmeni izsauc kļūdainu trigeru gūzmu un līkne raustās. Iespējojiet trigera histerēzi, un līkne nofiksējas.
tip.10.title = Saglabāts ģeneratora signāls ir ideāla atsauce.
tip.10.body = "Saglabāt kā..." ieraksta ideālu, matemātiski precīzu viļņa formu - bez DAC, pastiprinātāja vai vadu kropļojumiem. Padodiet to citam instrumentam, un jebkura jūsu izmērītā nepilnība pieder tai ierīcei, nevis avotam.
tip.11.title = Deembedējiet ierīci ar kalibrācijas failu.
tip.11.body = Vienreiz izmēriet iegriezuma, slāpētāja vai skaņas kartes raksturlīkni frekvenču raksturlīknes modulī, pēc tam ielādējiet to .frc FFT analizatorā: tā raksturlīkne tiek izdalīta attēlošanas laikā, tāpēc tabula rāda testējamo ierīci.
tip.12.title = Rekonstruētā sitiena pārklājums savalda tuvu divtoņu pāri.
tip.12.body = Divtoņu režīmā oscilogrāfa "Rekonstruētais sitiens" pārklājums zīmē lēno |f1 - f2| apvalku, tāpēc varat trigerēt pēc sitiena, nevis dzīties pakaļ ātrajiem nesēja šķērsojumiem.
tip.13.title = Frekvenču raksturlīknes svīpings ir pats sava atsauce.
tip.13.body = Svīpinga mērījums tiek dekonvolūts pret precīzu nospēlēto svīpingu - nevis pārmērītu kopiju - tāpēc atgūtais magnitūdas un fāzes raksturojums ir ierīces patiesā pārejas funkcija.
tip.14.title = Ctrl+F1 nogādā tieši pie pareizās palīdzības.
tip.14.body = Jebkur nospiediet F1, lai atvērtu rokasgrāmatu, vai Ctrl+F1, lai atvērtu palīdzību tieši tajā sadaļā par vadīklu, kurai pašlaik ir fokuss.
tip.15.title = Atlikuma skats parāda, kas slēpjas zem pamatfrekvences.
tip.15.body = Pārslēdziet kanālu uz "Atlikums", un oscilogrāfs zīmē uztverto signālu mīnus tam vislabāk pieguļošo toni - zem pamatfrekvences apraktie kropļojumi, troksnis un traucējumi kļūst redzami. Darbojas arī ar diviem toņiem: abas frekvences tiek mērītas no paša uztvertā signāla, tāpēc brīvi ejošie DAC un ADC takts ģeneratori nevar izsmērēt atņemšanu.
tip.16.title = Uzklājiet ideālu filtru izmērītajai raksturlīknei.
tip.16.body = Frekvenču raksturlīknes moduļa cilnē Filtri ideāls zemfrekvences, augstfrekvences, joslas caurlaides vai iegriezuma filtrs (Butervorta, Čebiševa, apgrieztais Čebiševa, eliptiskais, Besela) tiek piesaistīts izmērītajai līknei, un Salīdzināt zīmē novirzi no tā - tāpat kā salīdzinot ar RIAA.
tip.17.title = Ļaujiet Nevienmērīguma nolasījumam novērtēt līdzenumu jūsu vietā.
tip.17.body = Cilnē Nevienmērīgums atrodiet joslas malas, kur raksturlīkne pirmo reizi pamet ±X dB koridoru attiecībā pret savu maksimumu (vai pret minimumu iegriezuma filtram), vai nolasiet ± novirzi izvēlētā diapazonā - viss tiek anotēts tieši uz grafika, un skaitļi tiek zīmēti kā pārklājuma tabula uz līknes.
tip.18.title = Pilnas skalas kalibrācija pieder skaņas kartei.
tip.18.body = Katra karte glabā savu profilu: pa rindai katram slāpētāja vai DIP diapazonam, atsevišķas kreisās / labās vērtības, kas tiek saskaņotas pēc ierīces nosaukuma katrā aizmugursistēmā - tāpēc ierīču vai aizmugursistēmu maiņa nekad nesajauc kalibrācijas. Zināmās kartes tiek piedāvātas jau nokonfigurētas; jūsu kalibrācija ar krustiņu tās vēl precizē.
tip.19.title = Vadiet tikai to kanālu, kuru mērāt.
tip.19.body = Ģeneratoram, frekvenču raksturlīknes svīpingam un iegriezuma filtra skaņotājam katram ir Izejas kanāla izvēle - Abi, tikai Kreisais vai tikai Labais - kas darbības laikā ieslēdz un izslēdz vadīto ceļu. Noderīgi šķērsrunas pārbaudēm un ierīcēm ar vienu ieeju.
tip.20.title = Tālu attālinot, oscilogrāfs zīmē kā īsts DSO.
tip.20.body = Virs viena nolases punkta uz pikseli līkne kļūst par digitālā fosfora attēlu: katras kolonnas uzturēšanās histogramma, pārvilkta ar konfigurētā līknes platuma spalvu - šauri impulsi un sitienu apvalki saglabā savu patieso amplitūdu no virsotnes līdz virsotnei jebkurā tuvinājumā, un spilgtums rāda, kur signāls uzkavējas.
tip.21.title = Ieraksti ar traucējumiem nekad nesaindē garu vidējošanu.
tip.21.body = FFT atmet blokus, kas satur salaidumus, izkritumus vai joslas ierobežojumu pārkāpjošus traucējumus, pirms tie nonāk vidējošanā, pēc tam atkal sinhronizējas un turpina vidējot. Ja mazs vai nesinusoidāls signāls nostrādina šo aizsargu katrā blokā, noņemiet atzīmi "Noteikt laika pārtraukumu" FFT iestatījumu cilnē.
tip.22.title = SNR un ENOB paliek godīgi zem plata vai trokšņaina toņa.
tip.22.body = Trokšņa rādītāji izslēdz ne tikai pamatfrekvenci un tās harmonikas, bet arī visu tās noplūdes un fāzes trokšņa apmali - izslēgtā josla paplašinās, lai sekotu platam vai nestabilam tonim līdz pat trokšņu līmenim, tāpēc plata apmale nekad neuzpūš SNR vai ENOB.
tip.23.title = Izlaidiet mērvienību - tikai cipari nozīmē pamatmērvienību.
tip.23.body = Ierakstiet tikai skaitli, un lauks to pieņem pamatmērvienībā - 1000 frekvences laukā ir 1000 Hz, amplitūdas laukā 1000 V, laika laukā 1000 s. Arī kilohercam ir īsās formas: 1.5k, 1.5kh un 1.5khz - visi nozīmē 1.5 kHz.
tip.24.title = Velciet taisnstūri, lai tuvinātu tieši to apgabalu.
tip.24.body = Oscilogrāfa, FFT un frekvenču raksturlīknes skatos velciet ar kreiso peles pogu, lai ar gumijas rāmi iezīmētu jums interesējošo apgabalu - atlaižot tas aizpilda skatu. Ctrl+Z soļo atpakaļ pa pēdējiem 32 tuvinājumiem tajā skatā, kas atrodas zem rādītāja.
tip.25.title = Iestatiet dither dBV vienībās un nolasiet to tieši no FFT trokšņu līmeņa.
tip.25.body = Ģeneratora dither lauks pieņem bitu skaitu vai dBV līmeni, un dBV jau ietver FFT loga trokšņu joslas platumu - tāpēc ar nekoherento (jaudas) vidējošanu FFT trokšņu līmenis nostājas tieši tur, kur to iestatāt: ievadiet −100 dBV, un trokšņu līmenis ir −100 dBV. Koherentā vidējošana izdzēš troksni un rāda daudz zemāku līmeni.
tip.26.title = Aparatūrai nav jāatrodas uz jūsu galda.
tip.26.body = Palaidiet Phonalyser kā serveri tajā datorā, kuram pievienoti jūsu pārveidotāji, un pēc tam Iestatījumi -> Audio nospiediet "Serveri...": tā stenda aizmugursistēmas pievienojas aizmugursistēmu sarakstam blakus vietējām, un no turienes ierīces, kartes, kalibrācija, ģenerators un svīpingi darbojas tā, it kā karte būtu iesprausta šeit.
tip.27.title = Stenda ierīce, uz kuras mēra kāds cits, to arī pasaka.
tip.27.body = Katra servera ierīce vienlaikus ir bloķēta vienam klientam, un ierīce, ko tur cits operators, ierīču sarakstā rāda "izmanto" kopā ar tā klienta vārdu - tā jūs to uzzināt pirms uztveršanas sākšanas, nevis pēc tās.
tip.28.title = Ar dBr harmonikas nolasāmas tieši no ass.
tip.28.body = Pārslēdziet FFT magnitūdas vienību uz dBr, un pamatfrekvence nostājas tieši uz 0, tāpēc katra harmonika un blakusfrekvence nolasās tieši kā "tik un tik dB zem toņa". Atsauce ir attēlotā pamatfrekvence, un tā tiek pārlasīta ikreiz, kad grafiks tiek pārzīmēts, tāpēc tā seko dreifējošam līmenim.
tip.29.title = Rakstiet izejas līmeni dBFS, ja domājat pilnu skalu.
tip.29.body = Ģenerators, frekvenču raksturlīknes svīpings un iegriezuma filtra skaņošanas vednis pieņem amplitūdu dBFS - piedēklis dbfs vai īsais dbf - un turpina to rādīt tajā pašā mērvienībā. 0 dBFS ir pilnas skalas sinusoīda, tāpēc, mainot viļņa formu, skaitļa nozīme nemainās.
tip.30.title = Amplitūdas histogramma uzreiz atšķir apgriešanu no trokšņa.
tip.30.body = Atveriet to no oscilogrāfa rīkjoslas: sinusoīda zīmē vannu ar diviem pagrieziena punktiem, platjoslas troksnis - Gausa zvanu, bet apgriezts signāls - asu smaili tur, kur ir barošanas robeža. Viļņa forma, kas apgriezta tikai vienā pusē, parādās kā nevienādi stabiņi abpus centra līnijai.
tip.31.title = QA40x "0 dBV" ieejas diapazons nav 0 dBV RMS.
tip.31.body = Diapazonu tabulā tas ir pateikts skaidri - 0 "dBV" real 0 dBFS or -9 dBV - jo QA ieejas diapazons ir dBFS atsauce no virsotnes līdz virsotnei pāri diferenciālajam pārim, kura patiesā RMS pilnā skala atrodas apmēram 9 dB zemāk. Izejas diapazoni ir īsti dBV.
tip.32.title = Jūsu kalibrācija var sekot jums līdzi uz stendu.
tip.32.body = Izvēlieties servera ierīci bez kalibrācijas, kamēr šajā datorā ir tai atbilstoša kalibrēta karte, un Phonalyser piedāvās vērtības pārkopēt - vienreiz sesijā un nekad klusējot. Atsakiet, un nekas netiks ierakstīts.
tip.33.title = QA403 darbojas ar 384 kHz; QA402 - nē.
tip.33.body = Frekvenču saraksts seko patiešām pievienotajam analizatoram - diskretizācijas frekvences reģistram ir ceturtais kods, kas ir tikai QA403. Gan uztveršana, gan ģenerators darbojas ar to frekvenci, kuru izvēlaties, jo abi virzieni izmanto vienu aparatūras taktsģeneratoru.
tip.34.title = QA40x var vadīt pārveidotāju tieši no sava priekšējā paneļa I2S porta.
tip.34.body = Ieslēdziet portu logā "QA40x iestatījumi", un izejas bitu dziļuma sarakstā analizatora 24 bitu vietā parādīsies porta 16 un 32 biti, kamēr ieeja visu laiku paliek uz 24. Tas ir eksperimentāli: QuantAsylum dokumentē savienotāju, bet ne reģistrus, kas to ieslēdz.
tip.35.title = Garš svīpings vairs nav jāgaida līdz galam.
tip.35.body = Frekvenču raksturlīknes progresa logam ir poga "Atcelt". Pārtraukšana ir sadarbīga - svīpings beidzas pa parasto apturēšanas ceļu, tāpēc logs aizveras un panelis atbloķējas tieši tāpat kā pēc pabeigta mērījuma, atdodot atpakaļ uztveršanu un ģeneratoru.
tip.36.title = Gluda izskata frekvenču raksturlīkne joprojām var būt apgriezta.
tip.36.body = Ja uztveršana sasniedza pilnu skalu, jūs tiekat brīdināts, tiklīdz parādās līkne. Dekonvolūcija pārvērš pieskrūvētu ierakstu smalkā regulārā viļņojumā, kas izskatās drīzāk pēc trokšņa nekā pēc bojājuma, tāpēc labāk samaziniet vadības līmeni, nevis paļaujieties uz līkni.
tip.37.title = Jebkuru ekrānā redzamu frekvenču raksturlīkni var saglabāt.
tip.37.body = Cilne "Saglabāt kā..." ieraksta attēloto līkni failā bez jebkādas kvalitātes pārbaudes - gan tikko nosvīpotu, gan maigi vadītu, gan no diska atpakaļ ielādētu. Vienīgais nosacījums ir tas, ka mērījums vispār pastāv.
tip.38.title = Karti var iespraust, nerestartējot lietotni.
tip.38.body = "Meklēt ierīces" sadaļā Iestatījumi -> Audio no jauna nolasa izvēlētās aizmugursistēmas ierīču sarakstu, un ierīce, kas neizdodas ar draivera "invalid device", pati automātiski vienreiz pārmeklē un mēģina vēlreiz.
tip.39.title = Iestatījumi pasaka, kad jūsu volti ir tikai minējumi.
tip.39.body = Aizverot cilni Audio pēc aizmugursistēmas vai ierīces maiņas, tiek pārbaudīts, vai apstiprinātā izvēle tiešām noved pie izmērītas pilnas skalas, un tiek nosaukta ieeja, izeja vai abas, ja tā nav. Karte, kas piesaistīta ierīcei, bet glabā nulles, skaitās nekalibrēta - tukša rinda nav mērījums.
tip.40.title = Mirusi ieeja to pasaka, nevis zīmē līdzenu līniju.
tip.40.body = Izraujiet karti vai ļaujiet citai lietotnei to paņemt ekskluzīvi, un oscilogrāfs un FFT apstājas ar vienu dialogu, kas nosauc aizmugursistēmu un pasaka, vai ierīce tika pazaudēta, vai tikai pārstāja piegādāt nolases. Atskaņošanas puse tiek uzraudzīta tieši tāpat.
tip.41.title = Iestatījumu fails, ko neizdodas nolasīt, nekad netiek pārrakstīts.
tip.41.body = Avārijā bojāts preferences.yaml vai devices.yaml tiek pārsaukts par .corrupt turpat blakus un kļūme tiek ierakstīta žurnālā, tāpēc katru tajā esošo kalibrāciju vēl var atgūt ar roku, nevis aizbetonēt ar nākamo saglabāšanu.

