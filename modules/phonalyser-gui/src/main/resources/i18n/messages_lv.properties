# ---- Frequency response
preferences.freqResp.lineWidth = Līknes līnijas platums, px:
preferences.freqResp.lineWidth.tooltip = Frekvenču raksturlīknes līnijas biezums pikseļos (magnitūda, fāze, RIAA atsauce un salīdzināšanas līknes)
preferences.freqResp.maxFreqPctNyquist = Maksimālā analizētā frekvence, % no Naikvista
preferences.freqResp.maxFreqPctNyquist.tooltip = Ierobežo frekvenču raksturlīknes skata augšējo robežu līdz šai Naikvista daļai (sampleRate / 2).  96-100 %.  100 % = stingrs Naikvists; zemākas vērtības apgriež joslu, kur dekonvolūcijas kodola enerģija norimst.
preferences.freqResp.compareSmoothWindow = Salīdzināšanas izlīdzināšanas logs, 1/N oktāvas
preferences.freqResp.compareSmoothWindow.tooltip = Mainīgā vidējā filtra platums, ko pielieto salīdzināšanas režīma (izmērīts − atsauce) līknei, izteikts 1/N oktāvas vienībās.  N = 0 atspējo izlīdzināšanu.  Mazāks N = platāks logs = vairāk izlīdzināšanas (N=3 ≈ 1/3 oktāvas, plašs), lielāks N = šaurāks = vieglāks (N=24 ≈ 1/24 oktāvas, standarta audio).
preferences.freqResp.notch.enable = Atļaut iegriezuma filtru industriālajam troksnim
preferences.freqResp.notch.enable.tooltip = Ja iespējots, frekvenču raksturlīknes skats interpolē pāri katrai izvēlētās tīkla frekvences (50/60 Hz) harmonikai - noņem tīkla dūkoņas smailes no attēlotās raksturlīknes bez atkārtotas mērīšanas.
preferences.freqResp.notch.baseHz = Industriālā frekvence
preferences.freqResp.notch.baseHz.tooltip = Bāzes frekvence, kuras harmonikas (50, 100, 150, ... Hz vai 60, 120, 180, ...) tiek izgrieztas, kad augšējā izvēles rūtiņa ir ieslēgta.
