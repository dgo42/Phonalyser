# Test-only i18n bundle for phonalyser-core.
#
# The shipped bundles live in phonalyser-gui, two modules UP, so they are not on
# this module's classpath.  UnitFamily and its Unit record moved down here with
# I18n, and Unit#suffix() resolves through I18n - so without a bundle the first
# suffix lookup in a test would fail this module's I18n static initialiser.
#
# It carries only the unit.* keys the core tests can reach.  Values mirror the
# shipped English ones, so a test that asserts on a suffix asserts on what the
# user really sees.
unit.nv = nV
unit.uv = uV
unit.mv = mV
unit.v = V
unit.dbv = dBV
unit.dbfs = dBFS
unit.bits = bits
