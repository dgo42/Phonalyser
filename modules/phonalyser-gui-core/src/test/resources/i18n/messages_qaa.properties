# Test-only second language for phonalyser-gui-core.
#
# "qaa" is a BCP 47 private-use language code: no host runs with it as its
# default locale, so the root fixture (messages.properties) stays the bundle
# every other test resolves against, on every machine.
#
# It carries one key of the root fixture with a different value, so a test can
# tell which language I18n.t resolved after a language switch; every other key
# falls back to the root fixture.
test.existing.key = resolved-qaa
