# Test-only i18n bundle for phonalyser-gui-core.
#
# The shipped bundles live in phonalyser-gui, one module UP, so they are not on
# this module's classpath - and they should not be: a test that reads the real
# translations changes its result whenever someone edits a translation.  This
# fixture is small, fixed, and owned by the tests, so unit formatting is asserted
# against values that only change when a test intends them to.
#
# It carries exactly two things:
#   * every unit.* key, because UnitFamily.Unit#suffix() resolves through I18n and
#     NumericStepModel formats with it - without these, I18n's static initialiser
#     fails and every test in the module dies with NoClassDefFoundError;
#   * one key for I18nTest to prove a hit resolves, next to the misses it asserts.
#
# Values are deliberately identical to the shipped English ones, so a test that
# asserts on a suffix is asserting on what the user really sees.

# --- fixture-only -----------------------------------------------------------
test.existing.key = resolved

# --- units (mirrors of the shipped English values) --------------------------
unit.hz = Hz
unit.khz = kHz
unit.nv = nV
unit.uv = µV
unit.mv = mV
unit.v = V
unit.dbv = dBV
unit.dbfs = dBFS
unit.bits = bits
unit.ms = ms
unit.s = s
unit.nvdiv = nV/div
unit.uvdiv = µV/div
unit.mvdiv = mV/div
unit.vdiv = V/div
unit.usdiv = µs/div
unit.msdiv = ms/div
unit.sdiv = s/div
unit.percent = %
unit.px = px
unit.db = dB
unit.div = div
unit.mag.V = V
unit.mag.V_SQRT_HZ = V/√Hz
unit.mag.DBV = dBV
unit.mag.DBFS = dBFS
unit.mag.DBR = dBr
