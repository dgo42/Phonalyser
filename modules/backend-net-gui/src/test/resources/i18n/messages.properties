# TEST STUB - not a translation source.
#
# The application's real bundle lives in phonalyser-gui, which this module must
# not depend on (that would be a cycle).  I18n resolves its bundle in a static
# initialiser and throws MissingResourceException when there is none at all, so
# any test that reaches a user-visible string here would die on the class load
# rather than on what it is testing.
#
# Only the keys this module's own code formats are listed, with the same
# patterns the real bundle carries; a key that is missing from a bundle that
# EXISTS falls back to the key itself, so nothing else has to be kept in sync.
net.servers.backendLabel = {0} → {1}
net.error.connectionLost = The connection to the Phonalyser server ended: {0}
net.error.connect = No Phonalyser server answered at {0}: {1}
net.close.bye = the session was closed from here.
net.close.keepaliveTimeout = the server stopped answering (keepalive timeout).
net.close.transportClosed = the connection was closed.
net.close.transportError = the connection failed.
net.close.handshakeRefused = the server refused the session.
net.close.protocolError = the server sent audio data this client cannot read.
