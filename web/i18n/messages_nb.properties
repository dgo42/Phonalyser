# ===== TIP OF THE DAY =====

tip.dialog.heading = Dagens tips
tip.dialog.dontShowAgain = Ikke vis igjen
tip.dialog.next = Neste tips
tip.dialog.close = Lukk
tip.dialog.closeCountdown = Lukk ({0} s)
tip.count = 40
tip.1.title = Koherent midling graver langt under støygulvet.
tip.1.body = La koherent (kompleks) midling stå på og la FFT-en kjøre - tonen summeres opp mens støyen delvis utlignes, så gulvet fortsetter å synke jo lenger du venter.
tip.2.title = Lås generatoren til en FFT-bin for et rent spektrum.
tip.2.body = Med «Lås frekvens til nærmeste» på lander tonen nøyaktig på en bin, så lekkasje ikke smører ut grunntonen og harmoniske-estimatene holder seg ærlige.
tip.3.title = Lås grunntonen for hånd på et tvilling-T-notch.
tip.3.body = En passiv tvilling-T-null er så bratt at noen få tideler av en hertz med termisk drift svinger den de-embeddede grunntonen. Skriv inn nivået du faktisk kjenner med «Manuell grunntone»; de harmoniske, på den slake flanken, de-embedder fint.
tip.4.title = Bare QA40x-en er bit-eksakt i en nettleser.
tip.4.body = En nettside har ingen eksklusiv modus: Web Audio-opptaket når den som float32 etter den delte Windows-mikseren, så alt den mikseren gjorde ligger allerede i samplene. QA40x-en er unntaket - den går utenom mikseren ved slett ikke å være et lydkort, og leses direkte over WebUSB.
tip.5.title = Musehjulet zoomer rundt markøren.
tip.5.body = I enhver kurvevisning: hjulet flytter vertikalt, Shift+hjul horisontalt, Ctrl+hjul zoomer den vertikale aksen og Ctrl+Shift+hjul den horisontale - begge zoomer holder verdien under pekeren fast.
tip.6.title = Hvert numeriske felt tar enheter, hjulet og tastaturet.
tip.6.body = Skriv inn en verdi med enheten (µV, 1,5 V, -3 dBV, 2 kHz), rull hjulet, klikk opp/ned-pilene, eller trykk opp/ned-tastene på tastaturet for å steppe.
tip.7.title = Sinc-interpolasjon betyr bare noe når du har zoomet inn.
tip.7.body = Sin/Lin-bryteren endrer kurven bare når samplingspunktene er noen få piksler fra hverandre på skjermen; ellers ser rette linjer identiske ut og koster mindre CPU. Slå den på når enkeltsampler blir synlige.
tip.8.title = Hysterese stabiliserer triggeren på et svakt, støyete signal.
tip.8.body = Uten den utløser støy rundt triggernivået et kobbel av falske triggere og kurven dirrer. Aktiver trigger-hysterese og kurven låser seg.
tip.9.title = Et lagret generatorsignal er en perfekt referanse.
tip.9.body = «Lagre til ...» skriver den ideelle, matematisk eksakte bølgeformen - ingen DAC-, forsterker- eller kablingsforvrengning. Mat den til et annet instrument, og enhver ufullkommenhet du måler tilhører den enheten, ikke kilden.
tip.10.title = De-embed en fikstur med en kalibreringsfil.
tip.10.body = Mål et notch, en attenuator eller et lydkorts respons én gang i Frekvensrespons-modulen, og last så den .frc-filen inn i FFT-analysatoren: responsen deles ut ved visning, så tabellen viser enheten under test.
tip.11.title = Det rekonstruerte beat-overlegget temmer et tett totone-par.
tip.11.body = I totonemodus tegner skopets «Rekonstruert beat»-overlegg den langsomme |f1 − f2|-konvolutten, så du kan trigge på beatet i stedet for å jage de raske bærebølgekryssingene.
tip.12.title = Frekvensrespons-sveipet er sin egen referanse.
tip.12.body = Den sveipte målingen dekonvolveres mot det nøyaktige sveipet som ble spilt - ikke en gjenmålt kopi - så den gjenvunne amplituden og fasen er enhetens sanne overføringsfunksjon.
tip.13.title = Ctrl+F1 hopper rett til riktig hjelp.
tip.13.body = Trykk F1 hvor som helst for manualen, eller Ctrl+F1 for å åpne hjelpen på akkurat den seksjonen for kontrollen som har fokus akkurat nå.
tip.14.title = Residualvisningen viser hva som gjemmer seg under grunntonen.
tip.14.body = Sett en kanal til «Residual», så tegner skopet det innfangede signalet minus den best tilpassede tonen - forvrengning, støy og glitcher begravd under grunntonen blir synlige. Totone fungerer også: begge frekvensene måles fra selve opptaket, så frittløpende DAC- og ADC-klokker kan ikke smøre ut subtraksjonen.
tip.15.title = Legg et ideelt filter over en målt respons.
tip.15.body = Filtre-fanen i Frekvensrespons-modulen forankrer et ideelt lavpass-, høypass-, båndpass- eller notch-filter (Butterworth, Chebyshev, invers Chebyshev, elliptisk, Bessel) til den målte kurven, og Sammenlign plotter avviket fra det - på samme måte som mot RIAA.
tip.16.title = La Ujevnhet-avlesningen bedømme flatheten for deg.
tip.16.body = På Ujevnhet-fanen finner du båndkantene der responsen først forlater en korridor på ±X dB fra toppen sin (eller fra minimum for et notch), eller leser av ±-avviket over et valgt område - annotert rett på plottet, med tallene tegnet som en overleggstabell på kurven.
tip.17.title = Fullskala-kalibrering hører til lydkortet.
tip.17.body = Hvert kort har sin egen profil: én rad per attenuator- eller DIP-område, separate venstre/høyre-verdier, matchet på enhetsnavn på hver backend - så bytte av enhet eller backend blander aldri kalibreringene. Kjente kort tilbys ferdig oppsatt; din trådkors-kalibrering finsliper dem.
tip.18.title = Driv bare den kanalen du måler.
tip.18.body = Generatoren, frekvensrespons-sveipet og notch-tuneren har hver sin Utgangskanal-velger - Begge, bare Venstre eller bare Høyre - som slår den drevne banen av og på i sanntid. Praktisk for krysstalesjekker og enheter med én inngang.
tip.19.title = Langt utzoomet tegner skopet som en ekte DSO.
tip.19.body = Over én sample per piksel blir kurven et digitalfosfor-bilde: hver kolonnes oppholdshistogram, sveipet med en penn med den konfigurerte kurvebredden - smale pulser og beat-konvolutter beholder sitt sanne topp-til-topp ved enhver zoom, og lysstyrken viser hvor signalet oppholder seg.
tip.20.title = Opptak med glitcher forgifter aldri en lang midling.
tip.20.body = FFT-en avviser blokker med skjøter, dropouts eller glitcher som bryter båndgrensen, før de går inn i midlingen, og resynkroniserer så og fortsetter å midle. For et lite eller ikke-sinusformet signal som utløser porten på hver blokk, fjern haken for «Oppdag tidsdiskontinuitet» på fanen FFT-innstillinger.
tip.21.title = SNR og ENOB holder seg ærlige under en bred eller støyete tone.
tip.21.body = Støytallene utelukker ikke bare grunntonen og dens harmoniske, men hele dens lekkasje- og fasestøyskjørt - det utelukkede båndet utvides for å følge en bred eller ustabil tone helt ned til gulvet, så et bredt skjørt oppblåser aldri SNR eller ENOB.
tip.22.title = Dropp enheten - rene tall betyr grunnenheten.
tip.22.body = Skriv bare et tall, så tar feltet det i grunnenheten sin - 1000 i et frekvensfelt er 1000 Hz, i et amplitudefelt 1000 V, i et tidsfelt 1000 s. Kilohertz har korte former også: 1,5k, 1,5kh og 1,5khz betyr alle 1,5 kHz.
tip.23.title = Dra et rektangel for å zoome inn på nøyaktig det området.
tip.23.body = I oscilloskop-, FFT- og frekvensrespons-visningene drar du med venstre knapp for å ramme inn området du er ute etter - når du slipper, fyller det visningen. Ctrl+Z går tilbake gjennom de siste 32 zoomene i visningen under pekeren.
tip.24.title = Sett dither i dBV og les det rett av FFT-gulvet.
tip.24.body = Generatorens dither-felt tar en bitdybde eller et dBV-nivå, og dBV-verdien inkluderer allerede FFT-vinduets støybåndbredde - så med inkoherent (effekt-)midling lander FFT-støygulvet nøyaktig der du setter det: skriv inn −100 dBV, så ligger gulvet på −100 dBV. Koherent midling utligner støy og viser et langt lavere gulv.
tip.25.title = Maskinvaren trenger ikke stå på pulten din.
tip.25.body = Kjør Phonalyser som server på maskinen omformerne dine er koblet til, og trykk så «Servere...» i Innstillinger → Lyd. Tabellen åpner tom: skriv inn vertsnavnet og porten til den benken (8377 som standard) under «Legg til server manuelt» én gang, så fyller dens egen serverliste inn resten. Backendene dens blir så med i backend-lista, og enheter, kort, kalibrering, generatoren og sveipene fungerer alle som om kortet var plugget inn her.
tip.26.title = En benkenhet noen andre måler på sier fra om det.
tip.26.body = Hver av en servers enheter er låst til én klient om gangen, og en enhet en annen operatør holder står med «i bruk av» pluss klientens navn rett i enhetslista - så du finner det ut før du starter opptaket, ikke etterpå.
tip.27.title = Les de harmoniske rett av aksen med dBr.
tip.27.body = Bytt FFT-ens amplitudeenhet til dBr, så ligger grunntonen på nøyaktig 0, og hver harmonisk og hver spur leses direkte som «så og så mange dB under tonen». Referansen er den viste grunntonen og leses på nytt ved hver opptegning, så den følger et nivå som driver.
tip.28.title = Skriv utgangsnivået i dBFS når det er fullskala du mener.
tip.28.body = Generatoren, frekvensrespons-sveipet og notch-innstillingsveiviseren tar alle en amplitude i dBFS - endelsen dbfs, eller den korte dbf - og fortsetter å vise den i den enheten. 0 dBFS er en fullskala sinus, så tallet skifter ikke betydning når du bytter bølgeform.
tip.29.title = Amplitudehistogrammet skiller klipping fra støy på et blunk.
tip.29.body = Åpne det fra oscilloskopets verktøylinje: en sinus tegner badekaret av sine to vendepunkter, bredbåndsstøy en gaussisk klokke, og et klippet signal en hard spiss der skinnen ligger. En bølgeform som er klippet bare på én side, viser seg som ulike søyler om midtlinjen.
tip.30.title = Et QA40x-inngangsområde på «0 dBV» er ikke 0 dBV RMS.
tip.30.body = Områdetabellen sier det rett ut - 0 "dBV" real 0 dBFS or -9 dBV - fordi et QA-inngangsområde er en topp-til-topp dBFS-referanse over det differensielle paret, og den sanne RMS-fullskalaen ligger rundt 9 dB lavere. Utgangsområdene er ekte dBV.
tip.31.title = Kalibreringen din kan følge deg ut på benken.
tip.31.body = Velg en serverenhet uten kalibrering mens denne maskinen har et kalibrert kort som passer til den, så tilbyr Phonalyser å kopiere verdiene over - én gang per økt, og aldri i det stille. Si nei, og ingenting skrives.
tip.32.title = En QA403 kjører på 384 kHz; en QA402 gjør det ikke.
tip.32.body = Frekvenslista følger analysatoren som faktisk er tilkoblet - samplingsfrekvens-registeret har en fjerde kode bare QA403 har. Opptaket og generatoren kjører begge på den frekvensen du velger, fordi de to retningene deler én maskinvareklokke.
tip.33.title = QA40x-en kan drive en omformer rett fra I2S-porten på frontpanelet.
tip.33.body = Slå på porten under «QA40x-innstillinger», så tilbyr lista over utgangs-bitdybde portens 16 og 32 bit i stedet for analysatorens 24, mens inngangen blir stående på 24 hele veien. Det er eksperimentelt: QuantAsylum dokumenterer kontakten, men ikke registrene som slår den på.
tip.34.title = Et langt sveip må ikke lenger ventes ut.
tip.34.body = Framdriftsvinduet for frekvensrespons har en «Avbryt»-knapp. Avbruddet er samarbeidende - sveipet avsluttes gjennom den vanlige stoppveien, så vinduet lukkes og ruten låses opp akkurat som etter en fullført kjøring, med opptaket og generatoren levert tilbake.
tip.35.title = En frekvensrespons som ser jevn ut, kan likevel være klippet.
tip.35.body = Nådde opptaket fullskala, blir du advart så snart kurven dukker opp. Dekonvolusjon gjør et opptak som har gått i skinnen om til en fin, regelmessig rippel som ser ut som støy heller enn som skade, så senk drivnivået i stedet for å stole på kurven.
tip.36.title = Enhver frekvensrespons på skjermen kan lagres.
tip.36.body = Fanen «Lagre til ...» skriver den viste kurven til fil uten noen form for kvalitetskrav - et sveip du nettopp har kjørt, ett som er drevet forsiktig, eller ett som er lastet inn igjen fra disk. Det eneste den krever, er at det finnes en måling.
tip.37.title = Plugg inn et kort uten å starte programmet på nytt.
tip.37.body = «Søk etter enheter» i Innstillinger → Lyd teller opp nettleserens enhetsliste på nytt, setter sammen backend-lista på nytt - det er slik et QA40x som plugges inn etter oppstart i det hele tatt dukker opp som backend - og spør en tilkoblet benk om backendene sine på nytt.
tip.38.title = Innstillinger sier fra når voltene dine er gjetninger.
tip.38.body = Å lukke Lyd-fanen etter et backend- eller enhetsbytte sjekker at det valget som ble bekreftet virkelig ender i en målt fullskala, og navngir inngangen, utgangen eller begge når det ikke gjør det. Et kort som er bundet til enheten, men bare inneholder nuller, teller som ukalibrert - en tom rad er ingen måling.
tip.39.title = En død inngang sier fra i stedet for å tegne en flat strek.
tip.39.body = Trekk ut kortet, eller la et annet program ta det eksklusivt, og oscilloskopet og FFT-en stopper med én dialog som navngir backenden og sier om enheten ble borte eller bare sluttet å levere sampler. Avspillingssiden overvåkes på samme måte.
tip.40.title = En lagret innstilling som ikke lar seg lese, blir aldri overskrevet.
tip.40.body = Innstillingene og kortene dine ligger i nettleserens lokale lager, ikke i filer. En verdi som ikke lar seg lese, kopieres til side under samme nøkkel med endelsen .corrupt og kjøringen starter fra standardverdiene, så hver kalibrering i den overlever for gjenoppretting i stedet for å bli støpt over av neste lagring.

