# ===== TIP OF THE DAY =====

tip.dialog.heading = Savjet dana
tip.dialog.dontShowAgain = Ne prikazuj ponovno
tip.dialog.next = Sljedeći savjet
tip.dialog.close = Zatvori
tip.dialog.closeCountdown = Zatvori ({0}s)
tip.count = 41
tip.1.title = Koherentno usrednjavanje doseže daleko ispod razine šuma.
tip.1.body = Ostavite koherentno (kompleksno) usrednjavanje uključeno i pustite FFT da radi - ton se zbraja dok se šum djelomično poništava, pa razina pada što dulje čekate.
tip.2.title = Prikvačite generator na FFT spremnik za čist spektar.
tip.2.body = Uz uključeno "Prikvači frekvenciju na najbliži", ton pada točno na spremnik, pa curenje ne razmazuje osnovni harmonik i procjene harmonika ostaju vjerodostojne.
tip.3.title = Ručno fiksirajte osnovni harmonik na twin-T notch filtru.
tip.3.body = Pasivni twin-T nul-prijenos toliko je strm da nekoliko desetinki herca toplinskog odmaka pomakne deugrađeni osnovni harmonik. Unesite razinu koju stvarno znate uz "Ručni osnovni harmonik"; harmonici, na blagom boku, deugrađuju se bez problema.
tip.4.title = Samo je QA40x bit-egzaktan u pregledniku.
tip.4.body = Stranica nema ekskluzivni način: Web Audio snimka do nje stiže kao float32 nakon Windowsova dijeljenog miksera, pa je sve što je taj mikser učinio već u uzorcima. QA40x je iznimka - zaobilazi mikser time što uopće nije zvučna kartica, i čita se izravno preko WebUSB-a.
tip.5.title = Nema pozadine koju bi se odabralo za brži osciloskop.
tip.5.body = Brzinu osvježavanja osciloskopa određuju Web Audio povratni poziv i put iscrtavanja, a ne upravljački program koji biste mogli birati. Ono što možete podići jest sama frekvencija snimanja, a ona se postavlja u Windowsima na samom uređaju, a ne u ovoj aplikaciji - vidi "Windows ulazni uređaj" u priručniku.
tip.6.title = Kotačić miša zumira oko pokazivača.
tip.6.body = U bilo kojem prikazu traga: kotačić pomiče okomito, Shift+kotačić vodoravno, Ctrl+kotačić zumira okomitu os, a Ctrl+Shift+kotačić vodoravnu - oba zumiranja drže vrijednost ispod pokazivača fiksnom.
tip.7.title = Svako numeričko polje prima jedinice, kotačić i tipkovnicu.
tip.7.body = Upišite vrijednost s njenom jedinicom (µV, 1.5 V, -3 dBV, 2 kHz), zakotrljajte kotačić, kliknite strelice gore/dolje ili pritisnite tipke gore/dolje na tipkovnici za korak.
tip.8.title = Sinc interpolacija bitna je samo kad ste zumirani.
tip.8.body = Sin/Lin prekidač mijenja trag samo kad su točke uzorka udaljene nekoliko piksela na zaslonu; inače ravne linije izgledaju jednako i troše manje CPU-a. Uključite ga kad pojedinačni uzorci postanu vidljivi.
tip.9.title = Histereza stabilizira okidač na slabom, šumnom signalu.
tip.9.body = Bez nje, šum oko razine okidanja izaziva navalu lažnih okidanja i trag titra. Omogućite histerezu okidača i trag se zaključa.
tip.10.title = Spremljeni signal generatora savršena je referenca.
tip.10.body = "Spremi u..." zapisuje idealni, matematički egzaktan val - bez distorzije DAC-a, pojačala ili kablova. Pošaljite ga drugom instrumentu i svaka nesavršenost koju izmjerite pripada tom uređaju, a ne izvoru.
tip.11.title = Deugradite mjerni sklop kalibracijskom datotekom.
tip.11.body = Izmjerite notch, atenuator ili odziv zvučne kartice jednom u modulu Frekvencijski odziv, zatim učitajte taj .frc u FFT analizator: njegov odziv dijeli se van pri prikazu, pa tablica prikazuje uređaj koji se ispituje.
tip.12.title = Preklop rekonstruirane razlike obuzdava blizak par dvaju tonova.
tip.12.body = U dvotonskom načinu preklop osciloskopa "Rekonstruirana razlika" crta sporu ovojnicu |f1 - f2|, pa možete okidati na razlici umjesto da jurite za brzim prolascima nosioca.
tip.13.title = Frekvencijski sweep sam je sebi referenca.
tip.13.body = Sweep mjerenje dekonvoluira se prema točno onom sweepu koji je odsviran - ne prema ponovno izmjerenoj kopiji - pa su oporavljena amplituda i faza prava prijenosna funkcija uređaja.
tip.14.title = Ctrl+F1 skače ravno na pravu pomoć.
tip.14.body = Pritisnite F1 bilo gdje za priručnik, ili Ctrl+F1 za otvaranje pomoći na točnom odjeljku za kontrolu koja trenutno ima fokus.
tip.15.title = Rezidualni prikaz pokazuje što se skriva ispod osnovnog harmonika.
tip.15.body = Prebacite kanal na "Rezidual" i osciloskop crta snimljeni signal umanjen za najbolje prilagođeni ton - distorzija, šum i smetnje zakopane ispod osnovnog harmonika postaju vidljive. Radi i dvotonski način: obje se frekvencije mjere iz same snimke, pa slobodno radeći DAC i ADC taktovi ne mogu razmazati oduzimanje.
tip.16.title = Preklopite idealni filtar preko izmjerenog odziva.
tip.16.body = Kartica Filtri modula Frekvencijski odziv sidri idealni niskopropusni, visokopropusni, pojasnopropusni ili notch filtar (Butterworth, Čebišev, inverzni Čebišev, eliptički, Bessel) na izmjerenu krivulju, a Usporedi crta odstupanje od njega - na isti način kao i prema RIAA-i.
tip.17.title = Prepustite očitanju Neravnomjernost da za vas prosudi ravnost.
tip.17.body = Na kartici Neravnomjernost pronađite rubove pojasa gdje odziv prvi put napušta koridor od ±X dB od svog vrha (ili od svog minimuma za notch), ili očitajte ± odstupanje preko odabranog raspona - ucrtano izravno na grafu, s brojkama iscrtanima kao tablica preko krivulje.
tip.18.title = Kalibracija pune skale pripada zvučnoj kartici.
tip.18.body = Svaka kartica čuva vlastiti profil: jedan redak po atenuatoru ili DIP rasponu, odvojene lijeve / desne vrijednosti, uparene po imenu uređaja na svakoj pozadini - pa zamjena uređaja ili pozadina nikad ne pomiješa kalibracije. Poznate kartice nude se unaprijed konfigurirane; vaša ih kalibracija končanicom dodatno izoštrava.
tip.19.title = Pobuđujte samo kanal koji mjerite.
tip.19.body = Generator, sweep frekvencijskog odziva i ugađanje notch filtra svaki imaju birač Izlazni kanal - Oba, samo Lijevi ili samo Desni - koji uživo propušta pobuđivanu stazu. Zgodno za provjere preslušavanja i uređaje s jednim ulazom.
tip.20.title = Jako odzumiran, osciloskop iscrtava poput pravog DSO-a.
tip.20.body = Iznad jednog uzorka po pikselu trag postaje slika digitalnog fosfora: histogram zadržavanja svakog stupca, prevučen perom konfigurirane širine traga - uski impulsi i ovojnice razlike zadržavaju svoj pravi vrh-do-vrha na svakom zumu, a svjetlina pokazuje gdje se signal zadržava.
tip.21.title = Snimke sa smetnjama nikad ne otruju dugo usrednjavanje.
tip.21.body = FFT odbacuje blokove koji sadrže spojeve, ispade ili smetnje koje krše granicu pojasa prije nego što uđu u prosjek, zatim se ponovno sinkronizira i nastavlja usrednjavati. Za mali ili nesinusni signal koji okida zaštitu na svakom bloku, odznačite "Otkrij vremenski diskontinuitet" na kartici postavki FFT-a.
tip.22.title = SNR i ENOB ostaju vjerodostojni i pod širokim ili šumnim tonom.
tip.22.body = Vrijednosti šuma isključuju ne samo osnovni harmonik i njegove harmonike, nego i cijeli njegov skut curenja i faznog šuma - isključeni pojas se širi kako bi pratio širok ili treperav ton sve do razine šuma, pa širok skut nikad ne napuhne SNR ni ENOB.
tip.23.title = Preskočite jedinicu - sami brojevi znače osnovnu jedinicu.
tip.23.body = Upišite samo broj i polje ga prima u svojoj osnovnoj jedinici - 1000 u polju frekvencije je 1000 Hz, u polju amplitude 1000 V, u polju vremena 1000 s. I kiloherc ima kratke oblike: 1.5k, 1.5kh i 1.5khz svi znače 1.5 kHz.
tip.24.title = Povucite pravokutnik za zumiranje točno u to područje.
tip.24.body = U prikazima osciloskopa, FFT-a i frekvencijskog odziva, povucite lijevom tipkom da gumenom vrpcom obuhvatite područje koje vas zanima - na otpuštanju ispunjava prikaz. Ctrl+Z korača unatrag kroz posljednja 32 zumiranja prikaza ispod pokazivača.
tip.25.title = Zadajte dither u dBV i očitajte ga izravno s razine šuma FFT-a.
tip.25.body = Polje dithera generatora prihvaća bitsku dubinu ili razinu u dBV, a dBV već uključuje šumovnu širinu pojasa FFT prozora - pa uz nekoherentno usrednjavanje (snage) razina šuma FFT-a sjeda točno ondje gdje je zadate: upišite −100 dBV i razina šuma leži na −100 dBV. Koherentno usrednjavanje poništava šum i očitava znatno niže.
tip.26.title = Hardver ne mora biti na vašem stolu.
tip.26.body = Pokrenite Phonalyser kao poslužitelj na računalu na koje su spojeni vaši pretvarači, pa pritisnite Poslužitelji... u Postavke → Audio. Tablica se otvara prazna: jednom upišite ime računala i vrata tog mjernog stola (8377 zadano) pod "Dodaj poslužitelj po adresi", a njegova vlastita tablica susjeda popunit će ostalo. Njegove se pozadine tada pridružuju popisu pozadina, a uređaji, kartice, kalibracija, generator i sweepovi rade baš kao da je kartica ovdje utaknuta.
tip.27.title = Uređaj na mjernom stolu na kojem netko drugi mjeri to i kaže.
tip.27.body = Svaki je uređaj poslužitelja zaključan na jednog klijenta u isto vrijeme, a uređaj koji drži drugi operater prikazuje "koristi" i ime tog klijenta izravno u popisu uređaja - pa to doznate prije nego što pokrenete snimanje, a ne poslije.
tip.28.title = Očitajte harmonike izravno s osi pomoću dBr.
tip.28.body = Prebacite jedinicu amplitude FFT-a na dBr i osnovni harmonik sjeda točno na 0, pa se svaki harmonik i svaki šiljak čita izravno kao "toliko i toliko dB ispod tona". Referenca je prikazani osnovni harmonik i ponovno se očitava pri svakom iscrtavanju, pa prati razinu koja se pomiče.
tip.29.title = Upišite izlaznu razinu u dBFS kad mislite na punu skalu.
tip.29.body = Generator, sweep frekvencijskog odziva i čarobnjak za ugađanje notch filtra svi primaju amplitudu u dBFS - nastavak dbfs ili kratko dbf - i nastavljaju je prikazivati u toj jedinici. 0 dBFS je sinus pune skale, pa broj ne mijenja značenje kad promijenite valni oblik.
tip.30.title = Amplitudni histogram na prvi pogled razlikuje rezanje od šuma.
tip.30.body = Otvorite ga iz alatne trake osciloskopa: sinus crta kadu svojih dviju prijelomnih točaka, širokopojasni šum Gaussovo zvono, a odrezani signal oštar šiljak ondje gdje je granica. Valni oblik odrezan samo s jedne strane vidi se kao nejednaki stupci s obje strane središnje crte.
tip.31.title = QA40x ulazni raspon "0 dBV" nije 0 dBV RMS.
tip.31.body = Tablica raspona to izričito kaže - 0 "dBV" real 0 dBFS or -9 dBV - jer je QA ulazni raspon dBFS referenca od vrha do vrha preko diferencijalnog para, čija prava RMS puna skala leži oko 9 dB niže. Izlazni rasponi su pravi dBV.
tip.32.title = Vaša kalibracija može poći s vama na mjerni stol.
tip.32.body = Odaberite uređaj poslužitelja koji nema kalibraciju dok ovo računalo drži odgovarajuću kalibriranu karticu, i Phonalyser će ponuditi da prepiše vrijednosti - jednom po sesiji i nikad prešutno. Odbijete li, ništa se ne zapisuje.
tip.33.title = QA403 radi na 384 kHz; QA402 ne.
tip.33.body = Popis frekvencija slijedi analizator koji je stvarno priključen - registar frekvencije uzorkovanja ima četvrti kod kakav ima samo QA403. Snimanje i generator rade na frekvenciji koju odaberete, jer oba smjera dijele jedan hardverski takt.
tip.34.title = QA40x može pobuditi pretvarač izravno sa svog I2S priključka na prednjoj ploči.
tip.34.body = Uključite priključak pod Postavke QA40x i popis bitske dubine izlaza nudi 16 i 32 bita priključka umjesto 24 bita analizatora, dok ulaz cijelo vrijeme ostaje na 24. Eksperimentalno je: QuantAsylum dokumentira konektor, ali ne i registre koji ga omogućuju.
tip.35.title = Dug sweep više ne treba čekati do kraja.
tip.35.body = Prozor napretka frekvencijskog odziva nosi gumb Odustani. Surađuje - sweep završava uobičajenim putem zaustavljanja, pa se prozor zatvara i ploča otključava točno kao nakon dovršenog mjerenja, uz vraćeno snimanje i generator.
tip.36.title = Frekvencijski odziv koji izgleda gladak i dalje može biti odrezan.
tip.36.body = Ako je snimka dosegla punu skalu, upozoreni ste čim se trag pojavi. Dekonvolucija pretvara snimku zapelu na granici u sitno pravilno valovanje koje se čita kao šum, a ne kao oštećenje, pa smanjite razinu pobude umjesto da vjerujete krivulji.
tip.37.title = Svaki frekvencijski odziv na zaslonu može se spremiti.
tip.37.body = Kartica Spremi u... zapisuje prikazanu krivulju u datoteku bez ikakve provjere kvalitete - sweep koji ste upravo izmjerili, sweep pobuđen sasvim tiho ili krivulju učitanu natrag s diska. Jedino što traži jest da mjerenje uopće postoji.
tip.38.title = Utaknite karticu bez ponovnog pokretanja aplikacije.
tip.38.body = Traži uređaje u Postavke → Audio ponovno nabraja popis uređaja preglednika, iznova sastavlja popis pozadina - upravo se tako QA40x utaknut nakon pokretanja uopće pojavi kao pozadina - i ponovno pita spojeni mjerni stol za njegove pozadine.
tip.39.title = Postavke vam kažu kad su vaši volti tek nagađanje.
tip.39.body = Zatvaranje kartice Audio nakon promjene pozadine ili uređaja provjerava razrješava li se potvrđeni odabir doista u izmjerenu punu skalu, i imenuje ulaz, izlaz ili oboje kad se ne razrješava. Zvučna kartica vezana uz uređaj, ali ispunjena nulama, računa se kao nekalibrirana - prazan redak nije mjerenje.
tip.40.title = Mrtav ulaz to kaže umjesto da crta ravnu crtu.
tip.40.body = Iskopčajte karticu ili pustite da je druga aplikacija preuzme ekskluzivno, i osciloskop i FFT stanu uz jedan dijalog koji imenuje pozadinu i kaže je li uređaj izgubljen ili je samo prestao isporučivati uzorke. Reprodukcijska strana nadzire se jednako.
tip.41.title = Spremljena postavka koja se ne može raščlaniti nikad se ne prepisuje.
tip.41.body = Vaše postavke i kartice žive u lokalnoj pohrani preglednika, a ne u datotekama. Vrijednost koja se ne može raščlaniti kopira se ustranu pod isti ključ s nastavkom .corrupt, a pokretanje kreće od zadanih vrijednosti, pa svaka kalibracija u njoj preživi za spašavanje umjesto da je sljedeće spremanje zabetonira.

