# ===== TIP OF THE DAY =====

tip.dialog.heading = Suggerimento del giorno
tip.dialog.dontShowAgain = Non mostrare più
tip.dialog.next = Suggerimento successivo
tip.dialog.close = Chiudi
tip.dialog.closeCountdown = Chiudi ({0}s)
tip.count = 40
tip.1.title = La media coerente scava ben al di sotto del rumore di fondo.
tip.1.body = Lascia attiva la media coerente (complessa) e fai girare la FFT: il tono si somma mentre il rumore in parte si cancella, così il rumore di fondo continua a scendere quanto più aspetti.
tip.2.title = Aggancia il generatore a un bin FFT per uno spettro pulito.
tip.2.body = Con "Aggancia frequenza al più vicino" attivo, il tono cade esattamente su un bin, così la dispersione non spalma la fondamentale e le stime delle armoniche restano oneste.
tip.3.title = Fissa a mano la fondamentale su un notch twin-T.
tip.3.body = Un null passivo twin-T è così ripido che pochi decimi di hertz di deriva termica fanno oscillare la fondamentale de-embeddata. Inserisci il livello che conosci davvero con "Fondamentale manuale"; le armoniche, sul fianco dolce, si de-embeddano bene.
tip.4.title = Solo il QA40x è bit-exact in un browser.
tip.4.body = Una pagina non ha modalità esclusiva: l'acquisizione Web Audio le arriva come float32 dopo il mixer condiviso di Windows, quindi tutto ciò che quel mixer ha fatto è già nei campioni. Il QA40x è l'eccezione: aggira il mixer non essendo affatto una scheda audio, e viene letto direttamente via WebUSB.
tip.5.title = La rotellina del mouse zooma attorno al cursore.
tip.5.body = In qualsiasi vista traccia: la rotellina si muove in verticale, Shift+rotellina in orizzontale, Ctrl+rotellina zooma l'asse verticale e Ctrl+Shift+rotellina quello orizzontale; entrambi gli zoom mantengono fisso il valore sotto il puntatore.
tip.6.title = Ogni campo numerico accetta unità, rotellina e tastiera.
tip.6.body = Digita un valore con la sua unità (µV, 1.5 V, -3 dBV, 2 kHz), scorri la rotellina, clicca le frecce su/giù oppure premi i tasti su/giù della tastiera per incrementare.
tip.7.title = L'interpolazione sinc conta solo quando sei in zoom.
tip.7.body = L'interruttore Sin/Lin cambia la traccia solo quando i punti campione distano un paio di pixel sullo schermo; altrimenti le linee rette appaiono identiche e costano meno CPU. Attivalo una volta che i singoli campioni sono visibili.
tip.8.title = L'isteresi stabilizza il trigger su un segnale debole e rumoroso.
tip.8.body = Senza di essa, il rumore attorno al livello di trigger scatena una raffica di falsi trigger e la traccia trema. Abilita l'isteresi del trigger e la traccia si aggancia.
tip.9.title = Un segnale del generatore salvato è un riferimento perfetto.
tip.9.body = "Salva con nome..." scrive la forma d'onda ideale, matematicamente esatta: nessuna distorsione di DAC, amplificatore o cablaggio. Inviala a un altro strumento e qualsiasi imperfezione che misuri appartiene a quel dispositivo, non alla sorgente.
tip.10.title = De-embedda un fixture con un file di calibrazione.
tip.10.body = Misura una volta la risposta di un notch, di un attenuatore o di una scheda audio nel modulo Risposta in frequenza, poi carica quel .frc nell'analizzatore FFT: la sua risposta viene divisa via in fase di visualizzazione, così la tabella mostra il dispositivo in prova.
tip.11.title = L'overlay del battimento ricostruito addomestica una coppia ravvicinata di due toni.
tip.11.body = In modalità due toni l'overlay "Battimento ricostruito" dello scope disegna l'inviluppo lento |f1 - f2|, così puoi triggerare sul battimento invece di rincorrere i veloci passaggi per lo zero della portante.
tip.12.title = Lo sweep di risposta in frequenza è il riferimento di sé stesso.
tip.12.body = La misura spazzata viene deconvoluta rispetto all'esatto sweep riprodotto, non a una copia ri-misurata, così l'ampiezza e la fase recuperate sono la vera funzione di trasferimento del dispositivo.
tip.13.title = Ctrl+F1 salta dritto alla guida giusta.
tip.13.body = Premi F1 ovunque per il manuale, oppure Ctrl+F1 per aprire la guida esattamente alla sezione del controllo che ha attualmente il fuoco.
tip.14.title = La vista residuo mostra ciò che si nasconde sotto la fondamentale.
tip.14.body = Commuta un canale su "Residuo" e lo scope disegna il segnale acquisito meno il tono che meglio lo approssima: distorsione, rumore e glitch sepolti sotto la fondamentale diventano visibili. Funziona anche con due toni: entrambe le frequenze vengono misurate dall'acquisizione stessa, così i clock liberi di DAC e ADC non possono spalmare la sottrazione.
tip.15.title = Sovrapponi un filtro ideale a una risposta misurata.
tip.15.body = La scheda Filtri del modulo Risposta in frequenza ancora un passa-basso, passa-alto, passa-banda o notch ideale (Butterworth, Chebyshev, Chebyshev inverso, ellittico, Bessel) alla curva misurata, e Confronta traccia lo scostamento da esso, proprio come contro la RIAA.
tip.16.title = Lascia che la lettura di Irregolarità giudichi la piattezza per te.
tip.16.body = Nella scheda Irregolarità trova i bordi di banda dove la risposta esce per la prima volta da un corridoio di ±X dB dal suo picco (o dal suo minimo per un notch), oppure leggi la deviazione ± su un intervallo scelto: tutto annotato direttamente sul grafico, con i valori disegnati come tabella sovrapposta alla curva.
tip.17.title = La calibrazione di fondo scala appartiene alla scheda audio.
tip.17.body = Ogni scheda conserva il proprio profilo: una riga per ogni attenuatore o intervallo DIP, valori separati sinistro / destro, abbinati per nome dispositivo su ogni backend; così cambiare dispositivo o backend non mescola mai le calibrazioni. Le schede note vengono offerte già preconfigurate; la tua calibrazione col mirino le affina.
tip.18.title = Pilota solo il canale che stai misurando.
tip.18.body = Il generatore, lo sweep di risposta in frequenza e il sintonizzatore del notch hanno ciascuno un selettore Canale di uscita (Entrambi, solo Sinistro o solo Destro) che apre e chiude dal vivo la via pilotata. Comodo per le verifiche di diafonia e per i dispositivi a ingresso singolo.
tip.19.title = Con lo zoom molto arretrato, lo scope disegna come un vero DSO.
tip.19.body = Oltre un campione per pixel la traccia diventa un'immagine a fosfori digitali: l'istogramma di permanenza di ogni colonna, spazzato con una penna larga quanto la traccia configurata; gli impulsi stretti e gli inviluppi di battimento mantengono il loro vero picco-picco a qualsiasi zoom, e la luminosità mostra dove il segnale staziona.
tip.20.title = Le acquisizioni con glitch non avvelenano mai una media lunga.
tip.20.body = La FFT scarta i blocchi che contengono giunzioni, dropout o glitch che violano il limite di banda prima che entrino nella media, poi si risincronizza e continua a mediare. Per un segnale piccolo o non sinusoidale che fa scattare il controllo a ogni blocco, deseleziona "Rileva discontinuità temporale" nella scheda Impostazioni FFT.
tip.21.title = SNR ed ENOB restano onesti anche con un tono largo o rumoroso.
tip.21.body = Le cifre di rumore escludono non solo la fondamentale e le sue armoniche, ma tutto il suo fianco di dispersione e di rumore di fase: la banda esclusa si allarga per seguire un tono largo o instabile fino al rumore di fondo, così un fianco ampio non gonfia mai SNR né ENOB.
tip.22.title = Ometti l'unità: le cifre da sole indicano l'unità di base.
tip.22.body = Digita solo un numero e il campo lo interpreta nella sua unità di base: 1000 in un campo di frequenza vale 1000 Hz, in un campo di ampiezza 1000 V, in un campo di tempo 1000 s. Anche i kilohertz hanno forme abbreviate: 1.5k, 1.5kh e 1.5khz significano tutti 1.5 kHz.
tip.23.title = Trascina un rettangolo per zoomare esattamente su quella regione.
tip.23.body = Nelle viste oscilloscopio, FFT e risposta in frequenza, trascina con il pulsante sinistro per racchiudere in un rettangolo elastico l'area che ti interessa: al rilascio riempie la vista. Ctrl+Z torna indietro lungo gli ultimi 32 zoom della vista sotto il puntatore.
tip.24.title = Imposta il dither in dBV e leggilo direttamente sul rumore di fondo della FFT.
tip.24.body = Il campo Dither del generatore accetta bit o un livello in dBV, e il valore in dBV include già la banda di rumore della finestra FFT - così con la media incoerente (di potenza) il rumore di fondo della FFT si posiziona esattamente dove lo imposti: inserisci −100 dBV e il fondo si assesta a −100 dBV. La media coerente cancella il rumore e legge molto più in basso.
tip.25.title = L'hardware non deve per forza stare sulla tua scrivania.
tip.25.body = Fai girare Phonalyser come server sulla macchina a cui sono cablati i tuoi convertitori, poi premi Server... in Preferenze → Audio. La tabella si apre vuota: digita una volta l'host e la porta di quel banco (8377 per impostazione predefinita) sotto "Aggiungi un server manualmente", e sarà la sua tabella dei pari a completare il resto. I suoi backend entrano allora nell'elenco dei backend, e dispositivi, schede, calibrazione, generatore e sweep funzionano come se la scheda fosse collegata qui.
tip.26.title = Un dispositivo del banco su cui sta misurando qualcun altro lo dichiara.
tip.26.body = Ogni dispositivo di un server è bloccato su un solo client alla volta, e un dispositivo tenuto da un altro operatore mostra "in uso da" seguito dal nome di quel client direttamente nell'elenco dei dispositivi: lo scopri prima di avviare la registrazione, non dopo.
tip.27.title = Leggi le armoniche direttamente sull'asse con i dBr.
tip.27.body = Commuta l'unità di ampiezza della FFT su dBr e la fondamentale si colloca esattamente a 0, così ogni armonica e ogni spuria si legge direttamente come "tanti dB sotto il tono". Il riferimento è la fondamentale visualizzata e viene riletto a ogni ridisegno, quindi segue un livello che deriva.
tip.28.title = Digita un livello di uscita in dBFS quando intendi il fondo scala.
tip.28.body = Il generatore, lo sweep di risposta in frequenza e la procedura guidata di taratura del notch accettano tutti un'ampiezza in dBFS - suffisso dbfs, oppure il breve dbf - e continuano a mostrarla in quell'unità. 0 dBFS è una sinusoide a fondo scala, quindi la cifra non cambia significato quando cambi forma d'onda.
tip.29.title = L'istogramma di ampiezza distingue il clipping dal rumore a colpo d'occhio.
tip.29.body = Aprilo dalla barra strumenti dell'oscilloscopio: una sinusoide disegna la vasca dei suoi due punti di inversione, il rumore a banda larga una campana gaussiana e un segnale clippato un picco netto dove sta il limite. Una forma d'onda clippata da un solo lato appare come barre disuguali ai due lati della linea centrale.
tip.30.title = Una portata d'ingresso QA40x "0 dBV" non è 0 dBV RMS.
tip.30.body = La tabella delle portate lo dice a chiare lettere - 0 "dBV" real 0 dBFS or -9 dBV - perché una portata d'ingresso QA è un riferimento dBFS picco-picco sulla coppia differenziale, il cui vero fondo scala RMS sta circa 9 dB più in basso. Le portate di uscita, invece, sono dBV autentici.
tip.31.title = La tua calibrazione può seguirti fino al banco.
tip.31.body = Seleziona un dispositivo del server privo di calibrazione mentre questa macchina possiede una scheda calibrata corrispondente, e Phonalyser propone di copiarne i valori: una volta per sessione, e mai in silenzio. Rispondi di no e non viene scritto nulla.
tip.32.title = Un QA403 arriva a 384 kHz; un QA402 no.
tip.32.body = L'elenco delle frequenze segue l'analizzatore realmente collegato: il registro della frequenza di campionamento ha un quarto codice che solo il QA403 possiede. Acquisizione e generatore girano entrambi alla frequenza che scegli, perché le due direzioni condividono un unico clock hardware.
tip.33.title = Il QA40x può pilotare un convertitore direttamente dalla porta I2S sul pannello frontale.
tip.33.body = Attiva la porta sotto Preferenze QA40x e l'elenco delle profondità di bit in uscita offre i 16 e 32 bit della porta al posto dei 24 dell'analizzatore, mentre l'ingresso resta a 24 per tutto il tempo. È sperimentale: QuantAsylum documenta il connettore, ma non i registri che lo abilitano.
tip.34.title = Uno sweep lungo non va più aspettato fino in fondo.
tip.34.body = La finestra di avanzamento della risposta in frequenza porta un pulsante Annulla. È cooperativo: lo sweep termina per la normale via di arresto, così la finestra si chiude e il pannello si sblocca esattamente come dopo un'esecuzione completata, con acquisizione e generatore restituiti.
tip.35.title = Una risposta in frequenza dall'aspetto liscio può comunque essere clippata.
tip.35.body = Se l'acquisizione ha raggiunto il fondo scala vieni avvisato appena la traccia compare. La deconvoluzione trasforma una registrazione in saturazione in un fine ripple regolare che si legge come rumore anziché come danno, quindi abbassa il livello di pilotaggio invece di fidarti della curva.
tip.36.title = Qualsiasi risposta in frequenza a schermo può essere salvata.
tip.36.body = La scheda Salva con nome... scrive la curva visualizzata su file senza alcun filtro di qualità: uno sweep appena eseguito, uno pilotato molto piano o uno ricaricato da disco. L'unica cosa che chiede è che esista una misura.
tip.37.title = Collega una scheda senza riavviare l'applicazione.
tip.37.body = Cerca dispositivi in Preferenze → Audio rienumera l'elenco dei dispositivi del browser, ricompone l'elenco dei backend - è così che un QA40x collegato dopo l'avvio compare come backend - e richiede di nuovo a un banco connesso i suoi backend.
tip.38.title = Le Preferenze ti dicono quando i tuoi volt sono ipotesi.
tip.38.body = Chiudendo la scheda Audio dopo un cambio di backend o di dispositivo si verifica che la selezione confermata si risolva davvero in un fondo scala misurato, e vengono nominati l'ingresso, l'uscita o entrambi quando non è così. Una scheda audio legata al dispositivo ma piena di zeri conta come non calibrata: una riga vuota non è una misura.
tip.39.title = Un ingresso morto lo dichiara invece di disegnare una linea piatta.
tip.39.body = Scollega la scheda, o lascia che un'altra applicazione la prenda in esclusiva, e oscilloscopio e FFT si fermano con un'unica finestra di dialogo che nomina il backend e dice se il dispositivo è stato perso o ha semplicemente smesso di consegnare campioni. Il lato riproduzione è sorvegliato allo stesso modo.
tip.40.title = Un'impostazione memorizzata che non si riesce a leggere non viene mai sovrascritta.
tip.40.body = Le tue impostazioni e le tue schede vivono nella memoria locale del browser, non in file. Un valore che non si riesce a leggere viene copiato di lato sulla stessa chiave con il suffisso .corrupt e l'esecuzione riparte dai valori predefiniti, così ogni calibrazione al suo interno sopravvive per il recupero invece di essere cementata dal salvataggio successivo.

