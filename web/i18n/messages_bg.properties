# ===== TIP OF THE DAY =====

tip.dialog.heading = Съвет на деня
tip.dialog.dontShowAgain = Да не се показва повече
tip.dialog.next = Следващ съвет
tip.dialog.close = Затвори
tip.dialog.closeCountdown = Затвори ({0} с)
tip.count = 40
tip.1.title = Кохерентното усредняване копае далеч под нивото на шума.
tip.1.body = Оставете кохерентното (комплексно) усредняване включено и оставете FFT да работи - тонът се натрупва, докато шумът частично се самозаличава, така че нивото на шума продължава да спада, колкото по-дълго чакате.
tip.2.title = Прихванете генератора към FFT бин за чист спектър.
tip.2.body = С включено „Прихващане на честотата към най-близкия“ тонът попада точно върху бин, така че изтичането не размазва основния тон и оценките на хармониците остават коректни.
tip.3.title = Фиксирайте основния тон ръчно при twin-T нотч.
tip.3.body = Пасивен twin-T нул е толкова стръмен, че няколко десети от херца термичен дрейф разклащат де-вградения основен тон. Въведете нивото, което реално знаете, чрез „Ръчен основен тон“; хармониците, разположени на полегатия склон, се де-вграждат добре.
tip.4.title = В браузър само QA40x е побитово точен.
tip.4.body = Страницата няма ексклузивен режим: заснемането с Web Audio стига до нея като float32 след споделения миксер на Windows, така че каквото е направил този миксер, вече е в отчетите. QA40x е изключението - той заобикаля миксера, понеже изобщо не е звукова карта, и се чете директно през WebUSB.
tip.5.title = Колелцето на мишката мащабира около курсора.
tip.5.body = Във всеки изглед на трасе: колелцето движи вертикално, Shift+колелце - хоризонтално, Ctrl+колелце мащабира вертикалната ос, а Ctrl+Shift+колелце - хоризонталната - и двете мащабирания задържат стойността под показалеца фиксирана.
tip.6.title = Всяко числово поле приема единици, колелцето и клавиатурата.
tip.6.body = Въведете стойност с нейната единица (µV, 1.5 V, -3 dBV, 2 kHz), завъртете колелцето, щракнете стрелките нагоре/надолу или натиснете клавишите нагоре/надолу за стъпка.
tip.7.title = Sinc интерполацията има значение само когато сте увеличили мащаба.
tip.7.body = Превключвателят Sin/Lin променя трасето само когато точките на дискретизация са на няколко пиксела една от друга на екрана; иначе правите линии изглеждат еднакво и струват по-малко CPU. Включете го, щом отделните отчети станат видими.
tip.8.title = Хистерезисът стабилизира тригера при слаб, шумен сигнал.
tip.8.body = Без него шумът около нивото на тригера предизвиква порой от фалшиви тригери и трасето трепти. Включете хистерезис на тригера и трасето се заключва.
tip.9.title = Записаният сигнал от генератора е перфектен еталон.
tip.9.body = „Запиши в...“ записва идеалната, математически точна форма на вълната - без изкривяване от DAC, усилвател или окабеляване. Подайте я към друг уред и всяко несъвършенство, което измерите, принадлежи на това устройство, а не на източника.
tip.10.title = Де-вградете приспособление чрез калибрационен файл.
tip.10.body = Измерете нотч, атенюатор или отклика на звукова карта веднъж в модула Честотен отклик, после заредете този .frc във FFT анализатора: неговият отклик се дели при показване, така че таблицата показва тестваното устройство.
tip.11.title = Наслагването на реконструирания биещ тон укротява близка двутонова двойка.
tip.11.body = В двутонов режим наслагването „Реконструиран биещ тон“ на осцилоскопа чертае бавната обвивка |f1 - f2|, така че можете да тригерирате по биещия тон вместо да гоните бързите пресичания на носещата.
tip.12.title = Свипът за честотен отклик е сам по себе си еталон.
tip.12.body = Свипнатото измерване се деконволюира спрямо точния свип, който е бил възпроизведен - не спрямо повторно измерено копие - така че възстановените амплитуда и фаза са истинската предавателна функция на устройството.
tip.13.title = Ctrl+F1 скача директно към правилната помощ.
tip.13.body = Натиснете F1 навсякъде за ръководството или Ctrl+F1, за да отворите помощта точно на раздела за контрола, която в момента е на фокус.
tip.14.title = Изгледът на остатъка показва какво се крие под основния тон.
tip.14.body = Превключете канал на „Остатък“ и осцилоскопът чертае заснетия сигнал минус най-добре напасналия се тон - изкривяване, шум и гличове, заровени под основния тон, стават видими. Работи и с два тона: и двете честоти се измерват от самото заснемане, така че свободно вървящите тактови генератори на DAC и ADC не могат да размажат изваждането.
tip.15.title = Насложете идеален филтър върху измерен отклик.
tip.15.body = Разделът Филтри на модула Честотен отклик закотвя идеален нискочестотен, високочестотен, лентов или режекторен филтър (Батъруърт, Чебишев, обратен Чебишев, елиптичен, Бесел) към измерената крива, а Сравнение чертае отклонението от него - по същия начин, както спрямо RIAA.
tip.16.title = Оставете отчитането на Неравномерност да прецени равността вместо вас.
tip.16.body = В раздела Неравномерност намерете границите на лентата, където откликът за пръв път напуска коридор от ±X dB спрямо върха си (или спрямо минимума си при нотч), или отчетете отклонението ± в избран диапазон - анотирани направо върху графиката, а числата са изчертани като наслоена таблица върху кривата.
tip.17.title = Калибрирането на пълната скала принадлежи на звуковата карта.
tip.17.body = Всяка карта пази собствен профил: по един ред за всеки атенюатор или DIP диапазон, отделни стойности за ляво / дясно, съпоставяни по име на устройството при всеки бекенд - така смяната на устройства или бекендове никога не обърква калибровките. Познатите карти се предлагат предварително конфигурирани; вашето калибриране с кръстачката ги прецизира.
tip.18.title = Задвижвайте само канала, който измервате.
tip.18.body = Генераторът, свипът на честотния отклик и настройката на нотча имат всеки по един селектор Изходен канал - И двата, само Ляв или само Десен - който на живо превключва задвижваната страна. Удобно за проверки на прослушването между каналите и за устройства с един вход.
tip.19.title = Силно отдалечен, осцилоскопът рисува като истински DSO.
tip.19.body = Над един отчет на пиксел трасето се превръща в цифрово-фосфорно изображение: хистограма на престоя за всяка колона, замитана с перо с конфигурираната ширина на трасето - тесните импулси и обвивките на биещия тон запазват истинския си размах при всякакъв мащаб, а яркостта показва къде се задържа сигналът.
tip.20.title = Заснемания с гличове никога не тровят дълго усредняване.
tip.20.body = FFT отхвърля блокове, съдържащи снаждания, отпадания или гличове, нарушаващи лентовото ограничение, преди да влязат в усредняването, после се ресинхронизира и продължава да усреднява. При малък или несинусоидален сигнал, който задейства защитата на всеки блок, размаркирайте „Откриване на времева прекъснатост“ в раздела с настройки на FFT.
tip.21.title = SNR и ENOB остават честни при широк или шумен тон.
tip.21.body = Шумовите показатели изключват не само основния тон и неговите хармоници, но и цялата му пола от изтичане и фазов шум - изключената лента се разширява, за да следва широк или трептящ тон чак до нивото на шума, така че широка пола никога не завишава SNR или ENOB.
tip.22.title = Пропуснете единицата - самите цифри означават базовата единица.
tip.22.body = Въведете само число и полето го приема в базовата си единица - 1000 в честотно поле е 1000 Hz, в амплитудно поле - 1000 V, във времево поле - 1000 s. Килохерцът има и кратки форми: 1.5k, 1.5kh и 1.5khz - всички означават 1.5 kHz.
tip.23.title = Плъзнете правоъгълник, за да увеличите точно тази област.
tip.23.body = В изгледите на осцилоскопа, FFT и честотния отклик плъзнете с левия бутон, за да очертаете с рамка областта, която ви интересува - при отпускане тя запълва изгледа. Ctrl+Z връща назад през последните 32 мащабирания на изгледа под показалеца.
tip.24.title = Задайте dither в dBV и го прочетете направо от нивото на шума на FFT.
tip.24.body = Полето за dither на генератора приема битове или ниво в dBV, а стойността в dBV вече включва шумовата лента на FFT прозореца - така че при некохерентно (по мощност) усредняване нивото на шума на FFT застава точно там, където го зададете: въведете −100 dBV и нивото застава на −100 dBV. Кохерентното усредняване заличава шума и показва много по-ниско ниво.
tip.25.title = Хардуерът не е задължително да е на вашето бюро.
tip.25.body = Пуснете Phonalyser като сървър на машината, към която са свързани вашите преобразуватели, после натиснете „Сървъри...“ в Настройки → Аудио. Таблицата се отваря празна: въведете хоста и порта на онзи работен плот (8377 по подразбиране) веднъж под „Ръчно добавяне на сървър“ и неговата собствена таблица с посочени сървъри попълва останалото. Тогава бекендовете му се нареждат в списъка с бекендове, а устройствата, картите, калибрирането, генераторът и свиповете работят така, сякаш картата е включена тук.
tip.26.title = Устройство на работния плот, на което вече мери някой друг, го казва.
tip.26.body = Всяко устройство на сървъра е заключено за един клиент в даден момент, а устройство, което държи друг оператор, показва „използва се от“ плюс името на онзи клиент направо в списъка с устройства - така разбирате, преди да натиснете „Запис“, а не след това.
tip.27.title = Отчитайте хармониците направо по оста с dBr.
tip.27.body = Превключете единицата за амплитуда на FFT на dBr и основният тон застава точно на 0, така че всеки хармоник и всяка паразитна съставка се четат директно като „толкова dB под тона“. Референцията е показаният основен тон и се преизчислява при всяко прерисуване, така че следва и плаващо ниво.
tip.28.title = Въвеждайте изходно ниво в dBFS, когато имате предвид пълната скала.
tip.28.body = Генераторът, свипът на честотния отклик и помощникът за настройка на нотча приемат амплитуда в dBFS - наставка dbfs или кратко dbf - и продължават да я показват в тази единица. 0 dBFS е синусоида с пълна скала, така че стойността не сменя значението си, когато смените формата на вълната.
tip.29.title = Амплитудната хистограма отличава клипването от шума на един поглед.
tip.29.body = Отворете я от лентата с инструменти на осцилоскопа: синусоидата рисува вана с двете си точки на обръщане, широколентовият шум - гаусова камбана, а клипнатият сигнал - остър връх там, където е границата. Форма на вълната, клипната само от едната страна, се вижда като неравни стълбчета около централната линия.
tip.30.title = Входният обхват „0 dBV“ на QA40x не е 0 dBV RMS.
tip.30.body = Таблицата с обхватите го изписва - 0 "dBV" real 0 dBFS or -9 dBV - защото входният обхват на QA е референция в dBFS от връх до връх през диференциалната двойка, чиято истинска RMS пълна скала е с около 9 dB по-ниско. Изходните обхвати са истински dBV.
tip.31.title = Вашето калибриране може да ви последва до работния плот.
tip.31.body = Изберете сървърно устройство без калибриране, докато тази машина държи съответстваща калибрирана карта, и Phonalyser предлага да прехвърли стойностите - веднъж на сесия и никога мълчаливо. Откажете и нищо не се записва.
tip.32.title = QA403 работи на 384 kHz; QA402 - не.
tip.32.body = Списъкът с честоти следва реално свързания анализатор - регистърът за честота на дискретизация има четвърти код, който има само QA403. Заснемането и генераторът работят на избраната честота, защото двете посоки делят един хардуерен такт.
tip.33.title = QA40x може да задвижи преобразувател направо от предния си I2S порт.
tip.33.body = Включете порта в „Предпочитания за QA40x“ и списъкът с изходна разрядност предлага 16 и 32 бита на порта вместо 24-те на анализатора, а входът остава на 24 през цялото време. Функцията е експериментална: QuantAsylum документира конектора, но не и регистрите, които го включват.
tip.34.title = Дългият свип вече не трябва да се изчаква докрай.
tip.34.body = Прозорецът за напредък на честотния отклик носи бутон „Отказ“. Той действа съгласувано - свипът приключва по обичайния път на спиране, така че прозорецът се затваря и панелът се отключва точно както след завършено измерване, а заснемането и генераторът се връщат.
tip.35.title = Гладко изглеждащ честотен отклик пак може да е клипнат.
tip.35.body = Ако заснемането е достигнало пълната скала, получавате предупреждение веднага щом се появи трасето. Деконволюцията превръща запис, опрял в границата, във фина равномерна вълничка, която прилича повече на шум, отколкото на повреда - затова намалете нивото на задвижване, вместо да се доверявате на кривата.
tip.36.title = Всеки честотен отклик на екрана може да бъде записан.
tip.36.body = Разделът „Запиши в...“ записва показаната крива във файл без каквато и да е проверка за качество - свип, който току-що сте направили, свип, задвижен съвсем леко, или крива, заредена обратно от диска. Единственото условие е изобщо да има измерване.
tip.37.title = Включете карта, без да рестартирате приложението.
tip.37.body = „Търсене на устройства“ в Настройки → Аудио изброява наново списъка с устройства на браузъра, съставя наново списъка с бекендове - само така включен след стартирането QA40x изобщо се появява като бекенд - и пита отново свързания работен плот за неговите бекендове.
tip.38.title = Настройките ви казват, когато волтовете ви са догадки.
tip.38.body = Затварянето на раздела Аудио след смяна на бекенд или устройство проверява дали приетият избор наистина води до измерена пълна скала и назовава входа, изхода или и двете, когато не е така. Карта, свързана с устройството, но съдържаща нули, се брои за некалибрирана - празният ред не е измерване.
tip.39.title = Мъртъв вход го казва, вместо да чертае права линия.
tip.39.body = Извадете картата или оставете друго приложение да я вземе изключително, и осцилоскопът и FFT спират с един диалог, който назовава бекенда и казва дали устройството е изгубено, или просто е спряло да доставя отчети. Страната на възпроизвеждане се следи по същия начин.
tip.40.title = Съхранена настройка, която не се разчита, никога не се презаписва.
tip.40.body = Вашите настройки и карти живеят в локалното хранилище на браузъра, а не във файлове. Стойност, която не се разчита, се копира настрани под същия ключ с наставка .corrupt, а работата започва от стойностите по подразбиране, така че всяка калибрация в нея оцелява за възстановяване, вместо да бъде зазидана от следващото записване.

