help.index.rebuild.title = Преизграждане на търсещия индекс на помощта
help.index.rebuild.done = Търсещият индекс е преизграден: {0} страници, {1} теми, {2} термина.\nЗаписани са search-index.js и help-index.html.
help.index.rebuild.notHelpDir = Тази папка не съдържа index.html - изберете папката, в която са помощните страници.
help.index.rebuild.failed = Търсещият индекс не можа да бъде преизграден:\n{0}
