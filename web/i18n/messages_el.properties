tip.count = 41
tip.1.title = Η σύμφωνη μέση τιμή σκάβει πολύ κάτω από το επίπεδο θορύβου.
tip.1.body = Αφήστε ενεργή τη σύμφωνη (μιγαδική) μέση τιμή και αφήστε την FFT να τρέχει - ο τόνος αθροίζεται ενώ ο θόρυβος εν μέρει αλληλοαναιρείται, οπότε το επίπεδο συνεχίζει να πέφτει όσο περιμένετε.
tip.2.title = Κουμπώστε τη γεννήτρια σε μια θυρίδα FFT για καθαρό φάσμα.
tip.2.body = Με ενεργό το "Κούμπωμα συχνότητας στην πλησιέστερη", ο τόνος προσγειώνεται ακριβώς σε μια θυρίδα, οπότε η διαρροή δεν θολώνει τη θεμελιώδη και οι εκτιμήσεις αρμονικών παραμένουν ειλικρινείς.
tip.3.title = Καρφιτσώστε τη θεμελιώδη με το χέρι σε ένα φίλτρο εγκοπής twin-T.
tip.3.body = Ένα παθητικό μηδενικό twin-T είναι τόσο απότομο που λίγα δέκατα του χερτζ θερμικής ολίσθησης ταλαντεύουν την απο-ενσωματωμένη θεμελιώδη. Εισαγάγετε τη στάθμη που πραγματικά γνωρίζετε με τη "Χειροκίνητη θεμελιώδη"· οι αρμονικές, στην ήπια πλευρά, απο-ενσωματώνονται μια χαρά.
tip.4.title = Στο πρόγραμμα περιήγησης μόνο το QA40x είναι ακριβές ως το bit.
tip.4.body = Μια σελίδα δεν έχει αποκλειστική λειτουργία: η λήψη μέσω Web Audio φτάνει σε αυτήν ως float32 μετά τον κοινόχρηστο μείκτη των Windows, οπότε ό,τι έκανε εκείνος ο μείκτης βρίσκεται ήδη μέσα στα δείγματα. Το QA40x είναι η εξαίρεση - παρακάμπτει τον μείκτη επειδή δεν είναι καν κάρτα ήχου, και διαβάζεται απευθείας μέσω WebUSB.
tip.5.title = Δεν υπάρχει backend να επιλέξετε για ταχύτερο παλμογράφο.
tip.5.body = Τον ρυθμό ανανέωσης του παλμογράφου τον ορίζουν η επανάκληση του Web Audio και η διαδρομή σχεδίασης, όχι κάποιος οδηγός που μπορείτε να επιλέξετε. Αυτό που μπορείτε να ανεβάσετε είναι ο ίδιος ο ρυθμός δειγματοληψίας της λήψης, και αυτός ρυθμίζεται στα Windows πάνω στη συσκευή και όχι σε αυτήν την εφαρμογή - δείτε "Συσκευή εισόδου των Windows" στο εγχειρίδιο.
tip.6.title = Η ροδέλα του ποντικιού μεγεθύνει γύρω από τον δρομέα.
tip.6.body = Σε οποιαδήποτε προβολή ίχνους: η ροδέλα μετακινεί κατακόρυφα, Shift+ροδέλα οριζόντια, Ctrl+ροδέλα μεγεθύνει τον κατακόρυφο άξονα και Ctrl+Shift+ροδέλα τον οριζόντιο - και οι δύο μεγεθύνσεις κρατούν σταθερή την τιμή κάτω από τον δείκτη.
tip.7.title = Κάθε αριθμητικό πεδίο δέχεται μονάδες, τη ροδέλα και το πληκτρολόγιο.
tip.7.body = Πληκτρολογήστε μια τιμή με τη μονάδα της (µV, 1.5 V, -3 dBV, 2 kHz), κυλήστε τη ροδέλα, κάντε κλικ στα βέλη πάνω/κάτω ή πατήστε τα πλήκτρα πάνω/κάτω για βηματισμό.
tip.8.title = Η παρεμβολή sinc έχει σημασία μόνο όταν είστε σε μεγέθυνση.
tip.8.body = Ο διακόπτης Sin/Lin αλλάζει το ίχνος μόνο όταν τα σημεία δειγματοληψίας απέχουν λίγα pixel στην οθόνη· διαφορετικά οι ευθείες γραμμές φαίνονται πανομοιότυπες και κοστίζουν λιγότερο σε CPU. Ενεργοποιήστε τον μόλις γίνουν ορατά τα μεμονωμένα δείγματα.
tip.9.title = Η υστέρηση σταθεροποιεί τη σκανδάλη σε ένα ασθενές, θορυβώδες σήμα.
tip.9.body = Χωρίς αυτήν, ο θόρυβος γύρω από τη στάθμη σκανδαλισμού πυροδοτεί έναν καταιγισμό ψευδών σκανδαλισμών και το ίχνος τρεμοπαίζει. Ενεργοποιήστε την υστέρηση σκανδάλης και το ίχνος κλειδώνει.
tip.10.title = Ένα αποθηκευμένο σήμα γεννήτριας είναι μια τέλεια αναφορά.
tip.10.body = Το "Αποθήκευση σε..." γράφει την ιδανική, μαθηματικά ακριβή κυματομορφή - χωρίς παραμόρφωση από DAC, ενισχυτή ή καλωδίωση. Τροφοδοτήστε το σε άλλο όργανο και κάθε ατέλεια που μετράτε ανήκει σε εκείνη τη συσκευή, όχι στην πηγή.
tip.11.title = Απο-ενσωματώστε μια διάταξη με ένα αρχείο βαθμονόμησης.
tip.11.body = Μετρήστε μια εγκοπή, έναν εξασθενητή ή την απόκριση μιας κάρτας ήχου μία φορά στο άρθρωμα Απόκρισης συχνότητας, μετά φορτώστε εκείνο το .frc στον αναλυτή FFT: η απόκρισή του διαιρείται κατά την εμφάνιση, οπότε ο πίνακας δείχνει τη συσκευή υπό δοκιμή.
tip.12.title = Η επικάλυψη ανακατασκευασμένου διακροτήματος δαμάζει ένα κοντινό ζεύγος δύο τόνων.
tip.12.body = Στη λειτουργία διπλού τόνου, η επικάλυψη "Ανακατασκευασμένο διακρότημα" του παλμογράφου σχεδιάζει την αργή περιβάλλουσα |f1 - f2|, ώστε να σκανδαλίζετε στο διακρότημα αντί να κυνηγάτε τις γρήγορες διελεύσεις του φέροντος.
tip.13.title = Η σάρωση απόκρισης συχνότητας είναι η δική της αναφορά.
tip.13.body = Η σαρωμένη μέτρηση αποσυνελίσσεται έναντι της ακριβούς σάρωσης που αναπαράχθηκε - όχι ενός εκ νέου μετρημένου αντιγράφου - οπότε το ανακτημένο μέτρο και η φάση είναι η αληθινή συνάρτηση μεταφοράς της συσκευής.
tip.14.title = Το Ctrl+F1 πηγαίνει κατευθείαν στη σωστή βοήθεια.
tip.14.body = Πατήστε F1 οπουδήποτε για το εγχειρίδιο, ή Ctrl+F1 για να ανοίξετε τη βοήθεια στην ακριβή ενότητα του στοιχείου ελέγχου που έχει αυτήν τη στιγμή την εστίαση.
tip.15.title = Η προβολή υπολοίπου δείχνει ό,τι κρύβεται κάτω από τη θεμελιώδη.
tip.15.body = Γυρίστε ένα κανάλι σε "Υπόλοιπο" και ο παλμογράφος σχεδιάζει το σήμα που λήφθηκε μείον τον βέλτιστα προσαρμοσμένο τόνο του - παραμόρφωση, θόρυβος και σφάλματα θαμμένα κάτω από τη θεμελιώδη γίνονται ορατά. Λειτουργεί και ο διπλός τόνος: και οι δύο συχνότητες μετριούνται από την ίδια τη λήψη, οπότε τα ελεύθερα ρολόγια των DAC και ADC δεν μπορούν να θολώσουν την αφαίρεση.
tip.16.title = Επιθέστε ένα ιδανικό φίλτρο πάνω σε μια μετρημένη απόκριση.
tip.16.body = Η καρτέλα Φίλτρα του αρθρώματος Απόκρισης συχνότητας αγκυρώνει ένα ιδανικό βαθυπερατό, υψιπερατό, ζωνοπερατό φίλτρο ή φίλτρο εγκοπής (Butterworth, Chebyshev, αντίστροφο Chebyshev, ελλειπτικό, Bessel) στη μετρημένη καμπύλη, και η Σύγκριση σχεδιάζει την απόκλιση από αυτό - με τον ίδιο τρόπο όπως έναντι της RIAA.
tip.17.title = Αφήστε την ένδειξη Ανομοιομορφίας να κρίνει την επιπεδότητα για εσάς.
tip.17.body = Στην καρτέλα Ανομοιομορφία, βρείτε τα άκρα της ζώνης όπου η απόκριση εγκαταλείπει για πρώτη φορά έναν διάδρομο ±X dB από την κορυφή της (ή από το ελάχιστό της για μια εγκοπή), ή διαβάστε την απόκλιση ± σε ένα επιλεγμένο εύρος - σημειωμένα απευθείας πάνω στο γράφημα, με τους αριθμούς σχεδιασμένους ως επικαλυπτόμενο πίνακα πάνω στην καμπύλη.
tip.18.title = Η βαθμονόμηση πλήρους κλίμακας ανήκει στην κάρτα ήχου.
tip.18.body = Κάθε κάρτα κρατά το δικό της προφίλ: μία γραμμή ανά εξασθενητή ή περιοχή DIP, χωριστές τιμές για αριστερά / δεξιά, ταιριασμένες με το όνομα της συσκευής σε κάθε backend - έτσι η αλλαγή συσκευών ή backend δεν μπερδεύει ποτέ τις βαθμονομήσεις. Οι γνωστές κάρτες προσφέρονται προρυθμισμένες· η δική σας βαθμονόμηση με το σταυρόνημα τις εκλεπτύνει.
tip.19.title = Οδηγήστε μόνο το κανάλι που μετράτε.
tip.19.body = Η γεννήτρια, η σάρωση απόκρισης συχνότητας και ο συντονισμός εγκοπής έχουν το καθένα έναν επιλογέα Κανάλι εξόδου - Και τα δύο, μόνο Αριστερά ή μόνο Δεξιά - που ανοιγοκλείνει ζωντανά την οδηγούμενη γραμμή. Βολικό για ελέγχους συνακρόασης μεταξύ καναλιών και για συσκευές με μία είσοδο.
tip.20.title = Με μεγάλη σμίκρυνση, ο παλμογράφος αποδίδει σαν πραγματικό DSO.
tip.20.body = Πάνω από ένα δείγμα ανά pixel το ίχνος γίνεται εικόνα ψηφιακού φωσφόρου: το ιστόγραμμα παραμονής κάθε στήλης, σαρωμένο με πένα στο ρυθμισμένο πλάτος ίχνους - στενοί παλμοί και περιβάλλουσες διακροτήματος διατηρούν το πραγματικό τους πλάτος από κορυφή σε κορυφή σε οποιαδήποτε μεγέθυνση, και η φωτεινότητα δείχνει πού παραμένει το σήμα.
tip.21.title = Λήψεις με σφάλματα δεν δηλητηριάζουν ποτέ μια μακρά μέση τιμή.
tip.21.body = Η FFT απορρίπτει τα μπλοκ που περιέχουν συρραφές, διακοπές ή σφάλματα που παραβιάζουν το όριο ζώνης πριν μπουν στη μέση τιμή, έπειτα επανασυγχρονίζεται και συνεχίζει να υπολογίζει τον μέσο όρο. Για ένα μικρό ή μη ημιτονοειδές σήμα που πυροδοτεί την πύλη σε κάθε μπλοκ, αποεπιλέξτε την "Ανίχνευση χρονικής ασυνέχειας" στην καρτέλα ρυθμίσεων της FFT.
tip.22.title = Το SNR και το ENOB παραμένουν ειλικρινή ακόμη και με έναν ευρύ ή θορυβώδη τόνο.
tip.22.body = Οι τιμές θορύβου εξαιρούν όχι μόνο τη θεμελιώδη και τις αρμονικές της, αλλά ολόκληρη τη διαρροή της και την παρυφή φασικού θορύβου της - η εξαιρούμενη ζώνη διευρύνεται ώστε να ακολουθεί έναν ευρύ ή ασταθή τόνο μέχρι το επίπεδο θορύβου, οπότε μια πλατιά παρυφή δεν διογκώνει ποτέ το SNR ή το ENOB.
tip.23.title = Παραλείψτε τη μονάδα - σκέτα ψηφία σημαίνουν τη βασική μονάδα.
tip.23.body = Πληκτρολογήστε μόνο έναν αριθμό και το πεδίο τον δέχεται στη βασική του μονάδα - το 1000 σε ένα πεδίο συχνότητας είναι 1000 Hz, σε ένα πεδίο πλάτους 1000 V, σε ένα πεδίο χρόνου 1000 s. Το κιλοχέρτζ έχει και σύντομες μορφές: 1.5k, 1.5kh και 1.5khz σημαίνουν όλα 1.5 kHz.
tip.24.title = Σύρετε ένα ορθογώνιο για να μεγεθύνετε ακριβώς εκείνη την περιοχή.
tip.24.body = Στις προβολές παλμογράφου, FFT και απόκρισης συχνότητας, σύρετε με το αριστερό κουμπί για να περικλείσετε την περιοχή που σας ενδιαφέρει - μόλις την αφήσετε, γεμίζει την προβολή. Το Ctrl+Z σας πάει πίσω στις τελευταίες 32 μεγεθύνσεις της προβολής κάτω από τον δείκτη.
tip.25.title = Ρυθμίστε το dither σε dBV και διαβάστε το κατευθείαν από το επίπεδο θορύβου της FFT.
tip.25.body = Το πεδίο dither της γεννήτριας δέχεται bits ή μια στάθμη dBV, και το dBV περιλαμβάνει ήδη το εύρος ζώνης θορύβου του παραθύρου FFT - έτσι, με ασύμφωνη μέση τιμή (ισχύος) το επίπεδο θορύβου της FFT καταλήγει ακριβώς εκεί που το ορίζετε: πληκτρολογήστε −100 dBV και το επίπεδο κάθεται στα −100 dBV. Η σύμφωνη μέση τιμή αναιρεί τον θόρυβο και δείχνει πολύ χαμηλότερα.
tip.26.title = Το υλικό δεν χρειάζεται να βρίσκεται στο γραφείο σας.
tip.26.body = Τρέξτε το Phonalyser ως διακομιστή στο μηχάνημα όπου είναι καλωδιωμένοι οι μετατροπείς σας και μετά πατήστε "Διακομιστές..." στις Προτιμήσεις → Ήχος. Ο πίνακας ανοίγει άδειος: γράψτε μία φορά τον υπολογιστή και τη θύρα εκείνου του πάγκου (8377 από προεπιλογή) κάτω από το "Προσθήκη διακομιστή με διεύθυνση" και ο δικός του πίνακας γνωστών διακομιστών συμπληρώνει τα υπόλοιπα. Τα backend του προστίθενται τότε στη λίστα backend, και οι συσκευές, οι κάρτες, η βαθμονόμηση, η γεννήτρια και οι σαρώσεις λειτουργούν όλα σαν να ήταν η κάρτα συνδεδεμένη εδώ.
tip.27.title = Μια συσκευή πάγκου στην οποία μετρά ήδη κάποιος άλλος το δηλώνει.
tip.27.body = Κάθε συσκευή ενός διακομιστή κλειδώνεται σε έναν πελάτη κάθε φορά, και μια συσκευή που κρατά άλλος χειριστής δείχνει "σε χρήση από" και το όνομα εκείνου του πελάτη μέσα στη λίστα συσκευών - έτσι το μαθαίνετε πριν πατήσετε "Εγγραφή", όχι μετά.
tip.28.title = Διαβάστε τις αρμονικές κατευθείαν από τον άξονα με dBr.
tip.28.body = Αλλάξτε τη μονάδα μέτρου της FFT σε dBr και η θεμελιώδης κάθεται ακριβώς στο 0, οπότε κάθε αρμονική και κάθε παρασιτική συνιστώσα διαβάζεται απευθείας ως "τόσα dB κάτω από τον τόνο". Η αναφορά είναι η εμφανιζόμενη θεμελιώδης και ξαναδιαβάζεται σε κάθε επανασχεδίαση, οπότε ακολουθεί και μια στάθμη που ολισθαίνει.
tip.29.title = Πληκτρολογήστε στάθμη εξόδου σε dBFS όταν εννοείτε πλήρη κλίμακα.
tip.29.body = Η γεννήτρια, η σάρωση απόκρισης συχνότητας και ο οδηγός συντονισμού εγκοπής δέχονται όλα πλάτος σε dBFS - κατάληξη dbfs ή το σύντομο dbf - και συνεχίζουν να το εμφανίζουν σε αυτή τη μονάδα. Τα 0 dBFS είναι ημίτονο πλήρους κλίμακας, οπότε ο αριθμός δεν αλλάζει νόημα όταν αλλάζετε κυματομορφή.
tip.30.title = Το ιστόγραμμα πλάτους ξεχωρίζει τον ψαλιδισμό από τον θόρυβο με μια ματιά.
tip.30.body = Ανοίξτε το από τη γραμμή εργαλείων του παλμογράφου: ένα ημίτονο σχεδιάζει τη μπανιέρα των δύο σημείων καμπής του, ο ευρυζωνικός θόρυβος μια καμπάνα Gauss και ένα ψαλιδισμένο σήμα μια σκληρή αιχμή εκεί όπου βρίσκεται το όριο. Μια κυματομορφή ψαλιδισμένη μόνο από τη μία πλευρά φαίνεται ως άνισες ράβδοι γύρω από την κεντρική γραμμή.
tip.31.title = Μια περιοχή εισόδου "0 dBV" του QA40x δεν είναι 0 dBV RMS.
tip.31.body = Ο πίνακας περιοχών το γράφει καθαρά - 0 "dBV" real 0 dBFS or -9 dBV - επειδή μια περιοχή εισόδου QA είναι αναφορά dBFS από κορυφή σε κορυφή στο διαφορικό ζεύγος, της οποίας η πραγματική RMS πλήρης κλίμακα βρίσκεται περίπου 9 dB χαμηλότερα. Οι περιοχές εξόδου είναι γνήσια dBV.
tip.32.title = Η βαθμονόμησή σας μπορεί να σας ακολουθήσει στον πάγκο.
tip.32.body = Επιλέξτε μια συσκευή διακομιστή χωρίς βαθμονόμηση ενώ αυτό το μηχάνημα κρατά μια αντίστοιχη βαθμονομημένη κάρτα και το Phonalyser προσφέρεται να αντιγράψει τις τιμές - μία φορά ανά συνεδρία και ποτέ σιωπηλά. Πείτε όχι και δεν γράφεται τίποτα.
tip.33.title = Ένα QA403 τρέχει στα 384 kHz· ένα QA402 όχι.
tip.33.body = Η λίστα ρυθμών ακολουθεί τον αναλυτή που είναι πραγματικά συνδεδεμένος - ο καταχωρητής ρυθμού δειγματοληψίας έχει έναν τέταρτο κωδικό που τον έχει μόνο το QA403. Η λήψη και η γεννήτρια τρέχουν και οι δύο στον ρυθμό που θα επιλέξετε, επειδή οι δύο κατευθύνσεις μοιράζονται ένα ρολόι υλικού.
tip.34.title = Το QA40x μπορεί να οδηγήσει έναν μετατροπέα απευθείας από τη θύρα I2S της πρόσοψής του.
tip.34.body = Ενεργοποιήστε τη θύρα στις "Προτιμήσεις QA40x" και η λίστα βάθους bit εξόδου προσφέρει τα 16 και 32 bit της θύρας στη θέση των 24 του αναλυτή, ενώ η είσοδος μένει στα 24 σε όλη τη διαδρομή. Είναι πειραματικό: η QuantAsylum τεκμηριώνει τον σύνδεσμο, αλλά όχι τους καταχωρητές που τον ενεργοποιούν.
tip.35.title = Μια μακρά σάρωση δεν χρειάζεται πια να την περιμένετε ως το τέλος.
tip.35.body = Το παράθυρο προόδου της απόκρισης συχνότητας έχει κουμπί "Άκυρο". Λειτουργεί συνεργατικά - η σάρωση τερματίζει από τη συνηθισμένη διαδρομή διακοπής, οπότε το παράθυρο κλείνει και το φύλλο ξεκλειδώνει ακριβώς όπως μετά από ολοκληρωμένη εκτέλεση, με τη λήψη και τη γεννήτρια να επιστρέφονται.
tip.36.title = Μια απόκριση συχνότητας που φαίνεται ομαλή μπορεί κάλλιστα να είναι ψαλιδισμένη.
tip.36.body = Αν η λήψη έφτασε στην πλήρη κλίμακα, προειδοποιείστε μόλις εμφανιστεί το ίχνος. Η αποσυνέλιξη μετατρέπει μια ηχογράφηση που κόλλησε στο όριο σε έναν λεπτό κανονικό κυματισμό που μοιάζει με θόρυβο και όχι με βλάβη, γι' αυτό χαμηλώστε τη στάθμη οδήγησης αντί να εμπιστευτείτε την καμπύλη.
tip.37.title = Κάθε απόκριση συχνότητας στην οθόνη μπορεί να αποθηκευτεί.
tip.37.body = Η καρτέλα "Αποθήκευση σε..." γράφει την εμφανιζόμενη καμπύλη σε αρχείο χωρίς κανενός είδους έλεγχο ποιότητας - μια σάρωση που μόλις εκτελέσατε, μια οδηγημένη πολύ ήπια ή μια που φορτώθηκε ξανά από τον δίσκο. Το μόνο που ζητά είναι να υπάρχει έστω μια μέτρηση.
tip.38.title = Συνδέστε μια κάρτα χωρίς να επανεκκινήσετε την εφαρμογή.
tip.38.body = Η "Αναζήτηση συσκευών" στις Προτιμήσεις → Ήχος απαριθμεί ξανά τη λίστα συσκευών του προγράμματος περιήγησης, συνθέτει εκ νέου τη λίστα backend - μόνο έτσι εμφανίζεται καν ως backend ένα QA40x που συνδέθηκε μετά την εκκίνηση - και ζητά ξανά από έναν συνδεδεμένο πάγκο τα δικά του backend.
tip.39.title = Οι Προτιμήσεις σας λένε πότε τα βολτ σας είναι εικασίες.
tip.39.body = Το κλείσιμο της καρτέλας Ήχος μετά από αλλαγή backend ή συσκευής ελέγχει ότι η επιλογή που καταχωρήθηκε οδηγεί πράγματι σε μετρημένη πλήρη κλίμακα και κατονομάζει την είσοδο, την έξοδο ή και τα δύο όταν δεν οδηγεί. Μια κάρτα δεμένη με τη συσκευή αλλά γεμάτη μηδενικά μετρά ως αβαθμονόμητη - μια άδεια γραμμή δεν είναι μέτρηση.
tip.40.title = Μια νεκρή είσοδος το λέει αντί να σχεδιάζει ίσια γραμμή.
tip.40.body = Αποσυνδέστε την κάρτα ή αφήστε μια άλλη εφαρμογή να την πάρει αποκλειστικά, και ο παλμογράφος και η FFT σταματούν με έναν μοναδικό διάλογο που κατονομάζει το backend και λέει αν η συσκευή χάθηκε ή απλώς σταμάτησε να παραδίδει δείγματα. Η πλευρά της αναπαραγωγής παρακολουθείται με τον ίδιο τρόπο.
tip.41.title = Μια αποθηκευμένη ρύθμιση που δεν διαβάζεται δεν αντικαθίσταται ποτέ.
tip.41.body = Οι ρυθμίσεις και οι κάρτες σας ζουν στον τοπικό χώρο αποθήκευσης του προγράμματος περιήγησης, όχι σε αρχεία. Μια τιμή που δεν διαβάζεται αντιγράφεται στο πλάι με το ίδιο κλειδί και την κατάληξη .corrupt και η εκτέλεση ξεκινά από τις προεπιλογές, ώστε κάθε βαθμονόμηση μέσα της να επιβιώνει για ανάκτηση αντί να τσιμεντώνεται από την επόμενη αποθήκευση.

