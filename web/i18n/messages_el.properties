# ---- Frequency response
preferences.freqResp.lineWidth = Πάχος γραμμής ίχνους, px:
preferences.freqResp.lineWidth.tooltip = Πάχος γραμμής ίχνους απόκρισης συχνότητας σε pixel (καμπύλες μέτρου, φάσης, αναφοράς RIAA και σύγκρισης)
preferences.freqResp.maxFreqPctNyquist = Μέγιστη αναλυόμενη συχνότητα, % Nyquist
preferences.freqResp.maxFreqPctNyquist.tooltip = Περιορίζει το άνω όριο της προβολής FreqResp σε αυτό το κλάσμα του Nyquist (sampleRate / 2).  96-100 %.  100 % = αυστηρό Nyquist· χαμηλότερες τιμές περικόπτουν τη ζώνη όπου η ενέργεια του πυρήνα αποσυνέλιξης μειώνεται.
preferences.freqResp.compareSmoothWindow = Παράθυρο εξομάλυνσης σύγκρισης, 1/N οκτάβα
preferences.freqResp.compareSmoothWindow.tooltip = Πλάτος του φίλτρου κινητού μέσου όρου που εφαρμόζεται στην καμπύλη λειτουργίας σύγκρισης (μετρημένη − αναφορά), εκφρασμένο σε μονάδες 1/N οκτάβας.  N = 0 απενεργοποιεί την εξομάλυνση.  Μικρότερο N = ευρύτερο παράθυρο = περισσότερη εξομάλυνση (N=3 ≈ 1/3 οκτάβας, ευρύ), μεγαλύτερο N = στενότερο = ελαφρύτερο (N=24 ≈ 1/24 οκτάβας, πρότυπο ήχου).
preferences.freqResp.notch.enable = Να επιτρέπεται φίλτρο εγκοπής για βιομηχανικό θόρυβο
preferences.freqResp.notch.enable.tooltip = Όταν είναι ενεργό, η προβολή FreqResp παρεμβάλλει κατά μήκος κάθε αρμονικής της επιλεγμένης συχνότητας δικτύου (50/60 Hz) - αφαιρεί τις αιχμές βόμβου δικτύου από την εμφανιζόμενη απόκριση χωρίς εκ νέου μέτρηση.
preferences.freqResp.notch.baseHz = Βιομηχανική συχνότητα
preferences.freqResp.notch.baseHz.tooltip = Βασική συχνότητα της οποίας οι αρμονικές (50, 100, 150, ... Hz ή 60, 120, 180, ...) αφαιρούνται με εγκοπή όταν το παραπάνω πλαίσιο είναι ενεργό.
preferences.freqResp.signalColor = Χρώμα σήματος
preferences.freqResp.phaseColor = Χρώμα φάσης
preferences.freqResp.referenceColor = Χρώμα αναφοράς (RIAA)
preferences.freqResp.backgroundColor = Χρώμα φόντου γραφήματος
preferences.scope.histogramBins = Θυρίδες ιστογράμματος

