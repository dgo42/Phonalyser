# ===== TIP OF THE DAY =====

tip.dialog.heading = Leid an lae
tip.dialog.dontShowAgain = Ná taispeáin arís
tip.dialog.next = An chéad leid eile
tip.dialog.close = Dún
tip.dialog.closeCountdown = Dún ({0}s)
tip.count = 41
tip.1.title = Tochlaíonn an meánú comhleanúnach i bhfad faoin urlár torainn.
tip.1.body = Fág an meánú comhleanúnach (coimpléascach) air agus lig don FFT rith - suimíonn an ton suas agus an torann ag cealú go páirteach, mar sin leanann an t-urlár ag titim a fhad is a fhanann tú.
tip.2.title = Léim an gineadóir go binn FFT le haghaidh speictrim ghlain.
tip.2.body = Le "Léim an mhinicíocht go dtí an ceann is gaire" air, tuirlingíonn an ton go díreach ar bhinn, mar sin ní smearann sceitheadh an bhuntonadh agus fanann meastacháin na harmonach ionraic.
tip.3.title = Greamaigh an buntonadh de láimh ar mhaolaire twin-T.
tip.3.body = Tá maolaire twin-T éighníomhach chomh géar sin go n-aistríonn cúpla deichiú heirts d'fhuaradh teirmeach an buntonadh dí-leabaithe. Cuir isteach an leibhéal a bhfuil aithne agat air le "Buntonadh láimhe"; dí-leabaíonn na harmonaigh, ar an leiceann réidh, go breá.
tip.4.title = Níl ach an QA40x beacht-ghiotach i mbrabhsálaí.
tip.4.body = Níl mód eisiach ag leathanach: sroicheann gabháil Web Audio é mar float32 tar éis meascthóir roinnte Windows, mar sin tá cibé rud a rinne an meascthóir sin sna samplaí cheana féin. Is é an QA40x an eisceacht - seachnaíonn sé an meascthóir toisc nach cárta fuaime é ar chor ar bith, agus léitear go díreach thar WebUSB é.
tip.5.title = Níl aon inneall cúil le roghnú chun scóp níos tapúla a fháil.
tip.5.body = Is é aisghlaoch Web Audio agus an cosán rindreála a shocraíonn ráta athnuachana an oscilloscóip, ní tiománaí ar féidir leat a roghnú. Is é an rud is féidir leat a ardú ná an ráta gabhála féin, agus socraítear é sin i Windows ar an ngléas seachas san fheidhmchlár seo - féach "Gléas ionchuir Windows" sa lámhleabhar.
tip.6.title = Súmálann roth na luiche timpeall an chúrsóra.
tip.6.body = In aon amharc rianta: bogann an roth go hingearach, Shift+roth go cothrománach, Ctrl+roth súmálann an t-ais ingearach agus Ctrl+Shift+roth an ceann cothrománach - coinníonn an dá shúmáil an luach faoin bpointeoir socair.
tip.7.title = Glacann gach réimse uimhriúil aonaid, an roth, agus an méarchlár.
tip.7.body = Clóscríobh luach lena aonad (µV, 1.5 V, -3 dBV, 2 kHz), scrollaigh an roth, cliceáil na saigheada suas/síos, nó brúigh eochracha suas/síos an mhéarchláir le céimniú.
tip.8.title = Ní bhíonn idirshuíomh sinc tábhachtach ach amháin nuair atá tú súmáilte isteach.
tip.8.body = Athraíonn an lasc Sin/Lin an rian ach amháin nuair atá pointí samplála cúpla picteilín óna chéile ar an scáileán; murab amhlaidh tá línte díreacha mar an gcéanna agus costas níos lú LAP. Cuir air é nuair atá samplaí aonair le feiceáil.
tip.9.title = Cobhsaíonn histéiréis an truicear ar chomhartha lag torannach.
tip.9.body = Gan é, scaoileann torann timpeall leibhéal an truicir raidhse truicear bréagacha agus crathann an rian. Cumasaigh histéiréis truicir agus glasálann an rian.
tip.10.title = Is tagairt fhoirfe é comhartha gineadóra sábháilte.
tip.10.body = Scríobhann "Sábháil go..." an tonnchruth idéalach atá beacht ó thaobh na matamaitice - gan saobhadh DAC, aimplitheoir nó cáblaithe. Cuir chuig ionstraim eile é agus baineann aon neamhfhoirfeacht a thomhaiseann tú leis an ngléas sin, ní leis an bhfoinse.
tip.11.title = Dí-leabaigh feistis le comhad calabraithe.
tip.11.body = Tomhais freagairt maolaire, maolaitheora nó cárta fuaime uair amháin sa mhodúl Freagairt-mhinicíochta, ansin luchtaigh an .frc sin isteach san anailíseoir FFT: roinntear a fhreagairt amach ag am taispeána, mar sin taispeánann an tábla an gléas atá á thástáil.
tip.12.title = Ceansaíonn an forleagan buille atógtha péire dlúth dhá thon.
tip.12.body = I mód dhá thon tarraingíonn forleagan "Buille atógtha" an scóip an clúdach mall |f1 - f2|, mar sin is féidir leat truiceáil ar an mbuille in ionad a bheith ag tóraíocht na dtrasnuithe iompróra gasta.
tip.13.title = Is í freagairt-mhinicíochta an scuabtha a tagairt féin.
tip.13.body = Dí-chomhshúitear an tomhas scuabtha in aghaidh an scuabtha bheacht a seinneadh - ní cóip aththomhaiste - mar sin is é feidhm aistrithe fíor an ghléis an mhéid agus an phas a aisghabhtar.
tip.14.title = Léimeann Ctrl+F1 caol díreach chuig an gcabhair cheart.
tip.14.body = Brúigh F1 áit ar bith le haghaidh an lámhleabhair, nó Ctrl+F1 chun an chabhair a oscailt ag an gcuid bheacht don rialú a bhfuil fócas air faoi láthair.
tip.15.title = Taispeánann amharc an iarmhair a bhfuil i bhfolach faoin mbuntonadh.
tip.15.body = Athraigh cainéal go "Iarmhar" agus tarraingíonn an scóp an comhartha gafa lúide an ton is fearr a oireann dó - éiríonn saobhadh, torann agus spící atá curtha faoin mbuntonadh le feiceáil. Oibríonn dhá thon freisin: tomhaistear an dá mhinicíocht ón ngabháil féin, mar sin ní féidir le cloig DAC agus ADC atá ag rith saor an dealú a smearadh.
tip.16.title = Forleag scagaire idéalach ar fhreagairt thomhaiste.
tip.16.body = Ancaraíonn táb Maolairí an mhodúil Freagairt-mhinicíochta scagaire idéalach ísealphasach, ardphasach, bandphasach nó maolaire (Butterworth, Chebyshev, Chebyshev inbhéartach, éilipseach, Bessel) ar an gcuar tomhaiste, agus breacann Cuir i gcomparáid an diall uaidh - ar an gcaoi chéanna agus in aghaidh RIAA.
tip.17.title = Lig don léamh Míchothromaíocht an réidhe a mheas duit.
tip.17.body = Ar an táb Míchothromaíocht, aimsigh imill an bhanda mar a bhfágann an fhreagairt den chéad uair conair ±X dB óna buaic (nó óna híosmhéid i gcás maolaire), nó léigh an diall ± thar raon roghnaithe - anótáilte go díreach ar an mbreacadh, agus na figiúirí tarraingthe mar thábla forleagtha ar an gcuar.
tip.18.title = Baineann calabrú lánscála leis an gcárta fuaime.
tip.18.body = Coinníonn gach cárta a phróifíl féin: ró amháin do gach maolaitheoir nó raon DIP, luachanna clé / deas ar leith, meaitseáilte de réir ainm an ghléis ar gach inneall cúil - mar sin ní mheascann malartú gléasanna nó inneall cúil na calabruithe choíche. Tairgtear cártaí aitheanta réamhchumraithe; déanann do chalabrú crosribe iad a mhionchoigeartú.
tip.19.title = Ná tiomáin ach an cainéal atá á thomhas agat.
tip.19.body = Tá roghnóir Cainéal aschuir ag an ngineadóir, ag scuabadh na freagartha minicíochta agus ag tiúnadóir an mhaolaire araon - An dá cheann, Clé amháin, nó Deas amháin - a gheataíonn an lána tiomáinte beo. Áisiúil do sheiceálacha traschainte agus do ghléasanna aon ionchuir.
tip.20.title = Súmáilte i bhfad amach, tarraingíonn an scóp mar a dhéanfadh fíor-DSO.
tip.20.body = Os cionn sampla amháin in aghaidh an phicteilín éiríonn an rian ina íomhá fosfair dhigitigh: histeagram fanachta gach colúin, scuabtha le peann de leithead cumraithe an riain - coinníonn bíoga caola agus clúdaigh bhuille a mbuaic go buaic fíor ag súmáil ar bith, agus taispeánann an ghile cá bhfanann an comhartha.
tip.21.title = Ní nimhníonn gabhálacha lochtacha meán fada choíche.
tip.21.body = Diúltaíonn an FFT bloic ina bhfuil spladhsáil, titim amach nó spící a sháraíonn teorainn an bhanda sula dtéann siad isteach sa mheán, ansin athshioncrónaíonn sé agus leanann sé ag meánú. I gcás comhartha beag nó neamh-shíneasach a scaoileann an geata ar gach bloc, díthiceáil "Braith neamhleanúnachas ama" ar tháb socruithe an FFT.
tip.22.title = Fanann SNR agus ENOB ionraic faoi thon leathan nó torannach.
tip.22.body = Fágann na figiúirí torainn ar lár ní hamháin an buntonadh agus a harmonaigh ach a sciorta iomlán sceite agus torainn pais - leathnaíonn an banda eisiata chun ton leathan nó creathach a leanúint síos go dtí an t-urlár, mar sin ní chuireann sciorta leathan borradh choíche faoi SNR ná ENOB.
tip.23.title = Léim an t-aonad - ciallaíonn digití loma an bunaonad.
tip.23.body = Clóscríobh uimhir amháin agus glacann an réimse é ina bhunaonad - is 1000 Hz é 1000 i réimse minicíochta, 1000 V i réimse aimplitiúide, 1000 s i réimse ama. Tá foirmeacha gearra ag cileaheirts freisin: ciallaíonn 1.5k, 1.5kh agus 1.5khz uile 1.5 kHz.
tip.24.title = Tarraing dronuilleog chun súmáil isteach go beacht sa réigiún sin.
tip.24.body = Sna hamhairc oscilloscóp, FFT agus freagairt-mhinicíochta, tarraing leis an gcnaipe clé chun bosca rubair a tharraingt timpeall an limistéir a bhfuil suim agat ann - nuair a scaoiltear é líonann sé an t-amharc. Céimníonn Ctrl+Z siar tríd an 32 súmáil is déanaí den amharc atá faoin bpointeoir.
tip.25.title = Socraigh dither i dBV agus léigh díreach ó urlár an FFT é.
tip.25.body = Glacann réimse dither an ghineadóra le giotáin nó le leibhéal dBV, agus tá leithead banda torainn na fuinneoige FFT san áireamh cheana sa dBV - mar sin le meánú neamh-chomhleanúnach (cumhachta) tuirlingíonn urlár torainn an FFT díreach ag an leibhéal a shocraíonn tú: cuir isteach −100 dBV agus suíonn an t-urlár ag −100 dBV. Cealaíonn an meánú comhleanúnach an torann agus léann sé i bhfad níos ísle.
tip.26.title = Ní gá go mbeadh an crua-earra ar do dheasc féin.
tip.26.body = Rith Phonalyser mar fhreastalaí ar an ríomhaire a bhfuil do thiontairí sreangaithe leis, ansin brúigh Freastalaithe… i Sainroghanna → Fuaim. Osclaíonn an tábla folamh: clóscríobh óstríomhaire agus port an bhinse sin (8377 mar réamhshocrú) faoi "Cuir freastalaí leis de réir seolta" uair amháin, agus líonann a thábla piaraí féin an chuid eile isteach. Téann a chuid inneall cúil isteach i liosta na n-inneall cúil ansin, agus oibríonn gléasanna, cártaí, calabrú, an gineadóir agus na scuabtha díreach mar a bheadh an cárta plugáilte isteach anseo.
tip.27.title = Deir gléas binse a bhfuil duine eile ag tomhas air é sin leat.
tip.27.body = Tá gach gléas de chuid freastalaí faoi ghlas ag cliant amháin ag an am, agus taispeánann gléas atá i seilbh oibreora eile "in úsáid ag" mar aon le hainm an chliaint sin díreach i liosta na ngléasanna - mar sin faigheann tú amach é sula dtosaíonn tú an taifeadadh, ní ina dhiaidh.
tip.28.title = Léigh na harmonaigh caol díreach den ais le dBr.
tip.28.body = Athraigh aonad méide an FFT go dBr agus suíonn an buntonadh ag 0 go beacht, mar sin léitear gach harmonach agus gach spuaic go díreach mar "an oiread seo dB faoin ton". Is é an buntonadh taispeánta an tagairt agus athléitear é le gach athphéinteáil, mar sin leanann sé leibhéal atá ag sileadh.
tip.29.title = Clóscríobh leibhéal aschuir i dBFS nuair is lánscála atá i gceist agat.
tip.29.body = Glacann an gineadóir, scuabadh na freagartha minicíochta agus draoi tiúnta an mhaolaire uile le haimplitiúid i dBFS - an iarmhír dbfs, nó an ceann gearr dbf - agus coinníonn siad á taispeáint san aonad sin. Is síneas lánscála é 0 dBFS, mar sin ní athraíonn an figiúr a bhrí nuair a athraíonn tú an tonnchruth.
tip.30.title = Aithníonn an histeagram aimplitiúide bearradh ó thorann le súil amháin.
tip.30.body = Oscail ón mbarra uirlisí oscilloscóip é: tarraingíonn síneas folcadán a dhá phointe iompaithe, tarraingíonn torann leathanbhanda clog Gaussach, agus tarraingíonn comhartha bearrtha spuaic chrua san áit a bhfuil an ráille. Taispeántar tonnchruth atá bearrtha ar thaobh amháin mar bharraí neamhchothroma ar dhá thaobh na lárlíne.
tip.31.title = Ní hionann raon ionchuir "0 dBV" QA40x agus 0 dBV RMS.
tip.31.body = Deir tábla na raonta amach é - 0 "dBV" real 0 dBFS or -9 dBV - mar is tagairt dBFS buaic-go-buaic trasna an phéire dhifreálaigh atá i raon ionchuir QA, agus suíonn a fhíor-lánscála RMS thart ar 9 dB níos ísle. Is dBV fíor iad na raonta aschuir.
tip.32.title = Is féidir le do chalabrú tú a leanúint chuig an mbinse.
tip.32.body = Roghnaigh gléas freastalaí nach bhfuil calabrú air agus cárta calabraithe a mheaitseálann leis ar an ríomhaire seo, agus tairgeann Phonalyser na luachanna a chóipeáil anonn - uair amháin sa seisiún, agus riamh go ciúin. Abair níl agus ní scríobhtar aon rud.
tip.33.title = Ritheann QA403 ag 384 kHz; ní ritheann QA402.
tip.33.body = Leanann liosta na rátaí an t-anailíseoir atá ceangailte i ndáiríre - tá ceathrú cód ag an gclár ráta samplála nach bhfuil ach ag an QA403. Ritheann an ghabháil agus an gineadóir araon ag cibé ráta a roghnaíonn tú, mar roinneann an dá threo clog crua-earraí amháin.
tip.34.title = Is féidir leis an QA40x tiontaire a thiomáint caol díreach óna phort I2S ar an éadan.
tip.34.body = Cuir an port air faoi Sainroghanna QA40x agus tairgeann liosta doimhneacht giotán an aschuir 16 agus 32 giotán an phoirt in ionad 24 an anailíseora, agus an t-ionchur ag fanacht ag 24 ar fud na slí. Turgnamhach atá sé: doiciméadaíonn QuantAsylum an nascóir, ach ní na cláir a chumasaíonn é.
tip.35.title = Ní gá fanacht le scuabadh fada a chríochnú a thuilleadh.
tip.35.body = Tá cnaipe Cealaigh ar fhuinneog dul chun cinn na freagartha minicíochta. Tá sé comhoibríoch - críochnaíonn an scuabadh tríd an ngnáthchosán stoptha, mar sin dúnann an fhuinneog agus díghlasálann an pána díreach mar a tharlaíonn i ndiaidh rite iomláin, agus an ghabháil agus an gineadóir tugtha ar ais.
tip.36.title = Is féidir le freagairt mhinicíochta a bhfuil cuma mhín uirthi a bheith bearrtha fós.
tip.36.body = Má shroich an ghabháil lánscála tugtar rabhadh duit chomh luath is a thagann an rian ar an scáileán. Iompaíonn an dí-chomhshú taifeadadh atá i bhfostú ar an ráille ina chuilithín mín rialta a léitear mar thorann seachas mar dhamáiste, mar sin ísligh an leibhéal tiomána in ionad muinín a chur sa chuar.
tip.37.title = Is féidir aon fhreagairt mhinicíochta ar an scáileán a shábháil.
tip.37.body = Scríobhann an táb Sábháil go… an cuar atá ar taispeáint chuig comhad gan scagadh cáilíochta de chineál ar bith - scuabadh a rith tú díreach anois, ceann a tiomáineadh go bog nó ceann a luchtaíodh ar ais ón diosca. Níl uaidh ach go mbeadh tomhas ann ar chor ar bith.
tip.38.title = Plugáil cárta isteach gan an feidhmchlár a atosú.
tip.38.body = Áiríonn Scan gléasanna i Sainroghanna → Fuaim liosta gléasanna an bhrabhsálaí as an nua, cumann sé liosta na n-inneall cúil arís - sin mar a thagann QA40x a plugáiltear isteach i ndiaidh an tosaithe chun cinn mar inneall cúil ar chor ar bith - agus iarrann sé a chuid inneall cúil ar bhinse ceangailte athuair.
tip.39.title = Insíonn na Sainroghanna duit nuair is buillí faoi thuairim iad do voltanna.
tip.39.body = Nuair a dhúnann tú an táb Fuaim tar éis inneall cúil nó gléas a athrú, seiceáiltear go réitíonn an rogha ceadaithe le lánscála tomhaiste i ndáiríre, agus ainmnítear an t-ionchur, an t-aschur nó an dá cheann mura réitíonn. Áirítear cárta atá ceangailte leis an ngléas ach nach bhfuil ann ach nialais mar chárta neamhchalabraithe - ní tomhas é ró folamh.
tip.40.title = Deir ionchur marbh é sin in ionad líne chothrom a tharraingt.
tip.40.body = Bain an cárta amach, nó lig d'fheidhmchlár eile é a ghlacadh go heisiach, agus stopann an t-oscilloscóp agus an FFT le dialóg amháin a ainmníonn an t-inneall cúil agus a insíonn ar cailleadh an gléas nó ar stop sé ó bheith ag seachadadh samplaí. Déantar faireachán ar an taobh athsheinnte ar an mbealach céanna.
tip.41.title = Ní fhorscríobhtar socrú stóráilte nach féidir a pharsáil choíche.
tip.41.body = Tá do chuid socruithe agus do chártaí i stóras áitiúil an bhrabhsálaí, ní i gcomhaid. Cóipeáiltear luach nach féidir a pharsáil i leataobh chuig an eochair chéanna leis an iarmhír .corrupt agus tosaíonn an rith ó na réamhshocruithe, mar sin maireann gach calabrú atá ann le haisghabháil in ionad é a bheith curtha faoi stroighin ag an gcéad sábháil eile.

