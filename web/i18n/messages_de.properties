preferences.freqResp.maxFreqPctNyquist.tooltip = Begrenzt die Obergrenze der Frequenzgang-Ansicht auf diesen Bruchteil von Nyquist (sampleRate / 2).  96-100 %.  100 % = strenges Nyquist; niedrigere Werte beschneiden das Band, in dem die Energie des Entfaltungskerns abfällt.
preferences.freqResp.compareSmoothWindow = Vergleichs-Glättungsfenster, 1/N-Oktave
preferences.freqResp.compareSmoothWindow.tooltip = Breite des gleitenden Mittelwertfilters, das auf die Vergleichsmodus-(gemessen − Referenz-)Kurve angewendet wird, ausgedrückt in 1/N-Oktav-Einheiten.  N = 0 deaktiviert die Glättung.  Kleineres N = breiteres Fenster = mehr Glättung (N=3 ≈ 1/3-Oktave, breit), größeres N = schmaler = leichter (N=24 ≈ 1/24-Oktave, Standard-Audio).
preferences.freqResp.notch.enable = Notch-Filter für industrielles Rauschen erlauben
preferences.freqResp.notch.enable.tooltip = Wenn aktiviert, interpoliert die Frequenzgang-Ansicht über jede Oberwelle der gewählten Netzfrequenz (50/60 Hz) - entfernt Netzbrumm-Spitzen aus der angezeigten Antwort ohne Neumessung.
