preferences.freqResp.notch.baseHz.tooltip = Basisfrequenz, deren Oberwellen (50, 100, 150, ... Hz oder 60, 120, 180, ...) ausgenotcht werden, wenn das Kontrollkästchen oben aktiviert ist.
