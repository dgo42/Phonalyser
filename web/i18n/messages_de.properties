scope.right.residual.tooltip = Das Residuum des rechten Kanals statt seines Traces anzeigen: das erfasste Signal minus einem bestangepassten Einzelton (Frequenz aus der Frequenzanzeige des Oszilloskops, Amplitude und Phase über das angezeigte Fenster angepasst - phasengleich zum Trigger ausgerichtet). Verzerrung, Rauschen und Glitches, die unter der Grundwelle verborgen sind, werden sichtbar. Trigger und die Frequenz-/Periodenanzeigen folgen weiterhin dem erfassten Signal; Auto-Setup skaliert V/div auf die Vpp des Residuums.
