# ===== TIP OF THE DAY =====

tip.dialog.heading = Tipp des Tages
tip.dialog.dontShowAgain = Nicht mehr anzeigen
tip.dialog.next = Nächster Tipp
tip.dialog.close = Schließen
tip.dialog.closeCountdown = Schließen ({0}s)
tip.count = 40
tip.1.title = Kohärente Mittelung dringt weit unter den Grundrauschen vor.
tip.1.body = Lassen Sie die kohärente (komplexe) Mittelung eingeschaltet und die FFT weiterlaufen - der Ton summiert sich auf, während sich das Rauschen teilweise auslöscht, sodass der Grundrauschen umso weiter absinkt, je länger Sie warten.
tip.2.title = Rasten Sie den Generator auf eine FFT-Bin ein für ein sauberes Spektrum.
tip.2.body = Mit aktiviertem "Frequenz auf nächsten FFT-Bin runden" landet der Ton exakt auf einer Bin, sodass Leckeffekte die Grundwelle nicht verschmieren und die Oberwellen-Schätzungen ehrlich bleiben.
tip.3.title = Wenn ein Twin-T-Sperrfilter verwendet wird, geben Sie die Amplitude der Grundschwingung manuell ein.
tip.3.body = Eine passive Twin-T-Sperrfilter Kerbe ist so steil, dass schon ein paar Zehntel Hertz thermischer Drift der Grundwelle die entbettete Amplitude stark verändert. Geben Sie den Pegel, den Sie tatsächlich kennen, mit "Manuelle Grundwelle" ein; die Oberwellen auf der sanften Flanke entbetten sich problemlos.
tip.4.title = Im Browser ist nur der QA40x bit-genau.
tip.4.body = Eine Seite hat keinen Exklusivmodus: Die Web-Audio-Erfassung kommt als float32 hinter dem gemeinsamen Windows-Mixer an, was dieser Mixer getan hat, steckt also bereits in den Abtastwerten. Der QA40x ist die Ausnahme - er umgeht den Mixer, weil er gar keine Soundkarte ist, und wird direkt über WebUSB gelesen.
tip.5.title = Das Mausrad zoomt um den Cursor herum.
tip.5.body = In jeder Trace-Ansicht: Das Rad bewegt vertikal, Umschalt+Rad horizontal, Strg+Rad zoomt die vertikale Achse und Strg+Umschalt+Rad die horizontale - beide Zooms halten den Wert unter dem Zeiger fest.
tip.6.title = Jedes Zahlenfeld nimmt Einheiten, das Rad und die Tastatur an.
tip.6.body = Tippen Sie einen Wert mit seiner Einheit (µV, 1.5 V, -3 dBV, 2 kHz), scrollen Sie mit dem Rad, klicken Sie auf die Auf/Ab-Pfeile oder drücken Sie die Auf/Ab-Tasten der Tastatur zum Schrittweiterschalten.
tip.7.title = Sinc-Interpolation zählt nur, wenn Sie hineingezoomt sind.
tip.7.body = Der Sin/Lin-Schalter ändert den Trace nur, wenn die Abtastpunkte ein paar Pixel auseinanderliegen; sonst sehen gerade Linien identisch aus und kosten weniger CPU. Es schaltet sich automatisch ein und aus.
tip.8.title = Hysterese stabilisiert den Trigger bei einem schwachen, verrauschten Signal.
tip.8.body = Ohne sie löst Rauschen um den Triggerpegel eine Flut von Fehltriggern aus und der Trace zittert. Aktivieren Sie die Triggerhysterese, und der Trace rastet ein.
tip.9.title = Ein gespeichertes Generatorsignal ist eine perfekte Referenz.
tip.9.body = "Speichern unter..." schreibt die ideale, mathematisch exakte Wellenform - ohne DAC-, Verstärker- oder Verkabelungsverzerrung. Speisen Sie sie in ein anderes Instrument ein, und jede Unvollkommenheit, die Sie messen, gehört zu jenem Gerät, nicht zur Quelle.
tip.10.title = Rechnen Sie eine Beschaltung mit einer Kalibrierdatei heraus.
tip.10.body = Messen Sie einen Notch, ein Dämpfungsglied oder den Frequenzgang einer Soundkarte einmal im Frequenzgang-Modul, laden Sie dann jene .frc in den FFT-Analysator: seine Form wird bei der Anzeige von der FFT abgezogen, sodass die Messwerte das zu prüfende Gerät zeigen und nicht alles zusammen gemischt.
tip.11.title = Die rekonstruierte Schwebungs-Überlagerung bändigt ein eng beieinanderliegendes Tonpaar.
tip.11.body = Im Zweiton-Modus zeichnet die "Rekonstruierte Schwebung"-Überlagerung des Oszilloskops die langsame |f1 − f2|-Hüllkurve, sodass Sie auf die Schwebung triggern können, statt den schnellen Trägernulldurchgängen hinterherzujagen.
tip.12.title = Der Frequenzgang-Sweep ist seine eigene Referenz.
tip.12.body = Die gesweepte Messung wird gegen den exakt abgespielten Sweep entfaltet - nicht gegen eine nachgemessene Kopie - sodass der zurückgewonnene Betrag und die Phase die wahre Übertragungsfunktion des Geräts sind.
tip.13.title = Strg+F1 springt direkt zur passenden Hilfe.
tip.13.body = Drücken Sie überall F1 für das Handbuch oder Strg+F1, um die Hilfe genau beim Abschnitt für das gerade fokussierte Bedienelement zu öffnen.
tip.14.title = Die Residuum-Ansicht zeigt, was sich unter der Grundwelle verbirgt.
tip.14.body = Schalten Sie einen Kanal auf "Residuum", und das Oszilloskop zeichnet das erfasste Signal abzüglich seines bestangepassten Tons - Verzerrung, Rauschen und Störimpulse, die unter der Grundwelle begraben waren, werden sichtbar. Auch im Zweiton-Modus: beide Frequenzen werden aus der Erfassung selbst gemessen, sodass freilaufende DAC- und ADC-Takte die Subtraktion nicht verschmieren können.
tip.15.title = Überlagern Sie einem gemessenen Frequenzgang ein ideales Filter.
tip.15.body = Der Filter-Tab des Frequenzgang-Moduls verankert einen idealen Tiefpass, Hochpass, Bandpass oder Notch (Butterworth, Tschebyscheff, invers Tschebyscheff, elliptisch, Bessel) an der gemessenen Kurve, und der Vergleich trägt die Abweichung davon auf - genauso wie gegen RIAA.
tip.16.title = Lassen Sie die Unebenheits-Anzeige die Ebenheit beurteilen.
tip.16.body = Auf dem Unebenheit-Tab finden Sie die Bandgrenzen, an denen der Frequenzgang einen ±X-dB-Korridor um seinen Spitzenwert erstmals verlässt (bei einem Notch um sein Minimum), oder lesen die ±-Abweichung über einen gewählten Bereich ab - direkt im Plot annotiert, mit den Zahlenwerten als überlagerte Tabelle auf der Kurve.
tip.17.title = Die Vollaussteuerungs-Kalibrierung gehört zur Soundkarte.
tip.17.body = Jede Karte führt ihr eigenes Profil: eine Zeile pro Abschwächer- oder DIP-Bereich, getrennte Werte für links / rechts, erkannt am Gerätenamen in jedem Backend - ein Geräte- oder Backend-Wechsel bringt die Kalibrierungen nie durcheinander. Bekannte Karten werden vorkonfiguriert angeboten; Ihre Fadenkreuz-Kalibrierung verfeinert sie.
tip.18.title = Treiben Sie nur den Kanal, den Sie messen.
tip.18.body = Der Generator, der Frequenzgang-Sweep und der Notch-Tuner haben je einen Ausgangskanal-Wähler - Beide, nur Links oder nur Rechts -, der die getriebene Spur live schaltet. Praktisch für Übersprech-Prüfungen und Geräte mit einem Eingang.
tip.19.title = Weit herausgezoomt zeichnet das Oszilloskop wie ein echtes DSO.
tip.19.body = Oberhalb von einem Abtastwert pro Pixel wird der Trace zu einem Digital-Phosphor-Bild: das Verweildauer-Histogramm jeder Spalte, überstrichen mit einem Stift in der eingestellten Trace-Breite - schmale Pulse und Schwebungs-Hüllkurven behalten ihr wahres Spitze-Spitze bei jedem Zoom, und die Helligkeit zeigt, wo das Signal verweilt.
tip.20.title = Gestörte Erfassungen vergiften nie eine lange Mittelung.
tip.20.body = Die FFT verwirft Blöcke mit Spleißstellen, Aussetzern oder bandbreitenverletzenden Störimpulsen, bevor sie in die Mittelung eingehen, synchronisiert neu und mittelt weiter. Bei einem kleinen oder nicht-sinusförmigen Signal, das das Gate bei jedem Block auslöst, deaktivieren Sie "Zeitliche Diskontinuität erkennen" auf dem FFT-Einstellungs-Tab.
tip.21.title = SNR und ENOB bleiben auch bei einem breiten oder verrauschten Ton ehrlich.
tip.21.body = Die Rauschkennzahlen schließen nicht nur die Grundwelle und ihre Oberwellen aus, sondern deren gesamten Leck- und Phasenrausch-Saum - das ausgeschlossene Band weitet sich, um einem breiten oder zitternden Ton bis zum Grundrauschen zu folgen, sodass ein breiter Saum SNR oder ENOB nie aufbläht.
tip.22.title = Lassen Sie die Einheit weg - nackte Ziffern bedeuten die Basiseinheit.
tip.22.body = Tippen Sie nur eine Zahl, und das Feld nimmt sie in seiner Basiseinheit - 1000 in einem Frequenzfeld sind 1000 Hz, in einem Amplitudenfeld 1000 V, in einem Zeitfeld 1000 s. Auch Kilohertz hat Kurzformen: 1.5k, 1.5kh und 1.5khz bedeuten alle 1.5 kHz.
tip.23.title = Ziehen Sie ein Rechteck auf, um genau in diesen Bereich zu zoomen.
tip.23.body = In der Oszilloskop-, FFT- und Frequenzgang-Ansicht ziehen Sie mit der linken Maustaste ein Gummiband um den Bereich, der Sie interessiert - beim Loslassen füllt er die Ansicht. Strg+Z geht durch die letzten 32 Zooms der Ansicht unter dem Zeiger zurück.
tip.24.title = Stellen Sie den Dither in dBV ein und lesen Sie ihn direkt am FFT-Grundrauschen ab.
tip.24.body = Das Dither-Feld des Generators nimmt Bit oder einen dBV-Pegel an, und der dBV enthält bereits die Rauschbandbreite des FFT-Fensters - bei inkohärenter (Leistungs-)Mittelung landet das FFT-Grundrauschen also genau dort, wo Sie es einstellen: geben Sie −100 dBV ein, und das Grundrauschen liegt bei −100 dBV. Kohärente Mittelung löscht das Rauschen aus und zeigt einen weit tieferen Pegel an.
tip.25.title = Die Hardware muss nicht auf Ihrem Schreibtisch stehen.
tip.25.body = Lassen Sie Phonalyser als Server auf dem Rechner laufen, an dem Ihre Wandler hängen, und drücken Sie dann "Server..." unter Einstellungen → Audio. Die Tabelle öffnet sich leer: Tragen Sie Host und Port jenes Messplatzes (standardmäßig 8377) einmal unter "Server manuell hinzufügen" ein, und seine eigene Peer-Tabelle füllt den Rest. Seine Backends reihen sich dann in die Backend-Liste ein, und Geräte, Karten, Kalibrierung, Generator und Sweeps funktionieren alle, als steckte die Karte hier.
tip.26.title = Ein Messplatz-Gerät, an dem jemand anderes misst, sagt es Ihnen.
tip.26.body = Jedes Gerät eines Servers ist jeweils an einen Client gebunden, und ein Gerät, das ein anderer Bediener hält, zeigt direkt in der Geräteliste "belegt von" samt dem Namen jenes Clients - Sie erfahren es also, bevor Sie auf "Aufnahme" drücken, nicht danach.
tip.27.title = Lesen Sie Oberwellen mit dBr direkt an der Achse ab.
tip.27.body = Stellen Sie die Betragseinheit der FFT auf dBr, und die Grundwelle liegt exakt auf 0, sodass sich jede Oberwelle und jeder Störton direkt als "so viele dB unter dem Ton" ablesen lässt. Die Referenz ist die angezeigte Grundwelle und wird bei jedem Neuzeichnen neu gelesen, folgt also einem driftenden Pegel.
tip.28.title = Geben Sie einen Ausgangspegel in dBFS ein, wenn Sie Vollaussteuerung meinen.
tip.28.body = Der Generator, der Frequenzgang-Sweep und der Notch-Assistent nehmen alle eine Amplitude in dBFS an - Suffix dbfs oder kurz dbf - und zeigen sie weiterhin in dieser Einheit an. 0 dBFS ist ein vollausgesteuerter Sinus, sodass der Wert seine Bedeutung beim Wechsel der Kurvenform nicht ändert.
tip.29.title = Das Amplitudenhistogramm unterscheidet Übersteuerung und Rauschen auf einen Blick.
tip.29.body = Öffnen Sie es über die Werkzeugleiste des Oszilloskops: Ein Sinus zeichnet die Badewanne seiner beiden Umkehrpunkte, Breitbandrauschen eine Gaußglocke und ein übersteuertes Signal eine harte Spitze dort, wo die Aussteuerungsgrenze liegt. Eine nur einseitig übersteuerte Kurvenform zeigt sich als ungleiche Balken um die Mittellinie.
tip.30.title = Ein QA40x-Eingangsbereich "0 dBV" sind nicht 0 dBV RMS.
tip.30.body = Die Bereichstabelle schreibt es aus - 0 "dBV" real 0 dBFS or -9 dBV -, denn ein QA-Eingangsbereich ist eine Spitze-Spitze-dBFS-Referenz über das Differenzpaar, dessen echte RMS-Vollaussteuerung rund 9 dB tiefer liegt. Die Ausgangsbereiche sind echte dBV.
tip.31.title = Ihre Kalibrierung kann Ihnen an den Messplatz folgen.
tip.31.body = Wählen Sie ein Servergerät ohne Kalibrierung, während dieser Rechner eine dazu passende kalibrierte Karte führt, bietet Phonalyser an, die Werte zu übernehmen - einmal pro Sitzung und nie stillschweigend. Sagen Sie nein, wird nichts geschrieben.
tip.32.title = Ein QA403 läuft mit 384 kHz, ein QA402 nicht.
tip.32.body = Die Ratenliste richtet sich nach dem tatsächlich angeschlossenen Analysator - das Abtastraten-Register hat einen vierten Code, den nur der QA403 kennt. Erfassung und Generator laufen beide mit der gewählten Rate, denn beide Richtungen teilen sich einen Hardware-Takt.
tip.33.title = Der QA40x kann einen Wandler direkt über seinen frontseitigen I2S-Port treiben.
tip.33.body = Schalten Sie den Port unter "QA40x-Einstellungen" ein, und die Liste der Ausgangs-Bittiefen bietet die 16 und 32 Bit des Ports anstelle der 24 des Analysators an, während der Eingang durchgehend bei 24 bleibt. Es ist experimentell: QuantAsylum dokumentiert den Steckverbinder, nicht aber die Register, die ihn freischalten.
tip.34.title = Einen langen Sweep müssen Sie nicht mehr aussitzen.
tip.34.body = Das Fortschrittsfenster des Frequenzgangs trägt eine Schaltfläche "Abbrechen". Sie wirkt kooperativ - der Sweep endet über den gewöhnlichen Stopp-Pfad, sodass sich das Fenster schließt und die Ansicht genau wie nach einem vollständigen Durchlauf wieder freigegeben wird, mit zurückgegebener Erfassung und zurückgegebenem Generator.
tip.35.title = Ein glatt aussehender Frequenzgang kann trotzdem übersteuert sein.
tip.35.body = Erreichte die Erfassung die Vollaussteuerung, werden Sie gewarnt, sobald der Trace erscheint. Die Entfaltung macht aus einer an die Grenze gefahrenen Aufnahme eine feine regelmäßige Welligkeit, die eher wie Rauschen als wie ein Schaden aussieht - senken Sie also den Pegel, statt der Kurve zu vertrauen.
tip.36.title = Jeder Frequenzgang auf dem Bildschirm lässt sich speichern.
tip.36.body = Der "Speichern unter..."-Tab schreibt die angezeigte Kurve ohne jede Qualitätsprüfung in eine Datei - einen gerade gemessenen Sweep, einen ganz sanft getriebenen ebenso wie einen von der Festplatte zurückgeladenen. Verlangt wird einzig, dass überhaupt eine Messung vorliegt.
tip.37.title = Stecken Sie eine Karte ein, ohne die Anwendung neu zu starten.
tip.37.body = "Geräte scannen" unter Einstellungen → Audio liest die Geräteliste des Browsers erneut ein, stellt die Backend-Liste neu zusammen - nur so erscheint ein nach dem Start eingesteckter QA40x überhaupt als Backend - und fragt einen verbundenen Messplatz erneut nach seinen Backends.
tip.38.title = Die Einstellungen sagen Ihnen, wenn Ihre Volt geraten sind.
tip.38.body = Beim Schließen des Audio-Tabs nach einem Backend- oder Gerätewechsel wird geprüft, ob die übernommene Auswahl wirklich auf eine gemessene Vollaussteuerung führt, und der Eingang, der Ausgang oder beide werden benannt, wenn nicht. Eine an das Gerät gebundene Karte, die nur Nullen enthält, gilt als unkalibriert - eine leere Zeile ist keine Messung.
tip.39.title = Ein toter Eingang sagt es, statt eine flache Linie zu zeichnen.
tip.39.body = Ziehen Sie die Karte ab oder lässt eine andere Anwendung sie exklusiv belegen, halten Oszilloskop und FFT mit einem einzigen Dialog an, der das Backend benennt und sagt, ob das Gerät verloren ging oder nur keine Abtastwerte mehr lieferte. Die Wiedergabeseite wird genauso überwacht.
tip.40.title = Eine gespeicherte Einstellung, die sich nicht lesen lässt, wird nie überschrieben.
tip.40.body = Ihre Einstellungen und Karten liegen im lokalen Speicher des Browsers, nicht in Dateien. Ein Wert, der sich nicht lesen lässt, wird unter demselben Schlüssel mit der Endung .corrupt daneben kopiert, und der Lauf startet mit den Vorgabewerten - so bleibt jede darin enthaltene Kalibrierung zur Rettung erhalten, statt vom nächsten Speichern zubetoniert zu werden.

