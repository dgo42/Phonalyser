predistortion.phase.collecting = Runde {0}: Mittelung...  {1} Mittelungen verbleibend
predistortion.phase.applying = Runde {0}: Korrekturen werden angewendet...
predistortion.phase.settling = Einschwingen nach der Korrektur...
