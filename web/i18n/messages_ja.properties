# ===== TIP OF THE DAY =====

tip.dialog.heading = 今日のヒント
tip.dialog.dontShowAgain = 次回から表示しない
tip.dialog.next = 次のヒント
tip.dialog.close = 閉じる
tip.dialog.closeCountdown = 閉じる ({0}秒)
tip.count = 40
tip.1.title = コヒーレント平均化はノイズフロアのはるか下まで掘り下げます。
tip.1.body = コヒーレント (複素) 平均化をオンのままにしてFFTを実行し続けてください。トーンは加算される一方でノイズは部分的に打ち消し合うため、待つほどフロアは下がり続けます。
tip.2.title = クリーンなスペクトルを得るには、ジェネレータをFFTビンにスナップしてください。
tip.2.body = 「周波数を最も近いビンにスナップ」をオンにすると、トーンがちょうどビン上に乗るため、リーケージが基本波をにじませず、高調波の推定値も正確に保たれます。
tip.3.title = ツインT型ノッチでは基本波を手動で固定してください。
tip.3.body = パッシブなツインT型のヌルは非常に急峻なため、数十分の1ヘルツの熱ドリフトでも逆算した基本波が大きく振れます。「手動基本波」に実際に判っているレベルを入力してください。緩やかな側にある高調波は問題なく逆算されます。
tip.4.title = ブラウザでビット精密なのは QA40x だけです。
tip.4.body = ページには排他モードがありません。Web Audio のキャプチャは Windows の共有ミキサーを通った後に float32 として届くため、そのミキサーが行ったことはすでにサンプルに含まれています。QA40x だけは例外です。そもそもサウンドカードではないためミキサーを迂回し、WebUSB 経由で直接読み出されます。
tip.5.title = マウスホイールはカーソルを中心にズームします。
tip.5.body = 任意のトレース表示で、ホイールは垂直に、Shift+ホイールは水平に移動し、Ctrl+ホイールは垂直軸を、Ctrl+Shift+ホイールは水平軸をズームします。どちらのズームもポインタ下の値を固定したまま行います。
tip.6.title = すべての数値フィールドは単位、ホイール、キーボードに対応します。
tip.6.body = 単位付きで値を入力 (µV、1.5 V、-3 dBV、2 kHz) するか、ホイールをスクロールするか、上下の矢印をクリックするか、キーボードの上下キーを押してステップさせてください。
tip.7.title = sinc補間はズームインしているときだけ意味を持ちます。
tip.7.body = Sin/Linスイッチがトレースを変えるのは、サンプル点が画面上で数ピクセル離れているときだけです。それ以外では直線でも見た目は同じで、CPUコストも低くなります。個々のサンプルが見えてきたらオンにしてください。
tip.8.title = ヒステリシスは微弱でノイズの多い信号でトリガを安定させます。
tip.8.body = これがないと、トリガレベル付近のノイズが大量の誤トリガを発生させ、トレースがジッタします。トリガヒステリシスを有効にするとトレースがロックします。
tip.9.title = 保存したジェネレータ信号は完璧な基準です。
tip.9.body = 「保存先...」は理想的で数学的に正確な波形を書き出します。DAC、アンプ、配線による歪みはありません。これを別の計器に入力すれば、測定される不完全さはすべて信号源ではなくそのデバイスに由来します。
tip.10.title = キャリブレーションファイルでフィクスチャを逆算除去します。
tip.10.body = ノッチ、アッテネータ、サウンドカードの応答を周波数応答モジュールで一度測定し、その.frcをFFTアナライザに読み込むと、表示時にその応答が除算され、テーブルには被測定デバイスが表示されます。
tip.11.title = 再構成ビートのオーバーレイは近接した2トーンのペアを御しやすくします。
tip.11.body = デュアルトーンモードでは、スコープの「再構成ビート」オーバーレイがゆっくりした |f1 - f2| 包絡線を描くため、速いキャリアのゼロクロスを追わずにビートでトリガできます。
tip.12.title = 周波数応答スイープはそれ自身が基準です。
tip.12.body = スイープ測定は、再測定したコピーではなく実際に再生された正確なスイープに対してデコンボリューションされるため、回復された振幅と位相はデバイスの真の伝達関数になります。
tip.13.title = Ctrl+F1で適切なヘルプに直接ジャンプします。
tip.13.body = どこでもF1を押すとマニュアルが開き、Ctrl+F1を押すと現在フォーカスのあるコントロールに対応する箇所でヘルプが開きます。
tip.14.title = 残差表示は基本波の下に隠れているものを見せます。
tip.14.body = チャンネルを「残差」に切り替えると、スコープはキャプチャした信号から最良適合のトーンを差し引いた波形を描きます。基本波の下に埋もれた歪み、ノイズ、グリッチが見えるようになります。デュアルトーンでも機能します。両方の周波数はキャプチャ自体から測定されるため、自走するDACとADCのクロックが減算をにじませることはありません。
tip.15.title = 測定した応答に理想フィルタを重ねてください。
tip.15.body = 周波数応答モジュールのフィルタタブは、理想的なローパス、ハイパス、バンドパスまたはノッチ (バターワース、チェビシェフ、逆チェビシェフ、楕円、ベッセル) を測定したカーブに固定し、比較はそこからのずれをプロットします。RIAAに対する場合と同じ方式です。
tip.16.title = 平坦さの判定は偏差の読み出しに任せてください。
tip.16.body = 偏差タブでは、応答がピークから (ノッチの場合は最小値から) の ±X dB の許容帯を初めて外れる帯域端を見つけたり、選んだ範囲での ± のずれを読み取ったりできます。結果はプロット上に直接注記され、数値はカーブ上のオーバーレイ表として描かれます。
tip.17.title = フルスケールキャリブレーションはサウンドカードに属します。
tip.17.body = 各カードは自分のプロファイルを保持します。アッテネータやDIPレンジごとに1行、左右別々の値を持ち、どのバックエンドでもデバイス名で照合されます。そのためデバイスやバックエンドを切り替えてもキャリブレーションが混ざることはありません。既知のカードは設定済みで提供され、あなたの十字カーソルキャリブレーションがそれをさらに精密にします。
tip.18.title = 測定しているチャンネルだけを駆動してください。
tip.18.body = ジェネレータ、周波数応答スイープ、ノッチチューナーにはそれぞれ出力チャンネルのセレクタ (両方、左のみ、右のみ) があり、駆動するレーンをライブで切り替えます。クロストークの確認や入力が1系統だけの機器に便利です。
tip.19.title = 大きくズームアウトすると、スコープは本物のDSOのように描画します。
tip.19.body = 1ピクセルあたり1サンプルを超えると、トレースはデジタルフォスファ画像になります。各列の滞留ヒストグラムを、設定したトレース幅のペンで掃引したものです。幅の狭いパルスやビートの包絡線はどのズームでも真のピーク・トゥ・ピークを保ち、輝度は信号がどこに長く留まるかを示します。
tip.20.title = グリッチを含むキャプチャが長い平均を汚すことはありません。
tip.20.body = FFTは、スプライス、ドロップアウト、帯域制限に違反するグリッチを含むブロックを平均に入る前に棄却し、その後再同期して平均化を続けます。小さな信号や非正弦波の信号で毎ブロックこのゲートが作動する場合は、FFT 設定タブの「時間不連続を検出」のチェックを外してください。
tip.21.title = SNRとENOBは、広いあるいはノイズの多いトーンでも正直な値を保ちます。
tip.21.body = ノイズ指標は、基本波とその高調波だけでなく、そのリーケージと位相ノイズのスカート全体も除外します。除外帯域は、広いあるいはジッタの多いトーンをフロアまで追って広がるため、広いスカートがSNRやENOBを水増しすることはありません。
tip.22.title = 単位を省けば、数字だけで基本単位として扱われます。
tip.22.body = 数字だけを入力すると、フィールドはそれを基本単位で受け取ります。周波数フィールドの1000は1000 Hz、振幅フィールドでは1000 V、時間フィールドでは1000 sです。キロヘルツには短縮形もあります。1.5k、1.5kh、1.5khzはいずれも1.5 kHzを意味します。
tip.23.title = 矩形をドラッグすると、その領域だけをズームできます。
tip.23.body = オシロスコープ、FFT、周波数応答の各表示では、左ボタンでドラッグして注目する領域をラバーバンドで囲むと、ボタンを離した時点でその領域が表示いっぱいに広がります。Ctrl+Zはポインタ下の表示について直近32回のズームを1つずつ戻します。
tip.24.title = ディザを dBV で設定すれば、FFT のノイズフロアからそのまま読み取れます。
tip.24.body = ジェネレータのディザ欄はビット深度または dBV レベルを受け付け、その dBV には FFT 窓のノイズ帯域幅がすでに織り込まれています - そのため非コヒーレント (パワー) 平均化では、FFT のノイズフロアは設定したとおりの位置にちょうど現れます。−100 dBV と入力すればフロアは −100 dBV になります。コヒーレント平均化はノイズを打ち消すため、はるかに低く読み取られます。
tip.25.title = ハードウェアが手元の机の上にある必要はありません。
tip.25.body = コンバータが接続されているマシンで Phonalyser をサーバーとして実行し、設定 → オーディオで「サーバー...」を押してください。表は空の状態で開きます。「サーバーを手動で追加」にそのベンチのホストとポート (既定では 8377) を一度入力すれば、あとはそのサーバー自身のピア表が残りを埋めてくれます。するとそのバックエンドがバックエンド一覧に加わり、デバイス、カード、校正、ジェネレータ、スイープのすべてが、カードがこちらに挿さっているかのように動作します。
tip.26.title = 他の人が測定中のベンチのデバイスは、そうと表示されます。
tip.26.body = サーバーの各デバイスは一度に1つのクライアントだけにロックされ、他のオペレータが押さえているデバイスはデバイス一覧に「使用中」とそのクライアント名が表示されます。つまりキャプチャを開始した後ではなく、その前に判ります。
tip.27.title = dBr なら高調波を軸からそのまま読み取れます。
tip.27.body = FFT の振幅単位を dBr に切り替えると基本波がちょうど 0 に来るため、すべての高調波とスプリアスが「トーンより何 dB 下」として直接読み取れます。基準は表示されている基本波であり、再描画のたびに読み直されるため、レベルがドリフトしても追従し続けます。
tip.28.title = フルスケール基準で指定したいときは、出力レベルを dBFS で入力してください。
tip.28.body = ジェネレータ、周波数応答スイープ、ノッチチューナーのウィザードはいずれも dBFS 単位の振幅を受け付け - 接尾辞は dbfs、短縮形は dbf - その単位のまま表示し続けます。0 dBFS はフルスケールの正弦波なので、波形を切り替えても数値の意味は変わりません。
tip.29.title = 振幅ヒストグラムを見れば、クリッピングとノイズをひと目で見分けられます。
tip.29.body = オシロスコープのツールバーから開きます。正弦波は2つの折り返し点による浴槽型を描き、広帯域ノイズはガウス型の釣鐘を、クリップした信号は電源レールの位置に鋭いスパイクを描きます。片側だけクリップした波形は、中心線に対して左右非対称なバーとして現れます。
tip.30.title = QA40x の「0 dBV」入力レンジは 0 dBV RMS ではありません。
tip.30.body = レンジ表にそのとおり書かれています - 0 "dBV" real 0 dBFS or -9 dBV - QA の入力レンジは差動ペア間のピーク・トゥ・ピークの dBFS 基準であり、その真の RMS フルスケールは約 9 dB 下にあるからです。出力レンジは本物の dBV です。
tip.31.title = 校正はベンチまで付いて来られます。
tip.31.body = 校正のないサーバーデバイスを選んだとき、このマシンに一致する校正済みカードがあれば、Phonalyser は値のコピーを提案します。セッションにつき1回だけで、黙って行うことはありません。断れば何も書き込まれません。
tip.32.title = QA403 は 384 kHz で動作しますが、QA402 は動作しません。
tip.32.body = レート一覧は実際に接続されているアナライザに従います。サンプリングレートレジスタには QA403 だけが持つ4つ目のコードがあるからです。キャプチャとジェネレータはどちらも選んだレートで動作します。2つの方向が1つのハードウェアクロックを共有しているためです。
tip.33.title = QA40x はフロントパネルの I2S ポートから直接コンバータを駆動できます。
tip.33.body = 「QA40xの環境設定」でポートを有効にすると、出力ビット深度の一覧にはアナライザの24ビットに代わってポートの16ビットと32ビットが並び、入力は終始24ビットのままです。これは実験的な機能です。QuantAsylum はコネクタについては文書化していますが、それを有効にするレジスタについては文書化していません。
tip.34.title = 長いスイープを最後まで待つ必要はもうありません。
tip.34.body = 周波数応答の進捗ウィンドウには「キャンセル」ボタンがあります。これは協調的な中断です。スイープは通常の停止経路を通って終了するため、ウィンドウが閉じてペインのロックが解除される様子は完走したときとまったく同じで、キャプチャとジェネレータも返却されます。
tip.35.title = 滑らかに見える周波数応答でもクリップしていることがあります。
tip.35.body = キャプチャがフルスケールに達していた場合、トレースが現れると同時に警告されます。デコンボリューションは振り切れた録音を細かく規則的なリップルに変えてしまい、損傷ではなくノイズのように見えるため、カーブを信用せずに駆動レベルを下げてください。
tip.36.title = 画面に出ている周波数応答は、どれでも保存できます。
tip.36.body = 「保存先...」タブは、表示中のカーブを品質の条件を一切設けずにファイルへ書き出します。いま実行したばかりのスイープでも、控えめに駆動したものでも、ディスクから読み戻したものでも構いません。求められるのは、測定が存在することだけです。
tip.37.title = アプリケーションを再起動せずにカードを挿せます。
tip.37.body = 設定 → オーディオの「デバイスを検索」は、ブラウザのデバイス一覧を列挙し直し、バックエンド一覧を組み立て直し (起動後に挿した QA40x がそもそもバックエンドとして現れるのはこのためです)、接続中のベンチにもバックエンドを問い合わせ直します。
tip.38.title = ボルトが当て推量になっているとき、設定がそれを教えます。
tip.38.body = バックエンドやデバイスを変更した後にオーディオタブを閉じると、確定した選択が本当に実測のフルスケールに解決されるかが検査され、そうでない場合は入力・出力・その両方のどれかが名指しされます。デバイスに結び付いていても値がゼロのカードは未校正として扱われます。空の行は測定ではありません。
tip.39.title = 死んだ入力は、平坦な線を描く代わりにそうと知らせます。
tip.39.body = カードを抜いたり、他のアプリケーションに排他的に奪われたりすると、オシロスコープと FFT は停止し、バックエンド名と、デバイスが失われたのか単にサンプルの供給を止めただけなのかを示す1つのダイアログが出ます。再生側も同じように監視されています。
tip.40.title = 解析できない保存済み設定が上書きされることはありません。
tip.40.body = 設定とカードはファイルではなくブラウザのローカルストレージに保存されます。解析できない値は、同じキーに .corrupt を付けた名前で脇へ退避され、実行は既定値から始まります。そのため中の校正値はすべて復旧用に残り、次回の保存で上書きされて固められることはありません。

