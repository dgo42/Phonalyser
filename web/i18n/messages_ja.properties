# ---- Frequency response
preferences.freqResp.lineWidth = トレース線幅、px:
preferences.freqResp.lineWidth.tooltip = 周波数応答トレースの線の太さ (ピクセル) (振幅、位相、RIAA基準、比較カーブ)
preferences.freqResp.maxFreqPctNyquist = 最大分析周波数、% ナイキスト
preferences.freqResp.maxFreqPctNyquist.tooltip = FreqResp表示の上限をナイキスト (サンプルレート / 2) のこの割合に制限します。96〜100 %。100 % = 厳密なナイキスト。値を下げるとデコンボリューションカーネルのエネルギーがロールオフする帯域をトリミングします。
preferences.freqResp.compareSmoothWindow = 比較スムージング窓、1/N オクターブ
preferences.freqResp.compareSmoothWindow.tooltip = 比較モード (測定値 − 基準) カーブに適用する移動平均フィルタの幅。1/Nオクターブ単位で表します。N = 0でスムージング無効。Nが小さいほど窓が広く = スムージングが強く (N=3 ≈ 1/3オクターブ、広い)、Nが大きいほど狭く = 軽く (N=24 ≈ 1/24オクターブ、標準的なオーディオ)。
preferences.freqResp.notch.enable = 産業ノイズ用ノッチフィルタを許可
preferences.freqResp.notch.enable.tooltip = 有効にすると、FreqResp表示が選択した電源周波数 (50/60 Hz) の各高調波をまたいで補間します - 再測定せずに表示応答から電源ハムのスパイクを除去します。
preferences.freqResp.notch.baseHz = 産業周波数
preferences.freqResp.notch.baseHz.tooltip = 上のチェックボックスがオンのときにその高調波 (50, 100, 150, ... Hz または 60, 120, 180, ...) をノッチ除去する基本周波数。
preferences.freqResp.signalColor = 信号の色
preferences.freqResp.phaseColor = 位相の色
preferences.freqResp.referenceColor = 基準 (RIAA) の色
preferences.freqResp.backgroundColor = チャート背景の色
