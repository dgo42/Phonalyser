# ===== DAC PREDISTORTION WIZARD =====

predistortion.button.wizard.tooltip = DAC プリディストーションを測定して適用します。\nトーンを FFT ビンにロックし、各ラウンドで設定したフレーム数を平均化し、サイン波の高調波 (またはデュアルトーンの相互変調積) を読み取り、それと大きさが等しく逆位相の補正をジェネレータへフィードバックします - 歪みが目標に達するか、改善が止まるまで繰り返します。\n目的: 歪みをノイズフロアへ向けて追い込むこと。.dpd を保存し、適用すると補正されたトーンが維持されます。
predistortion.wizard.title = DAC プリディストーション
predistortion.averages = 平均化回数、n
predistortion.averages.tooltip = ラウンドごとの FFT 平均化数 (最小 10)。各ラウンドはこの数のフレームを平均化し、収束に伴って歪みの低下に比例して増えていきます。ループは Stop を押すまで実行されます。
predistortion.targetThd = 目標 THD、%
predistortion.targetThd.tooltip = THD がこの値に達したら停止します (0 = 改善が止まるまで実行)
predistortion.intro = 必須: 基本波に同調させたパッシブのツインT型ノッチフィルタを、被測定デバイスと ADC の間に挿入してください。これがないと ADC 自身の高調波がフロアを決めてしまい、ループは DAC ではなく ADC を補正することになります。\nこれはジェネレータを、測定したものの逆で事前に歪ませることで、DAC の残留歪みを追い込みます。\n動作の仕組み - 1) トーンを FFT ビンにロックし、整合を待ちます。 2) 各ラウンドで下に設定した数の FFT フレームを平均化し、サイン波の高調波 (またはデュアルトーンの相互変調積) を読み取り、それと大きさが等しく逆位相の補正をジェネレータへフィードバックします。 3) 歪みが下がるにつれて平均化フレームを増やしながら繰り返し、チャートがノイズフロアへ向けて落ちていき、目標の歪みに達するか改善が止まるまで続きます。\nウィザードは基本波をジェネレータから取得し FLL をオンにした無限コヒーレント平均化で FFT を実行します。最も深いフロアを得るには HFT248D ウィンドウを使い、電源抑制はオフのままにしてください。フルスケールより数 dB 低いクリーンな信号を使い、基本波をビンにスナップしてください - その後 .dpd を保存して適用してください。
