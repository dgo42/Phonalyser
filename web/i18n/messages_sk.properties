# ===== TIP OF THE DAY =====

tip.dialog.heading = Tip dňa
tip.dialog.dontShowAgain = Už nezobrazovať
tip.dialog.next = Ďalší tip
tip.dialog.close = Zavrieť
tip.dialog.closeCountdown = Zavrieť ({0} s)
tip.count = 41
tip.1.title = Koherentné spriemerovanie sa dostane hlboko pod úroveň šumu.
tip.1.body = Nechajte koherentné (komplexné) spriemerovanie zapnuté a nechajte FFT bežať - tón sa sčítava, kým sa šum čiastočne ruší, takže úroveň šumu klesá tým viac, čím dlhšie čakáte.
tip.2.title = Prichyťte generátor na FFT bin pre čisté spektrum.
tip.2.body = So zapnutou voľbou „Prichytiť frekvenciu na najbližšiu" tón dopadne presne na bin, takže presakovanie nerozmazáva základnú frekvenciu a odhady harmonických zostávajú verné.
tip.3.title = Pripnite základnú frekvenciu ručne pri zádrži typu twin-T.
tip.3.body = Pasívna nula twin-T je taká strmá, že pár desatín hertza tepelného driftu rozkýva odvodenú základnú frekvenciu. Zadajte úroveň, ktorú skutočne poznáte, pomocou „Ručná základná frekvencia"; harmonické na miernom svahu sa odvodia bez problémov.
tip.4.title = Bitovo presný je v prehliadači len QA40x.
tip.4.body = Stránka nemá exkluzívny režim: záznam cez Web Audio k nej prichádza ako float32 až za zdieľaným mixérom Windows, takže čokoľvek ten mixér urobil, je už vo vzorkách. QA40x je výnimka - mixér obchádza tým, že vôbec nie je zvuková karta, a číta sa priamo cez WebUSB.
tip.5.title = Pre rýchlejší osciloskop sa nedá zvoliť žiadny backend.
tip.5.body = Obnovovaciu frekvenciu osciloskopu určuje callback Web Audio a vykresľovacia cesta, nie ovládač, ktorý by ste si mohli vybrať. Zvýšiť môžete samotnú vzorkovaciu frekvenciu záznamu, a tá sa nastavuje v systéme Windows na zariadení, nie v tejto aplikácii - pozrite „Vstupné zariadenie Windows" v príručke.
tip.6.title = Koliesko myši približuje okolo kurzora.
tip.6.body = V ktoromkoľvek zobrazení priebehu: koliesko posúva zvisle, Shift+koliesko vodorovne, Ctrl+koliesko približuje zvislú os a Ctrl+Shift+koliesko vodorovnú - obe priblíženia udržia hodnotu pod ukazovateľom pevne.
tip.7.title = Každé číselné pole prijíma jednotky, koliesko aj klávesnicu.
tip.7.body = Napíšte hodnotu s jej jednotkou (µV, 1.5 V, -3 dBV, 2 kHz), otáčajte kolieskom, klikajte na šípky hore/dole alebo stláčajte klávesy hore/dole na krokovanie.
tip.8.title = Sinc interpolácia má význam len pri priblížení.
tip.8.body = Prepínač Sin/Lin mení priebeh len vtedy, keď sú body vzoriek na obrazovke pár pixelov od seba; inak vyzerajú priame čiary identicky a stoja menej CPU. Zapnite ho, keď sú viditeľné jednotlivé vzorky.
tip.9.title = Hysterézia stabilizuje spúšťanie na slabom, zašumenom signáli.
tip.9.body = Bez nej šum okolo úrovne spúšťania vyvolá záplavu falošných spustení a priebeh sa chveje. Zapnite hysteréziu spúšťania a priebeh sa uzamkne.
tip.10.title = Uložený signál generátora je dokonalá referencia.
tip.10.body = „Uložiť do..." zapíše ideálny, matematicky presný priebeh - žiadne skreslenie z DAC, zosilňovača či kabeláže. Privedte ho do iného prístroja a každá nedokonalosť, ktorú nameriate, patrí tomu zariadeniu, nie zdroju.
tip.11.title = Odvodte prípravok pomocou kalibračného súboru.
tip.11.body = Zmerajte raz odozvu zádrže, atenuátora alebo zvukovej karty v module Frekvenčná odozva, potom načítajte ten .frc do FFT analyzátora: jeho odozva sa pri zobrazení vydelí, takže tabuľka ukazuje skúmané zariadenie.
tip.12.title = Prekrytie rekonštruovaného zázneja skrotí blízku dvojicu tónov.
tip.12.body = V dvojtónovom režime prekrytie „Rekonštruovaný záznej" osciloskopu nakreslí pomalú obálku |f1 - f2|, takže môžete spúšťať na zázneji namiesto naháňania rýchlych prechodov nosnej.
tip.13.title = Rozmietanie frekvenčnej odozvy je samo sebe referenciou.
tip.13.body = Rozmietané meranie sa dekonvolvuje voči presnému rozmietaniu, ktoré sa prehralo - nie voči znovu zmeranej kópii - takže získaná amplitúda a fáza sú skutočnou prenosovou funkciou zariadenia.
tip.14.title = Ctrl+F1 skočí rovno na správneho pomocníka.
tip.14.body = Stlačte F1 kdekoľvek pre príručku alebo Ctrl+F1 na otvorenie pomocníka presne v sekcii pre ovládací prvok, ktorý má práve zameranie.
tip.15.title = Reziduálne zobrazenie ukáže, čo sa skrýva pod základnou frekvenciou.
tip.15.body = Prepnite kanál na „Reziduum" a osciloskop nakreslí zachytený signál mínus jeho najlepšie napasovaný tón - skreslenie, šum a poruchy pochované pod základnou frekvenciou sa stanú viditeľnými. Funguje aj dvojtón: obe frekvencie sa merajú zo samotného záznamu, takže voľne bežiace hodiny DAC a ADC nemôžu odčítanie rozmazať.
tip.16.title = Preložte cez nameranú odozvu ideálny filter.
tip.16.body = Karta Filtre modulu Frekvenčná odozva ukotví ideálnu dolnú priepusť, hornú priepusť, pásmovú priepusť alebo zádrž (Butterworth, Čebyšev, inverzný Čebyšev, eliptický, Bessel) na nameranú krivku a Porovnanie vykreslí odchýlku od tohto ideálu - rovnako ako voči RIAA.
tip.17.title = Nechajte odčítanie Nerovnomernosti posúdiť plochosť za vás.
tip.17.body = Na karte Nerovnomernosť nájdite okraje pásma, kde odozva prvýkrát opustí koridor ±X dB od svojho vrcholu (alebo od minima pri zádrži), alebo odčítajte odchýlku ± vo zvolenom rozsahu - anotované priamo v grafe, s číslami vykreslenými ako prekryvná tabuľka na krivke.
tip.18.title = Kalibrácia plného rozsahu patrí zvukovej karte.
tip.18.body = Každá karta si drží vlastný profil: jeden riadok na atenuátor či rozsah DIP prepínačov, oddelené hodnoty pre ľavý a pravý kanál, párované podľa názvu zariadenia na každom backende - takže prepnutie zariadenia či backendu nikdy nepomieša kalibrácie. Známe karty sa ponúkajú predkonfigurované; vaša kalibrácia nitkovým krížom ich spresní.
tip.19.title = Posielajte signál len do kanála, ktorý meriate.
tip.19.body = Generátor, rozmietanie frekvenčnej odozvy aj ladenie zádrže majú každý svoj prepínač Výstupný kanál - Oba, iba Ľavý alebo iba Pravý - ktorý za chodu hradluje budenú vetvu. Šikovné pri kontrole presluchov a pri zariadeniach s jediným vstupom.
tip.20.title = Pri veľkom oddialení osciloskop vykresľuje ako skutočný DSO.
tip.20.body = Nad jednou vzorkou na pixel sa priebeh stáva obrazom digitálneho luminoforu: histogram zotrvania každého stĺpca, ťahaný perom s nakonfigurovanou hrúbkou čiary - úzke impulzy a obálky záznejov si zachovajú skutočnú hodnotu špička-špička pri každom priblížení a jas ukazuje, kde sa signál zdržiava.
tip.21.title = Záznamy s poruchami nikdy neotrávia dlhé spriemerovanie.
tip.21.body = FFT odmietne bloky obsahujúce zlepenia, výpadky alebo poruchy porušujúce pásmové obmedzenie skôr, než vstúpia do priemeru, potom sa znova zosynchronizuje a spriemerúva ďalej. Pri malom alebo nesínusovom signáli, ktorý spúšťa túto bránu pri každom bloku, zrušte začiarknutie voľby „Detegovať časovú nespojitosť" na karte nastavení FFT.
tip.22.title = SNR a ENOB zostávajú verné aj pri širokom alebo zašumenom tóne.
tip.22.body = Šumové ukazovatele vylučujú nielen základnú frekvenciu a jej harmonické, ale celú jej sukňu presakovania a fázového šumu - vylúčené pásmo sa rozširuje, aby sledovalo široký alebo roztrasený tón až k úrovni šumu, takže široká sukňa nikdy nenafúkne SNR ani ENOB.
tip.23.title = Vynechajte jednotku - samotné číslice znamenajú základnú jednotku.
tip.23.body = Napíšte len číslo a pole ho prijme v základnej jednotke - 1000 vo frekvenčnom poli je 1000 Hz, v amplitúdovom poli 1000 V, v časovom poli 1000 s. Aj kilohertz má krátke tvary: 1.5k, 1.5kh a 1.5khz znamenajú 1.5 kHz.
tip.24.title = Ťahaním obdĺžnika priblížite presne tú oblasť.
tip.24.body = V zobrazeniach osciloskopu, FFT a frekvenčnej odozvy ťahajte ľavým tlačidlom, aby ste gumovým obdĺžnikom vyznačili oblasť, ktorá vás zaujíma - po uvoľnení vyplní celé zobrazenie. Ctrl+Z kroká späť cez posledných 32 priblížení zobrazenia pod ukazovateľom.
tip.25.title = Nastavte dither v dBV a odčítajte ho priamo z úrovne šumu FFT.
tip.25.body = Pole ditheru generátora prijíma bity alebo úroveň v dBV, pričom dBV už zahŕňa šumovú šírku pásma FFT okna - takže pri nekoherentnom (výkonovom) priemerovaní úroveň šumu FFT pristane presne tam, kam ju nastavíte: zadajte −100 dBV a úroveň šumu sa usadí na −100 dBV. Koherentné priemerovanie šum ruší a odčíta výrazne nižšie.
tip.26.title = Hardvér nemusí ležať na vašom stole.
tip.26.body = Spustite Phonalyser ako server na počítači, ku ktorému sú prevodníky pripojené, a potom stlačte Servery… v okne Predvoľby → Audio. Tabuľka sa otvorí prázdna: raz zadajte hostiteľa a port toho pracoviska (predvolene 8377) pod „Pridať server podľa adresy" a jeho vlastná tabuľka partnerov doplní zvyšok. Jeho backendy sa potom pridajú do zoznamu backendov a zariadenia, karty, kalibrácia, generátor aj rozmietania fungujú, akoby bola karta zapojená tu.
tip.27.title = Zariadenie na pracovisku, na ktorom meria niekto iný, to samo povie.
tip.27.body = Každé zariadenie servera je vždy uzamknuté pre jediného klienta a zariadenie, ktoré drží iný operátor, sa priamo v zozname zariadení zobrazuje s údajom „používa" a menom toho klienta - takže sa to dozviete skôr, než spustíte záznam, nie až potom.
tip.28.title = Odčítajte harmonické priamo z osi pomocou dBr.
tip.28.body = Prepnite jednotku amplitúdy FFT na dBr a základná frekvencia bude presne na 0, takže každá harmonická aj každý rušivý hrot sa odčíta priamo ako „toľko a toľko dB pod tónom". Referenciou je zobrazená základná frekvencia a znovu sa načíta pri každom prekreslení, takže sleduje aj unášajúcu sa úroveň.
tip.29.title = Výstupnú úroveň zadajte v dBFS, keď myslíte plný rozsah.
tip.29.body = Generátor, rozmietanie frekvenčnej odozvy aj sprievodca ladením zádrže prijímajú amplitúdu v dBFS - s príponou dbfs alebo skrátene dbf - a naďalej ju v tejto jednotke zobrazujú. 0 dBFS je sínus na plnom rozsahu, takže číslo nemení význam, keď prepnete tvar vlny.
tip.30.title = Histogram amplitúd na prvý pohľad odlíši obmedzenie signálu od šumu.
tip.30.body = Otvorte ho z panela nástrojov osciloskopu: sínus nakreslí vaňu medzi svojimi dvoma bodmi obratu, širokopásmový šum Gaussovu zvonovku a obmedzený signál ostrý hrot presne tam, kde je hranica. Priebeh obmedzený len z jednej strany sa prejaví nerovnakými stĺpcami okolo stredovej čiary.
tip.31.title = Vstupný rozsah QA40x „0 dBV" nie je 0 dBV RMS.
tip.31.body = Tabuľka Rozsahy to hovorí priamo - 0 "dBV" real 0 dBFS or -9 dBV - pretože vstupný rozsah QA je dBFS referencia špička-špička naprieč diferenciálnym párom, ktorej skutočný plný rozsah v RMS leží asi o 9 dB nižšie. Výstupné rozsahy sú naozajstné dBV.
tip.32.title = Vaša kalibrácia vás môže nasledovať na pracovisko.
tip.32.body = Vyberte zariadenie servera bez kalibrácie, kým má tento počítač zodpovedajúcu skalibrovanú kartu, a Phonalyser ponúkne prekopírovanie hodnôt - raz za reláciu a nikdy potichu. Odmietnite a nezapíše sa nič.
tip.33.title = QA403 beží na 384 kHz; QA402 nie.
tip.33.body = Zoznam frekvencií sleduje skutočne pripojený analyzátor - register vzorkovacej frekvencie má štvrtý kód, ktorý má len QA403. Záznam aj generátor bežia na tej frekvencii, ktorú zvolíte, pretože oba smery zdieľajú jediné hardvérové hodiny.
tip.34.title = QA40x dokáže budiť prevodník priamo z portu I2S na prednom paneli.
tip.34.body = Zapnite port v okne Predvoľby QA40x a zoznam bitovej hĺbky výstupu ponúkne 16 a 32 bitov portu namiesto 24 bitov analyzátora, pričom vstup zostáva stále na 24. Je to experimentálne: QuantAsylum dokumentuje konektor, ale nie registre, ktoré ho zapínajú.
tip.35.title = Dlhé rozmietanie už nemusíte čakať do konca.
tip.35.body = Okno priebehu frekvenčnej odozvy má tlačidlo Zrušiť. Je kooperatívne - rozmietanie sa skončí obvyklou cestou zastavenia, takže sa okno zavrie a panel odomkne presne ako po dokončenom behu, so záznamom aj generátorom vrátenými späť.
tip.36.title = Aj hladko vyzerajúca frekvenčná odozva môže byť obmedzená.
tip.36.body = Ak záznam dosiahol plný rozsah, dozviete sa to hneď, ako sa krivka objaví. Dekonvolúcia premení orezaný záznam na jemné pravidelné zvlnenie, ktoré vyzerá skôr ako šum než ako poškodenie, takže radšej znížte budiacu úroveň, než by ste krivke verili.
tip.37.title = Uložiť sa dá ľubovoľná frekvenčná odozva na obrazovke.
tip.37.body = Karta Uložiť do… zapíše zobrazenú krivku do súboru bez akejkoľvek podmienky kvality - rozmietanie, ktoré ste práve spustili, budené jemne aj načítané späť z disku. Jediné, čo vyžaduje, je, aby meranie vôbec existovalo.
tip.38.title = Kartu zapojte bez reštartu aplikácie.
tip.38.body = Hľadať zariadenia v okne Predvoľby → Audio znovu prečíta zoznam zariadení prehliadača, nanovo zostaví zoznam backendov - vďaka čomu sa QA40x zapojený až po štarte vôbec objaví ako backend - a znovu si vyžiada backendy od pripojeného pracoviska.
tip.39.title = Predvoľby vám povedia, keď sú vaše volty len odhad.
tip.39.body = Pri zatváraní karty Audio po zmene backendu alebo zariadenia sa overí, či potvrdený výber naozaj vedie k zmeranému plnému rozsahu, a ak nie, pomenuje vstup, výstup alebo oboje. Karta priradená k zariadeniu, ale plná núl, sa počíta za neskalibrovanú - prázdny riadok nie je meranie.
tip.40.title = Mŕtvy vstup to povie namiesto kreslenia rovnej čiary.
tip.40.body = Odpojte kartu alebo ju nechajte výhradne zabrať inej aplikácii a osciloskop aj FFT sa zastavia s jediným dialógom, ktorý pomenuje backend a povie, či sa zariadenie stratilo, alebo len prestalo dodávať vzorky. Strana prehrávania je sledovaná rovnako.
tip.41.title = Uložené nastavenie, ktoré sa nedá načítať, sa nikdy neprepíše.
tip.41.body = Vaše nastavenia a karty žijú v lokálnom úložisku prehliadača, nie v súboroch. Hodnota, ktorá sa nedá načítať, sa odloží bokom pod ten istý kľúč s príponou .corrupt a beh sa začne od predvolených hodnôt, takže každá kalibrácia v nej prežije pre záchranu namiesto toho, aby ju zabetónovalo ďalšie uloženie.

