predistortion.button.stopRound.tooltip = Zakończ teraz bieżącą rundę uśredniania - zastosuj zmierzoną dotąd korekcję i kontynuuj kolejną rundą.  Użyj, gdy widmo przestało się poprawiać i nie chcesz czekać na pozostałe uśrednienia.
