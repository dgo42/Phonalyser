# ---- Warnings
fft.warning.rejection = ⚠ Odrzucenia ramek - przechwytywanie spowolnione
fft.warning.rejection.rInvariant = Odrzucenie ramek: {0} z {1} ramek odrzucono (maks. |R−A|/A = {2} %).\nUżyto najdłuższego czystego segmentu; zbieżność przechwytywania spowolniona.
fft.warning.rejection.phase = Odrzucenie spójności fazowej: {0} z {1} ramek odrzucono (maks. odchylenie {2}°).\nPrawdopodobnie ubytek podpróbki; zbieżność przechwytywania spowolniona.
fft.warning.overrun = ⚠ Przepełnienie bufora - ponowna synchronizacja
fft.warning.overrun.tip = Analizator opóźnił się o cały bufor przechwytywania, więc okno zostało ponownie zakotwiczone na bieżącym czubku i uśrednianie jest kontynuowane (luka w pokryciu - brak uszkodzonych danych).\nCzęste przepełnienia oznaczają, że analiza nie nadąża; zmniejsz zakładkę lub długość FFT.
fft.warning.discontinuity = ⚠ Nieciągłość sygnału - ponowna synchronizacja
fft.warning.discontinuity.tip = Analizator wykrył nieciągłość w przechwyconym sygnale (zakłócenie łamiące ograniczenie pasma / utracone próbki), odrzucił dotknięte okno i ponownie zsynchronizował, więc uśrednianie koherentne jest kontynuowane.\nCzęste nieciągłości oznaczają, że źródło lub przechwytywanie zakłóca się pod obciążeniem.
fft.warning.alignDrift = ⚠ Poziom przesunął się podczas wyrównywania - wyzerowano statystyki
fft.warning.alignDrift.tip = Poziom składowej podstawowej zmienił się o {0} dB, gdy synchronizacja częstotliwości naprowadzała generator na siatkę prążków FFT.\nUśrednianie bieżące wciąż zawiera ramki sprzed wyrównania na starym poziomie - kliknij Wyzeruj statystyki, aby zebrać czyste uśrednienie.
fft.warning.netGap = ⚠ Stanowisko utraciło dźwięk - uśrednianie niepewne
fft.warning.netGap.tip = Serwer Phonalyser zgubił przechwycone próbki, zanim trafiły do sieci; próbki po obu stronach luki nie sąsiadują ze sobą w czasie.\nZresetuj statystyki, aby uzyskać czyste uśrednienie.

# ===== DAC PREDISTORTION WIZARD =====

predistortion.button.wizard.tooltip = Zmierz i zastosuj predystorsję DAC.\nPrzyciąga ton do prążka FFT, a następnie w każdej rundzie uśrednia ustawioną liczbę ramek FFT, odczytuje harmoniczne sinusa (lub produkty intermodulacji tonu dwuskładnikowego) i przekazuje równą i przeciwną korekcję z powrotem do generatora - powtarzając, aż zniekształcenia osiągną cel lub przestaną się poprawiać.\nCel: zepchnąć zniekształcenia w stronę poziomu szumu; zapisz plik .dpd i zastosuj go, aby zachować skompensowany ton.
predistortion.wizard.title = Predystorsja DAC
predistortion.averages = Uśrednienia, n
predistortion.averages.tooltip = Uśrednienia FFT na rundę (minimum 10).  Każda runda uśrednia tyle ramek, rosnąc proporcjonalnie do spadku zniekształceń w miarę zbieżności.  Pętla działa, dopóki nie naciśniesz Stop.
predistortion.targetThd = Docelowy THD, %
predistortion.targetThd.tooltip = Zatrzymaj, gdy THD osiągnie tę wartość (0 = działaj, aż się zatrzyma)
predistortion.intro = OBOWIĄZKOWO: umieść pasywny filtr zaporowy bliźniaczy-T, dostrojony do składowej podstawowej, między badanym urządzeniem a ADC.  Bez niego własne harmoniczne ADC wyznaczają poziom i pętla kompensuje ADC, a nie DAC.\nTo spycha resztkowe zniekształcenia DAC w dół, predystorsując generator odwrotnością tego, co mierzy.\nJak to działa - 1) przyciąga ton do prążka FFT i czeka na wyrównanie;  2) w każdej rundzie uśrednia ustawioną poniżej liczbę ramek FFT, odczytuje harmoniczne sinusa (lub produkty intermodulacji tonu dwuskładnikowego) i przekazuje równą i przeciwną korekcję z powrotem do generatora;  3) powtarza - uśredniając więcej ramek w miarę spadku zniekształceń - z wykresem opadającym w stronę poziomu szumu, aż docelowe zniekształcenia zostaną osiągnięte lub postęp ustanie.\nKreator uruchamia FFT w nieskończonym uśrednianiu spójnym ze składową podstawową pobieraną z generatora i włączonym FLL; dla najniższego poziomu szumu użyj okna HFT248D i pozostaw tłumienie sieci wyłączone.  Użyj czystego sygnału kilka dB poniżej pełnej skali i składowej podstawowej przyciągniętej do prążka - następnie zapisz plik .dpd i zastosuj go.
predistortion.group.fft = Ustawienia FFT
predistortion.group.progress = Postęp
predistortion.fft.size = Rozmiar FFT: {0} ({1} Hz/bin)
predistortion.fft.rate = Częstotliwość próbkowania: {0} Hz
predistortion.fft.window = Okno: {0}
predistortion.phase.aligning = Wyrównywanie generatora na jego prążek FFT...
predistortion.phase.collecting = Runda {0}: uśrednianie...  pozostało {1} uśrednień
predistortion.phase.applying = Runda {0}: stosowanie korekcji...
predistortion.phase.settling = Ustalanie po korekcji...
