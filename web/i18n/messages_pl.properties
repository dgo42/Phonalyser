# ===== TIP OF THE DAY =====

tip.dialog.heading = Porada dnia
tip.dialog.dontShowAgain = Nie pokazuj ponownie
tip.dialog.next = Następna porada
tip.dialog.close = Zamknij
tip.dialog.closeCountdown = Zamknij ({0}s)
tip.count = 40
tip.1.title = Uśrednianie koherentne sięga daleko poniżej poziomu szumu.
tip.1.body = Pozostaw włączone uśrednianie koherentne (zespolone) i pozwól FFT pracować - ton się sumuje, podczas gdy szum częściowo się znosi, więc poziom szumu opada tym bardziej, im dłużej czekasz.
tip.2.title = Przyciągnij generator do prążka FFT, aby uzyskać czyste widmo.
tip.2.body = Przy włączonej opcji „Przyciągaj częstotliwość do najbliższego" ton trafia dokładnie na prążek, więc wyciek nie rozmywa składowej podstawowej, a oszacowania harmonicznych pozostają rzetelne.
tip.3.title = Ustal ręcznie składową podstawową na filtrze bliźniaczym-T.
tip.3.body = Pasywne zero filtra bliźniaczego-T jest tak strome, że kilka dziesiętnych herca dryftu termicznego rozhuśtuje wydzieloną składową podstawową. Wprowadź poziom, który faktycznie znasz, w polu „Ręczna składowa podstawowa"; harmoniczne, na łagodnym zboczu, wydzielają się bez problemu.
tip.4.title = W przeglądarce bezstratny bitowo jest tylko QA40x.
tip.4.body = Strona nie ma trybu wyłączności: przechwyt Web Audio dociera do niej jako float32 już po współdzielonym mikserze Windows, więc cokolwiek ten mikser zrobił, jest już w próbkach. Wyjątkiem jest QA40x - omija mikser, bo w ogóle nie jest kartą dźwiękową, i jest odczytywany bezpośrednio przez WebUSB.
tip.5.title = Kółko myszy przybliża wokół kursora.
tip.5.body = W każdym widoku przebiegu: kółko przesuwa w pionie, Shift+kółko w poziomie, Ctrl+kółko przybliża oś pionową, a Ctrl+Shift+kółko poziomą - oba przybliżenia utrzymują wartość pod wskaźnikiem nieruchomo.
tip.6.title = Każde pole numeryczne przyjmuje jednostki, kółko i klawiaturę.
tip.6.body = Wpisz wartość z jednostką (µV, 1.5 V, -3 dBV, 2 kHz), przewiń kółkiem, kliknij strzałki w górę/w dół lub naciśnij klawisze strzałek w górę/w dół, aby zmieniać wartość krokowo.
tip.7.title = Interpolacja sinc ma znaczenie tylko po przybliżeniu.
tip.7.body = Przełącznik Sin/Lin zmienia przebieg tylko wtedy, gdy punkty próbek są na ekranie oddalone o kilka pikseli; w przeciwnym razie linie proste wyglądają identycznie i kosztują mniej CPU. Włącz go, gdy poszczególne próbki staną się widoczne.
tip.8.title = Histereza stabilizuje wyzwalanie przy słabym, zaszumionym sygnale.
tip.8.body = Bez niej szum wokół poziomu wyzwalania powoduje lawinę fałszywych wyzwoleń i przebieg drży. Włącz histerezę wyzwalania, a przebieg się ustabilizuje.
tip.9.title = Zapisany sygnał generatora to idealne odniesienie.
tip.9.body = „Zapisz do..." zapisuje idealny, matematycznie dokładny przebieg - bez zniekształceń DAC, wzmacniacza czy okablowania. Podaj go innemu przyrządowi, a każda zmierzona niedoskonałość należy do tego urządzenia, a nie do źródła.
tip.10.title = Wydziel charakterystykę toru pomiarowego plikiem kalibracji.
tip.10.body = Zmierz raz charakterystykę filtra zaporowego, tłumika lub karty dźwiękowej w module Charakterystyki częstotliwościowej, a następnie wczytaj ten plik .frc do analizatora FFT: jego charakterystyka jest dzielona przy wyświetlaniu, więc tabela pokazuje badane urządzenie.
tip.11.title = Nakładka odtworzonych dudnień ujarzmia bliską parę dwutonową.
tip.11.body = W trybie dwutonowym nakładka oscyloskopu „Odtworzone dudnienia" rysuje powolną obwiednię |f1 - f2|, więc można wyzwalać na dudnieniach zamiast gonić za szybkimi przejściami nośnej przez zero.
tip.12.title = Przemiatanie charakterystyki częstotliwościowej jest swoim własnym odniesieniem.
tip.12.body = Pomiar przemiataniem jest dekonwoluowany względem dokładnego przemiatania, które zostało odtworzone - a nie wobec ponownie zmierzonej kopii - więc odzyskany moduł i faza to prawdziwa funkcja przejścia urządzenia.
tip.13.title = Ctrl+F1 przeskakuje prosto do właściwej pomocy.
tip.13.body = Naciśnij F1 w dowolnym miejscu, aby otworzyć podręcznik, lub Ctrl+F1, aby otworzyć pomoc w dokładnej sekcji dotyczącej kontrolki, która ma obecnie fokus.
tip.14.title = Widok reszty pokazuje, co kryje się pod składową podstawową.
tip.14.body = Przełącz kanał na „Reszta", a oscyloskop narysuje przechwycony sygnał pomniejszony o najlepiej dopasowany ton - zniekształcenia, szum i zakłócenia zagrzebane pod składową podstawową stają się widoczne. Tryb dwutonowy też działa: obie częstotliwości są mierzone z samego przechwyconego sygnału, więc swobodnie biegnące zegary DAC i ADC nie rozmyją odejmowania.
tip.15.title = Nałóż idealny filtr na zmierzoną charakterystykę.
tip.15.body = Zakładka Filtry modułu Charakterystyki częstotliwościowej zakotwicza idealny filtr dolnoprzepustowy, górnoprzepustowy, pasmowoprzepustowy lub zaporowy (Butterworth, Czebyszew, odwrotny Czebyszew, eliptyczny, Bessel) na zmierzonej krzywej, a Porównanie wykreśla odchylenie od niego - tak samo jak względem RIAA.
tip.16.title = Pozwól odczytowi Nierównomierności ocenić płaskość za ciebie.
tip.16.body = Na zakładce Nierównomierność znajdź krawędzie pasma, przy których charakterystyka po raz pierwszy opuszcza korytarz ±X dB od swojego szczytu (lub od minimum dla filtra zaporowego), albo odczytaj odchylenie ± w wybranym zakresie - z adnotacjami bezpośrednio na wykresie, a liczby są rysowane jako nakładana tabela na krzywej.
tip.17.title = Kalibracja pełnej skali należy do karty dźwiękowej.
tip.17.body = Każda karta przechowuje własny profil: jeden wiersz na tłumik lub zakres przełączników DIP, osobne wartości dla lewego i prawego kanału, dopasowywane po nazwie urządzenia w każdym mechanizmie - więc zmiana urządzenia lub mechanizmu nigdy nie pomiesza kalibracji. Znane karty są oferowane wstępnie skonfigurowane; twoja kalibracja celownikiem je doprecyzowuje.
tip.18.title = Wysterowuj tylko ten kanał, który mierzysz.
tip.18.body = Generator, przemiatanie charakterystyki częstotliwościowej i strojenie filtra zaporowego mają każde swój selektor Kanał wyjściowy - Oba, tylko Lewy lub tylko Prawy - który na żywo bramkuje wysterowywany tor. Przydatny przy sprawdzaniu przesłuchów i przy urządzeniach z jednym wejściem.
tip.19.title = Przy dużym oddaleniu oscyloskop renderuje jak prawdziwy DSO.
tip.19.body = Powyżej jednej próbki na piksel przebieg staje się obrazem cyfrowego luminoforu: histogram przebywania każdej kolumny, kreślony piórem o skonfigurowanej grubości linii - wąskie impulsy i obwiednie dudnień zachowują prawdziwą wartość międzyszczytową przy każdym powiększeniu, a jasność pokazuje, gdzie sygnał przebywa.
tip.20.title = Zakłócone przechwyty nigdy nie zatrują długiego uśredniania.
tip.20.body = FFT odrzuca bloki zawierające sklejenia, zaniki lub zakłócenia naruszające ograniczenie pasma, zanim wejdą do średniej, po czym synchronizuje się ponownie i uśrednia dalej. Dla małego lub niesinusoidalnego sygnału, który wyzwala tę bramkę w każdym bloku, odznacz „Wykrywaj nieciągłość w czasie" na zakładce ustawień FFT.
tip.21.title = SNR i ENOB pozostają rzetelne przy szerokim lub zaszumionym tonie.
tip.21.body = Te miary szumu wykluczają nie tylko składową podstawową i jej harmoniczne, ale całą jej spódnicę wycieku i szumu fazowego - wykluczane pasmo poszerza się, śledząc szeroki lub drżący ton aż do poziomu szumu, więc szeroka spódnica nigdy nie zawyża SNR ani ENOB.
tip.22.title = Pomiń jednostkę - same cyfry oznaczają jednostkę podstawową.
tip.22.body = Wpisz samą liczbę, a pole przyjmie ją w swojej jednostce podstawowej - 1000 w polu częstotliwości to 1000 Hz, w polu amplitudy 1000 V, w polu czasu 1000 s. Kiloherce mają też formy skrócone: 1.5k, 1.5kh i 1.5khz oznaczają 1.5 kHz.
tip.23.title = Przeciągnij prostokąt, aby przybliżyć dokładnie ten obszar.
tip.23.body = W widokach oscyloskopu, FFT i charakterystyki częstotliwościowej przeciągnij lewym przyciskiem, aby rozciągnąć ramkę wokół interesującego cię obszaru - po zwolnieniu wypełni on cały widok. Ctrl+Z cofa przez ostatnie 32 przybliżenia widoku pod wskaźnikiem.
tip.24.title = Ustaw dither w dBV i odczytaj go wprost z poziomu szumu FFT.
tip.24.body = Pole ditheru generatora przyjmuje wartość w bitach lub poziom w dBV, a wartość w dBV uwzględnia już pasmo szumowe okna FFT - więc przy uśrednianiu niekoherentnym (mocy) poziom szumu FFT ląduje dokładnie tam, gdzie go ustawisz: wpisz −100 dBV, a poziom szumu usiądzie na −100 dBV. Uśrednianie koherentne znosi szum, więc odczyt jest znacznie niższy.
tip.25.title = Sprzęt nie musi stać na twoim biurku.
tip.25.body = Uruchom Phonalyser jako serwer na maszynie, do której podłączone są twoje przetworniki, a następnie naciśnij „Serwery..." w Preferencjach → Audio. Tabela otwiera się pusta: raz wpisz adres i port tamtego stanowiska (domyślnie 8377) w „Dodaj serwer ręcznie", a resztę uzupełni jego własna tabela serwerów. Jego mechanizmy dołączają wtedy do listy mechanizmów, a urządzenia, karty, kalibracja, generator i przemiatania działają tak, jakby karta była wpięta tutaj.
tip.26.title = Urządzenie stanowiskowe, na którym mierzy ktoś inny, samo to zgłasza.
tip.26.body = Każde urządzenie serwera jest w danej chwili zablokowane dla jednego klienta, a urządzenie trzymane przez innego operatora wyświetla na liście urządzeń „używane przez" wraz z nazwą tego klienta - dowiesz się więc, zanim rozpoczniesz przechwytywanie, a nie po fakcie.
tip.27.title = Dzięki dBr odczytasz harmoniczne wprost z osi.
tip.27.body = Przełącz jednostkę amplitudy FFT na dBr, a składowa podstawowa stanie dokładnie na 0, więc każda harmoniczna i każdy prążek pasożytniczy odczytuje się wprost jako „tyle a tyle dB poniżej tonu". Odniesieniem jest wyświetlana składowa podstawowa, odczytywana ponownie przy każdym przerysowaniu, więc podąża za dryfującym poziomem.
tip.28.title = Wpisz poziom wyjściowy w dBFS, gdy chodzi ci o pełną skalę.
tip.28.body = Generator, przemiatanie charakterystyki częstotliwościowej i kreator strojenia filtra zaporowego przyjmują amplitudę w dBFS - przyrostek dbfs lub skrócony dbf - i nadal wyświetlają ją w tej jednostce. 0 dBFS to sinusoida pełnej skali, więc liczba nie zmienia znaczenia po zmianie kształtu przebiegu.
tip.29.title = Histogram amplitudy odróżnia obcinanie od szumu na pierwszy rzut oka.
tip.29.body = Otwórz go z paska narzędzi oscyloskopu: sinusoida rysuje wannę z dwoma punktami zwrotnymi, szum szerokopasmowy - dzwon Gaussa, a sygnał obcięty - ostry szpic w miejscu ograniczenia zasilania. Przebieg obcięty tylko z jednej strony widać jako nierówne słupki po obu stronach linii środkowej.
tip.30.title = Zakres wejściowy QA40x „0 dBV" to nie 0 dBV RMS.
tip.30.body = Tabela zakresów mówi to wprost - 0 "dBV" real 0 dBFS or -9 dBV - ponieważ zakres wejściowy QA to międzyszczytowe odniesienie dBFS na parze różnicowej, którego prawdziwa pełna skala RMS leży około 9 dB niżej. Zakresy wyjściowe są prawdziwymi dBV.
tip.31.title = Twoja kalibracja może pojechać z tobą na stanowisko.
tip.31.body = Wybierz urządzenie serwera bez kalibracji, gdy ta maszyna ma pasującą do niego skalibrowaną kartę, a Phonalyser zaproponuje skopiowanie wartości - raz na sesję i nigdy po cichu. Odmów, a nic nie zostanie zapisane.
tip.32.title = QA403 pracuje z 384 kHz; QA402 nie.
tip.32.body = Lista częstotliwości podąża za faktycznie podłączonym analizatorem - rejestr częstotliwości próbkowania ma czwarty kod, który ma tylko QA403. Przechwytywanie i generator pracują z tą częstotliwością, którą wybierzesz, ponieważ oba kierunki dzielą jeden zegar sprzętowy.
tip.33.title = QA40x może wysterować przetwornik wprost ze swojego portu I2S na panelu przednim.
tip.33.body = Włącz port w oknie „Preferencje QA40x", a lista głębi bitowej wyjścia zaoferuje 16 i 32 bity portu zamiast 24 bitów analizatora, podczas gdy wejście przez cały czas pozostaje na 24. To funkcja eksperymentalna: QuantAsylum dokumentuje złącze, ale nie rejestry, które je włączają.
tip.34.title = Długiego przemiatania nie trzeba już przeczekiwać.
tip.34.body = Okno postępu charakterystyki częstotliwościowej ma przycisk „Anuluj". Przerwanie jest kooperacyjne - przemiatanie kończy się zwykłą ścieżką zatrzymania, więc okno zamyka się, a panel odblokowuje dokładnie tak jak po ukończonym przebiegu, oddając przechwytywanie i generator.
tip.35.title = Gładko wyglądająca charakterystyka częstotliwościowa i tak może być obcięta.
tip.35.body = Jeśli przechwyt dobił do pełnej skali, ostrzeżenie pojawi się, gdy tylko narysuje się krzywa. Dekonwolucja zamienia nagranie oparte o ograniczenie zasilania w drobne, regularne tętnienie, które wygląda raczej na szum niż na uszkodzenie, więc zmniejsz poziom wysterowania, zamiast ufać krzywej.
tip.36.title = Każdą charakterystykę częstotliwościową na ekranie można zapisać.
tip.36.body = Zakładka „Zapisz do..." zapisuje wyświetlaną krzywą do pliku bez żadnego progu jakości - przemiatanie właśnie wykonane, prowadzone łagodnie albo wczytane z dysku. Jedyne, czego wymaga, to żeby pomiar w ogóle istniał.
tip.37.title = Wepnij kartę bez restartu aplikacji.
tip.37.body = „Szukaj urządzeń" w Preferencjach → Audio ponownie wylicza listę urządzeń przeglądarki, na nowo składa listę mechanizmów - właśnie dzięki temu QA40x wpięty po uruchomieniu w ogóle pojawia się jako mechanizm - i ponownie pyta podłączone stanowisko o jego mechanizmy.
tip.38.title = Preferencje mówią ci, kiedy twoje wolty są zgadywaniem.
tip.38.body = Zamknięcie zakładki Audio po zmianie mechanizmu lub urządzenia sprawdza, czy zatwierdzony wybór naprawdę prowadzi do zmierzonej pełnej skali, i wskazuje wejście, wyjście albo oba, gdy tak nie jest. Karta powiązana z urządzeniem, ale przechowująca zera, liczy się jako nieskalibrowana - pusty wiersz nie jest pomiarem.
tip.39.title = Martwe wejście zgłasza to zamiast rysować płaską linię.
tip.39.body = Odłącz kartę albo pozwól innej aplikacji przejąć ją na wyłączność, a oscyloskop i FFT zatrzymają się z jednym oknem dialogowym, które wskaże mechanizm i powie, czy urządzenie zostało utracone, czy tylko przestało dostarczać próbki. Strona odtwarzania jest nadzorowana tak samo.
tip.40.title = Zapisane ustawienie, którego nie da się przetworzyć, nigdy nie zostaje nadpisane.
tip.40.body = Twoje ustawienia i karty żyją w pamięci lokalnej przeglądarki, a nie w plikach. Wartość, której nie da się przetworzyć, jest kopiowana obok pod ten sam klucz z przyrostkiem .corrupt, a praca zaczyna się od wartości domyślnych, więc każda zawarta w niej kalibracja przetrwa do odzyskania, zamiast zostać zabetonowaną kolejnym zapisem.

