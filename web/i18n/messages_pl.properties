fft.settings.alignGen = Wyrównaj generator
fft.settings.alignGen.tooltip = Naprowadź generator na dokładny środek prążka FFT. Brak pozostawia go swobodnym; FLL zamyka pętlę synchronizacji częstotliwości. Wymaga włączonego przyciągania do prążka i składowej podstawowej z generatora.
fft.settings.coherent = Uśrednianie spójne
fft.settings.coherent.tooltip = Wyrównaj fazowo składową podstawową każdej ramki przed uśrednianiem, aby ton się sumował, a szum znosił - znacznie niższy poziom szumu, ale wymaga stabilnego tonu. Wyłączone = zwykłe uśrednianie mocy.

