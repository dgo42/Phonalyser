# ===== TIP OF THE DAY =====

tip.dialog.heading = Päeva nõuanne
tip.dialog.dontShowAgain = Ära enam näita
tip.dialog.next = Järgmine nõuanne
tip.dialog.close = Sulge
tip.dialog.closeCountdown = Sulge ({0} s)
tip.count = 25
tip.1.title = Koherentne keskmistamine kaevub kaugele mürapõhjast allapoole.
tip.1.body = Jäta koherentne (kompleks-) keskmistamine sisse ja lase FFT-l töötada — toon liitub, samal ajal kui müra osaliselt taandub, nii et põhi langeb mida kauem ootad.
tip.2.title = Lukusta generaator FFT bini, et saada puhas spekter.
tip.2.body = Kui „Lukusta sagedus lähimale“ on sees, langeb toon täpselt bini keskele, nii et leke ei määri põhitooni laiali ja harmooniliste hinnangud jäävad ausaks.
tip.3.title = Fikseeri põhitoon käsitsi kaksik-T sälgu juures.
tip.3.body = Passiivne kaksik-T null on nii järsk, et paar kümnendikku hertsi termilist triivi kõigutab de-embeditud põhitooni. Sisesta tase, mida tegelikult tead, väljaga „Käsitsi põhitoon“; harmoonilised, õrnal nõlval, de-embeduvad korralikult.
tip.4.title = WASAPI eksklusiivrežiim hoiab mõõtmise bititäpse.
tip.4.body = Eksklusiivrežiim annab seadme otse Phonalyserile, möödudes Windowsi mikserist ja selle diskreetimissageduse muundurist — mingit varjatud ümberdiskreetimist tulemuse värvimiseks.
tip.5.title = WDM-KS annab ostsilloskoobile kõige rohkem kaadreid sekundis.
tip.5.body = Kiireima reaalaja skoobi värskendamiseks vali eelistustes WDM-KS taustamootor — see asub WASAPI-st madalamal ja lükkab rohkem hõiveplokke sekundis.
tip.6.title = Hiireratas suumib kursori ümber.
tip.6.body = Igas jälje vaates: ratas liigutab vertikaalselt, Shift+ratas horisontaalselt, Ctrl+ratas suumib vertikaaltelge ja Ctrl+Shift+ratas horisontaaltelge — mõlemad suumid hoiavad kursori all oleva väärtuse paigal.
tip.7.title = Iga numbriväli võtab ühikuid, ratast ja klaviatuuri.
tip.7.body = Trüki väärtus koos ühikuga (µV, 1.5 V, -3 dBV, 2 kHz), keri ratast, klõpsa üles/alla nooli või vajuta klaviatuuri üles/alla klahve sammu astumiseks.
tip.8.title = Sinc-interpolatsioon loeb ainult siis, kui oled sisse suumitud.
tip.8.body = Sin/Lin lüliti muudab jälge ainult siis, kui diskreedipunktid on ekraanil paari piksli kaugusel; muidu näevad sirgjooned identsed välja ja maksavad vähem protsessorit. Lülita see sisse, kui üksikud diskreedid on nähtavad.
tip.9.title = Hüsterees stabiliseerib päästiku nõrgal, mürarikkal signaalil.
tip.9.body = Ilma selleta käivitab müra päästiku taseme ümber hulga valepäästikuid ja jälg väriseb. Luba päästiku hüsterees ja jälg lukustub.
tip.10.title = Salvestatud generaatori signaal on täiuslik etalon.
tip.10.body = „Salvesta…“ kirjutab ideaalse, matemaatiliselt täpse lainekuju — ilma DAC-i, võimendi või kaabelduse moonutusteta. Söödo see teisele instrumendile ja iga ebatäius, mida mõõdad, kuulub sellele seadmele, mitte allikale.
tip.11.title = De-embedi seade kalibreerimisfailiga.
tip.11.body = Mõõda sälk, summuti või helikaardi vastus üks kord sagedusvastuse moodulis, seejärel lae see .frc FFT-analüsaatorisse: selle vastus jagatakse kuvamise ajal välja, nii et tabel näitab mõõdetavat seadet.
tip.12.title = Rekonstrueeritud löögisageduse ülekate taltsutab lähedase kahetooni paari.
tip.12.body = Kahetooni režiimis joonistab skoobi „Rekonstrueeritud löögisagedus“ ülekate aeglase |f1 - f2| ümbriku, nii et saad päästikuks võtta löögisageduse, mitte jälitada kiireid kandetooni läbiminekuid.
tip.13.title = Sagedusvastuse pühe on iseenda etalon.
tip.13.body = Pühitud mõõtmine dekonvolveeritakse täpselt mängitud pühe vastu — mitte uuesti mõõdetud koopia vastu — nii et taastatud amplituud ja faas on seadme tegelik ülekandefunktsioon.
tip.14.title = Ctrl+F1 hüppab otse õige abi juurde.
tip.14.body = Vajuta käsiraamatu jaoks ükskõik kus F1 või Ctrl+F1, et avada abi täpselt selle juhtelemendi jaotises, millel on praegu fookus.
tip.15.title = Jäägivaade näitab, mis peitub põhitooni all.
tip.15.body = Lülita kanal olekusse „Jääk“ ja skoop joonistab hõivatud signaali, millest on lahutatud selle parim sobitatud toon — põhitooni alla maetud moonutus, müra ja tõrked muutuvad nähtavaks. Toimib ka kahetooni režiimis: mõlemad sagedused mõõdetakse hõivest endast, nii et vabalt jooksvad DAC-i ja ADC-i kellad ei saa lahutamist laiali määrida.
tip.16.title = Aseta ideaalne filter mõõdetud vastuse peale.
tip.16.body = Sagedusvastuse mooduli vahekaart Filtrid ankurdab ideaalse madalpääsu-, kõrgpääsu-, ribapääsu- või sälkfiltri (Butterworth, Tšebõšov, pöörd-Tšebõšov, elliptiline, Bessel) mõõdetud kõverale ning Võrdle joonistab hälbe sellest — täpselt samamoodi nagu RIAA suhtes.
tip.17.title = Lase Ebaühtluse näidul tasasust sinu eest hinnata.
tip.17.body = Vahekaardil Ebaühtlus leia ribaservad, kus vastus lahkub esimest korda ±X dB koridorist oma tipu suhtes (või sälgu puhul oma miinimumi suhtes), või loe ± hälvet valitud vahemikus — märgituna otse graafikule, koos lahtihaagitava mõõtmiste aknaga.
tip.18.title = Täisskaala kalibreerimine kuulub helikaardile.
tip.18.body = Iga kaart hoiab oma profiili: üks rida iga summuti- või DIP-vahemiku kohta, eraldi vasaku / parema väärtused, sobitatud seadme nime järgi igas taustamootoris — nii et seadmete või taustamootorite vahetamine ei aja kalibreerimisi kunagi segamini. Tuntud kaarte pakutakse eelseadistatuna; sinu niitristiga kalibreerimine täpsustab neid.
tip.19.title = Käita ainult seda kanalit, mida mõõdad.
tip.19.body = Generaatoril, sagedusvastuse pühkel ja sälgu häälestajal on igaühel Väljundkanali valija — Mõlemad, ainult Vasak või ainult Parem — mis lülitab käitatavat rada reaalajas. Käepärane ülekoste kontrollimiseks ja ühe sisendiga seadmete jaoks.
tip.20.title = Kaugele välja suumituna renderdab skoop nagu päris DSO.
tip.20.body = Üle ühe diskreedi piksli kohta muutub jälg digitaalfosfori pildiks: iga veeru viibimishistogramm, pühitud seadistatud jäljelaiusega sulega — kitsad impulsid ja löögisageduse ümbrikud säilitavad oma tõelise tipust-tippu väärtuse igal suumil ning heledus näitab, kus signaal viibib.
tip.21.title = Tõrgetega hõived ei mürgita kunagi pikka keskmistamist.
tip.21.body = FFT lükkab plokid, mis sisaldavad õmblusi, katkestusi või ribapiiri rikkuvaid tõrkeid, tagasi enne keskmisse jõudmist, seejärel sünkroonib end uuesti ja keskmistab edasi. Väikese või mittesiinuselise signaali puhul, mis käivitab värava igal plokil, eemalda linnuke valikult „Tuvasta ajaline katkevus“ FFT seadete vahekaardil.
tip.22.title = SNR ja ENOB jäävad ausaks ka laia või mürarikka tooni korral.
tip.22.body = Müranäitajad ei välista mitte ainult põhitooni ja selle harmoonilisi, vaid kogu selle lekke- ja faasimüra hõlma — välistatud riba laieneb, et järgida laia või värelevat tooni kuni põhjani, nii et lai hõlm ei paisuta kunagi SNR-i ega ENOB-i.
tip.23.title = Jäta ühik ära — pelgad numbrid tähendavad põhiühikut.
tip.23.body = Trüki lihtsalt number ja väli võtab selle põhiühikus — 1000 sagedusväljal on 1000 Hz, amplituudiväljal 1000 V, ajaväljal 1000 s. Kilohertsil on ka lühivormid: 1.5k, 1.5kh ja 1.5khz tähendavad kõik 1.5 kHz.
tip.24.title = Lohista ristkülik, et suumida täpselt sellesse piirkonda.
tip.24.body = Ostsilloskoobi, FFT ja sagedusvastuse vaadetes lohista vasaku nupuga, et tõmmata kummipael ümber huvipakkuva ala — vabastamisel täidab see vaate. Ctrl+Z astub tagasi läbi kursori all oleva vaate viimase 32 suumi.
tip.25.title = Määra dither dBV-des ja loe see otse FFT mürapõhjalt maha.
tip.25.body = Generaatori dither-väli võtab kas bitte või dBV taseme ning dBV sisaldab juba FFT akna müra ribalaiust — nii et mittekoherentse (võimsus-) keskmistamise korral maandub FFT mürapõhi täpselt sinna, kuhu selle seadsid: sisesta −100 dBV ja põhi jääb −100 dBV peale. Koherentne keskmistamine kustutab müra ja näitab tunduvalt madalamat.

