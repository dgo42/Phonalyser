preferences.freqResp.maxFreqPctNyquist = Maksimaalne analüüsitud sagedus, % Nyquistist
preferences.freqResp.maxFreqPctNyquist.tooltip = Piirab FreqResp vaate ülempiiri sellele osale Nyquistist (diskreetimissagedus / 2).  96–100 %.  100 % = range Nyquist; madalamad väärtused kärbivad riba, kus dekonvolutsiooni tuuma energia langeb.
preferences.freqResp.compareSmoothWindow = Võrdluse silumisaken, 1/N oktav
preferences.freqResp.compareSmoothWindow.tooltip = Võrdlusrežiimi (mõõdetud − etalon) kõverale rakendatud libiseva keskmise filtri laius, väljendatuna 1/N-oktavi ühikutes.  N = 0 keelab silumise.  Väiksem N = laiem aken = rohkem silumist (N=3 ≈ 1/3-oktav, lai), suurem N = kitsam = kergem (N=24 ≈ 1/24-oktav, audio standard).
preferences.freqResp.notch.enable = Luba sälkfilter tööstusmüra jaoks
